# Builds the launcher and the payloads (./build.sh) into windows-arcade-loader-<version>.tar.gz,
# the Batocera emulator folder's layout (tools/batocera/install.sh: arcade-launcher, payloads/,
# systemprofiles/, launcher.yaml, the GUI wrapper and icon).
# - a pushed tag: published as the GitHub release of that tag (<version> = the tag)
# - run by hand (Actions tab, "Run workflow"): the tarball as the run's artifact only, no release
#   (<version> = the branch and the commit's short hash)
name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # glibc 2.39: the launcher must run on Batocera (glibc 2.40)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          # mingw: the Windows payloads; mono: TMNT's input bridge (mcs -sdk:2); cmake: SDL3
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64 mono-mcs mono-devel cmake pkg-config
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add i686-pc-windows-gnu x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          # Ubuntu 24.04 has no SDL3 package: built from source, still linked as libSDL3.so.0
          LAUNCHER_FEATURES: sdl3/build-from-source
        run: ./build.sh

      - name: Check the launcher's glibc
        run: |
          glibc=$(objdump -T dist/arcade-launcher | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "launcher needs $glibc"
          [ "$(printf '%s\nGLIBC_2.40\n' "$glibc" | sort -V | tail -1)" = GLIBC_2.40 ]

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=$GITHUB_REF_NAME-${GITHUB_SHA::7}; fi
          name=windows-arcade-loader-${version//\//-}
          echo "NAME=$name" >> "$GITHUB_ENV"
          tools/batocera/install.sh "staging/$name"
          tar -C staging -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.tar.gz.sha256

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$NAME.tar.gz" "$NAME.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
