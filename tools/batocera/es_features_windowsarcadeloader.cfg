<?xml version="1.0" encoding="UTF-8" ?>
<features>
  <emulator name="windows-arcade-loader" features="">
    <cores>
      <core name="windows-arcade-loader" features="">
        <sharedFeature value="videomode" />
        <!-- GAMESCOPE: started by the launcher (over the game profile's gamescope settings) -->
        <sharedFeature value="gamescope" />
        <sharedFeature value="gamescope_nested_resolution" />
        <sharedFeature value="gamescope_output_resolution" />
        <sharedFeature value="gamescope_nested_refresh" />
        <sharedFeature value="gamescope_scaler" />
        <sharedFeature value="gamescope_filter" />
        <sharedFeature value="gamescope_sharpness" />
        <sharedFeature value="gamescope_windows_mode" />
        <sharedFeature value="gamescope_hdr" />
        <sharedFeature value="gamescope_sdr_gamut_wideness" />
        <sharedFeature value="gamescope_hdr_sdr_content_nits" />
        <sharedFeature value="gamescope_hdr_itm_enabled" />
        <sharedFeature value="gamescope_hdr_itm_sdr_nits" />
        <sharedFeature value="gamescope_hdr_itm_target_nits" />
        <sharedFeature value="gamescope_reshade_effect" />
        <feature name="ROTATION (RESHADE BEZEL)" value="wal_reshade" description="Vertical games whose dump ships a ReShade setup (Shikigami no Shiro III, GigaWing Generations, KOF Sky Stage, Super Alpine Racer...): rotate them to the landscape screen with a bezel. Off, the game's own picture (portrait). Default: the game's profile (on).">
          <choice name="On" value="1" />
          <choice name="Off" value="0" />
        </feature>
        <feature name="KEEP ASPECT RATIO" value="keep_aspect_ratio" description="Games whose picture the loader scales to the screen (Gashaaaan, 2.67:1): its aspect kept, black bars. Off, stretched to the whole screen. Default: the game's profile (Gashaaaan: stretched).">
          <choice name="On" value="on" />
          <choice name="Off" value="off" />
        </feature>
        <feature name="RENDERER" value="wal_renderer" description="Direct3D through DXVK (Vulkan) or Wine's own WineD3D (OpenGL). Default: the game's profile.">
          <choice name="DXVK" value="dxvk" />
          <choice name="WineD3D" value="wined3d" />
        </feature>
        <feature name="MOUSE AS GUN" value="wal_mouse_guns" description="Gun games: mice and touchpads aim as guns for the players without a lightgun.">
          <choice name="On (Default)" value="1" />
          <choice name="Off" value="0" />
        </feature>
        <feature name="CROSSHAIRS" value="wal_crosshair" description="Gun games able to show them (Point Blank X, Gashaaaan, Elevator Action Death Parade...; touch pointers of Winning Eleven 2012, Yu-Gi-Oh!, Steel Chronicle): each player's crosshair where the gun or mouse aims. Default: the game's profile.">
          <choice name="On" value="1" />
          <choice name="Off" value="0" />
        </feature>
        <feature name="SINDEN BORDER" group="LIGHT GUN" value="wal_sinden_border" description="Frame around the whole screen. The game is scaled inside it. Auto: enabled for gun games when a Sinden is connected.">
          <choice name="Automatic" value="auto" />
          <choice name="On" value="1" />
          <choice name="Off" value="0" />
        </feature>
        <feature name="BORDER SIZE" group="LIGHT GUN" value="wal_sinden_border_size" description="Default: the system lightgun border size. Thickness is a percentage of screen width.">
          <choice name="Thin (1%)" value="thin" />
          <choice name="Medium (2%)" value="medium" />
          <choice name="Big (2% + black outline)" value="big" />
          <choice name="1.5%" value="1.5" />
          <choice name="3%" value="3" />
          <choice name="5%" value="5" />
        </feature>
        <feature name="BORDER COLOR" group="LIGHT GUN" value="wal_sinden_border_color" description="Default: the system lightgun border color.">
          <choice name="White" value="white" />
          <choice name="Red" value="red" />
          <choice name="Green" value="green" />
          <choice name="Blue" value="blue" />
        </feature>
        <feature name="FREE PLAY" value="wal_freeplay" description="Games start without coins, where the loader can set it (Sega ALLS APM3, Konami, Sega Shell, Europa-R, UNIS, WMMT5 terminal). Off: insert coins.">
          <choice name="On (Default)" value="1" />
          <choice name="Off" value="0" />
        </feature>
        <feature name="KEYBOARD" value="wal_keyboard" description="Keyboard controls (5 coin, 1 start, arrows, Ctrl/Alt/Space/Shift buttons, F1 service, F2 test).">
          <choice name="On (Default)" value="1" />
          <choice name="Off" value="0" />
        </feature>
      </core>
    </cores>
  </emulator>
</features>
