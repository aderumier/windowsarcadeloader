# Batocera machine settings of the Windows arcade loader (layer 2 of every game profile,
# see systemprofiles/ and the launcher's defaults.yaml). Paths relative to this directory.

# GE-Proton build with the loader's runner hotfixes, copied as
# /userdata/system/wine/custom/GE-Proton11-7-x86_64.
runners_dir: /userdata/system/wine/custom
runner: GE-Proton11-7-x86_64
payloads_dir: payloads

# SquashFS images started by the launcher itself (GUI): their writes with those of the games
# started from EmulationStation (configgen: /userdata/saves/<system>/<image name>).
squashfs_saves: /userdata/saves
