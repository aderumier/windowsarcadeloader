# Built-in defaults of every game profile.
#
# Layers, each one deep-merged over the previous (maps are merged key by key, other
# values replaced):
#   1. this file
#   2. <root>/launcher.yaml                         (optional, machine wide settings)
#   3. <root>/systemprofiles/<system>/<game>.yaml   (game template)
#   4. <root>/userprofiles/<system>/<game>.yaml     (user overrides, optional)
# Relative paths are relative to <root>.

# Emulated arcade system (nesica, ...). Required.
system: null
name: null
# The game executable comes from the dump: <dump>/<gameid>.windowsloader holds its path
# relative to the dump root (the whole dump root is mirrored into the run directory).
args: []

runner: GE-Proton11-7-x86_64
runners_dir: wine-runners
prefix: wine-prefix/common
# New WoW64 mode (WINEARCH=wow64): 32-bit games use the 64-bit host libraries, no lib32
# packages needed. false: classic mode, 32-bit games need 32-bit host libraries
# (pulse, alsa, freetype... in lib32_dirs).
wow64: true
# Built payload DLLs (build.sh output).
payloads_dir: dist/payloads
wine_debug: "-all"
# d3d8-11/dxgi through the runner's DXVK (false: wine builtin wined3d).
dxvk: true
# Runner whose DXVK is used when the runner has none (plain wine builds), e.g.
# GE-Proton11-7-x86_64. Empty: none.
dxvk_from: ""
# DirectDraw: wine (builtin), d7vk (runner's ddraw->vulkan), dgvoodoo (the game's DDraw.dll).
graphics: wine
# System library directories, before the runner's i386-unix / x86_64-unix ones
# (empty: auto, /lib32 or /usr/lib32 and /lib, /usr/lib).
lib32_dirs: []
lib64_dirs: []
# winetricks verbs applied once to the prefix (recorded in <prefix>/.wal-tricks). The prefix
# is shared by the games using it, keep this list short.
tricks: []
# Game files hidden from the run directory (case insensitive).
hide: []
# ReShade setup shipped by some dumps (rotation of vertical games to a landscape screen with a
# bezel): its files, as the profile lists them (ReShade DLLs and what they chain to, e.g.
# d3d8to9 or dgVoodoo). true uses them when the dump has them (they load before DXVK/wined3d),
# false hides them (the game's own picture, portrait for vertical games).
reshade: true
reshade_files: []
# The executable loads at its preferred base (a copy without DYNAMIC_BASE in the run
# directory, the dump untouched): for executables whose hex edits left absolute addresses the
# relocations do not cover (Haunted Museum II: crash on a non-relocated address).
exe_fixed_base: false
# Runs the game in gamescope (its own X server, the picture scaled to the screen): for games
# needing a screen mode the desktop does not have (Gundam Spirits of Zeon 2 players: 1280x480).
# width/height: the game's screen (gamescope -w/-h), args: the rest (output, scaler, window).
gamescope:
  enabled: false
  bin: gamescope
  width: 0
  height: 0
  args: [-S, stretch, -f]
# Files copied into the run directory next to the executable, in place of the game's own:
# <name in the run directory>: <source, relative to the root> (e.g. a missing config file).
# A name with a folder ("dir/file") is a path from the game root.
files: {}
# Files copied into the dump only when it does not have them yet (default settings or
# calibration the game then keeps updating): <path from the dump root>: <source>.
initial_files: {}
# Extra environment variables of the game process (system options, wine settings).
env: {}
# Virtual stick -> native inputs of the system, for the payload (none = unmapped).
native_map: {}

# TCP port of the input server the payload connects to.
port: 33700

input:
  # Analog -> digital threshold.
  deadzone: 12000
  # The left stick also drives the d-pad.
  stick_as_dpad: true
  # Physical gamepad buttons held together to quit the game.
  exit_combo: [back, start]

  # SDL gamepads (positional names, Xbox labels) -> virtual arcade stick of the
  # player owning the pad (pads take players 1, 2... in connection order).
  #   buttons: a b x y l1 r1 l2 r2 l3 r3 start back guide dpup dpdown dpleft dpright
  #            misc1 paddle1-4 touchpad
  #   axes:    leftx lefty rightx righty l2 r2, +leftx/-leftx for one half
  # Virtual stick: b1-b8, up down left right, start coin service test, card (toggle),
  #   lx ly rx ry accel brake (axes, -ly inverts), none
  # Layout: top row b1 b2 b3 b4 = X Y R1 L1, bottom row b5 b6 b7 b8 = A B R2 L2.
  gamepad:
    x: b1
    y: b2
    r1: b3
    l1: b4
    a: b5
    b: b6
    r2: b7
    l2: b8
    start: start
    back: coin
    # stick clicks: the cabinet's service and test switches
    l3: service
    r3: test
    dpup: up
    dpdown: down
    dpleft: left
    dpright: right
    leftx: lx
    lefty: ly
    rightx: rx
    righty: ry

  # Keyboards (evdev key names) -> virtual stick, per player.
  keyboard_enabled: true
  keyboard:
    p1:
      KEY_UP: up
      KEY_DOWN: down
      KEY_LEFT: left
      KEY_RIGHT: right
      KEY_LEFTCTRL: b1
      KEY_LEFTALT: b2
      KEY_SPACE: b3
      KEY_LEFTSHIFT: b4
      KEY_Z: b5
      KEY_X: b6
      KEY_C: b7
      KEY_V: b8
      KEY_1: start
      KEY_5: coin
      KEY_F1: service
      KEY_F2: test
      KEY_F4: card
    p2:
      KEY_R: up
      KEY_F: down
      KEY_D: left
      KEY_G: right
      KEY_A: b1
      KEY_S: b2
      KEY_Q: b3
      KEY_W: b4
      KEY_2: start
      KEY_6: coin
    # Players 3/4: MAME's 4-player keys.
    p3:
      KEY_I: up
      KEY_K: down
      KEY_J: left
      KEY_L: right
      KEY_RIGHTCTRL: b1
      KEY_RIGHTSHIFT: b2
      KEY_ENTER: b3
      KEY_3: start
      KEY_7: coin
    p4:
      KEY_KP8: up
      KEY_KP2: down
      KEY_KP4: left
      KEY_KP6: right
      KEY_KP0: b1
      KEY_KPDOT: b2
      KEY_KPENTER: b3
      KEY_4: start
      KEY_8: coin

  # Lightguns and mice aiming like guns (as batocera-wine-guns), for gun games: guns (udev
  # ID_INPUT_GUN=1, or absolute pointers) take players 1, 2... in device order, then mice
  # (guns_mouse) the remaining players. Not grabbed: the game still sees them as X11 mice.
  guns_enabled: false
  guns_mouse: true
  # Most mice used as guns (0: all). A laptop's TrackPoint and touchpad report the same
  # button press: two guns firing at once for one click (set 1).
  guns_mice: 0
  # Mouse motion: a virtual screen of this many pixels spans the whole axis.
  mouse_screen: [1920, 1080]
  # Gun/mouse -> virtual stick of its player. Sources: x y (position, -32768 left/top ..
  # 32767), offscreen (gun pointing off the screen), evdev buttons (BTN_LEFT...).
  # Lightgun buttons as batocera-wine-guns: BTN_LEFT trigger, BTN_RIGHT action, BTN_MIDDLE
  # start, BTN_1 coin, BTN_5-8 d-pad. Profiles of gun games usually set stick_as_dpad: false.
  gun:
    x: lx
    y: ly
    BTN_LEFT: b1
    BTN_RIGHT: b2
    BTN_MIDDLE: start
    BTN_1: coin
    BTN_2: b3
    BTN_5: up
    BTN_6: down
    BTN_7: left
    BTN_8: right

  # Devices with their own mapping, by case insensitive substring of the SDL name.
  # Wheels and other non-gamepad joysticks are only used when listed here, with raw
  # sources: button0, axis1, +axis2/-axis2 (one half), hat0up/down/left/right.
  #   "G29":
  #     player: 1          # force the player
  #     raw: true          # raw sources even if SDL knows it as a gamepad
  #     map: {axis0: lx, axis2: -accel, axis3: -brake, button0: b1}
  devices: {}
