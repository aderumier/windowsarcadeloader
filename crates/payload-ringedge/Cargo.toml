[package]
name = "wal-payload-ringedge"
description = "Sega RingEdge payload: amLib devices (SRAM, SMBus EEPROM, super I/O), system services (keychip, master) and the JVS I/O board, loaded by wal-loader"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_ringedge"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
