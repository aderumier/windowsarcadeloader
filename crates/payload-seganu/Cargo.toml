[package]
name = "wal-payload-seganu"
description = "Sega Nu payload: amLib's AMEX board devices (keychip, EEPROM, SRAM, GPIO, JVS), the keychip driver and the system's registry values, loaded by wal-loader"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_seganu"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading"] }
