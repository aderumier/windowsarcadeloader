[package]
name = "wal-payload-globalvr"
description = "Global VR payload: replacement USBIOExtreme.dll (USBIO board: lightguns, buttons, coins)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_globalvr"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
] }

[features]
# Recording build (under another dongle emulation): forwards USBIO to USBIOExtreme_real.dll, logs hasp() calls
record = []
