[package]
name = "wal-payload-nesica"
description = "NESiCAxLive payload: replacement iDmacDrv32.dll (FastIO) + system emulation"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_nesica"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
] }
