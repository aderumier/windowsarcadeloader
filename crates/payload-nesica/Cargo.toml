[package]
name = "wal-payload-nesica"
description = "NESiCAxLive payload: replacement iDmacDrv32.dll (FastIO) + system emulation"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_nesica"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
# the Love Live title server's session cipher (lovelive_server.rs)
aes = "0.8"
# the Street Fighter V pak tables (sfv_english.rs)
miniz_oxide = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_UI_WindowsAndMessaging",
] }
