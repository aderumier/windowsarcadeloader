[package]
name = "wal-payload-namcoes3"
description = "Namco ES3 payload: replacement hasp_windows_x64_100610.dll (HASP HL dongle, JVS I/O board)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_namcoes3"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
wal-namcoes3srv = { path = "../namcoes3srv" }
miniz_oxide = "0.8"
# Sword Art Online Arcade's test mode save files (AES-128-CBC)
aes = "0.8"
# Gundam Extreme Vs. 2's save files (svd1: SHA-1)
ring = "0.17"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
