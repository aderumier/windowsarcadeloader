[package]
name = "wal-payload-konami"
description = "Konami e-Amusement PC payload: replacement libacio.dll (ACIO I/O board HBHI and card reader ICCA)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_konami"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }
