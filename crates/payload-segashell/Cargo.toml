[package]
name = "wal-payload-segashell"
description = "Sega Amusements Shell payload: the Shell's TCP service (credits) and the I/O board, loaded by wal-loader"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_segashell"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
