[package]
name = "wal-payload-rawthrills"
description = "Raw Thrills PC cabinet payloads, including virtual JAMMA I/O and game-specific input bridges"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_rawthrills"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }
