[package]
name = "wal-payload-wahlap"
description = "Wahlap payload: replacement usb_io.dll (Storm Racer G's USB I/O board: wheel, pedals, buttons, coins, force feedback)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "wal_wahlap"
crate-type = ["cdylib"]

[dependencies]
wal-protocol = { path = "../protocol" }
wal-payload-common = { path = "../payload-common" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
