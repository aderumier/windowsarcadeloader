[package]
name = "wal-loader"
description = "Windows-side loader: starts a game with a payload DLL loaded before its entry point"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "wal-loader"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
] }
