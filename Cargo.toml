[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/launcher",
    "crates/payload-common",
    "crates/payload-nesica",
    "crates/payload-typex",
    "crates/payload-globalvr",
    "crates/loader",
]
# Payloads are Windows DLLs: build them with --target i686-pc-windows-gnu (see build.sh)
default-members = ["crates/protocol", "crates/launcher"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

[profile.release]
panic = "abort"
lto = true

[profile.dev]
panic = "abort"
