# The King of Fighters '98 Ultimate Match (SNK Playmore, Taito Type X) - template, override
# values in userprofiles/typex/kof-98-um-typex.yaml.
system: typex
name: "The King of Fighters '98 Ultimate Match"

# Direct3D 9 game (DXVK), JVS I/O on COM2. The game is launcher.exe.
# The dump's dinput8.dll is Microsoft's: use wine's.
hide: [dinput8.dll]

# Buttons A B C D: usual layout A=Button1 B=Button2 C=Button4 D=Button5 (2 rows of 3), as the
# NESiCA Final Edition. Virtual top row b1-b4 = A B C D.
native_map:
  b1: btn1
  b2: btn2
  b3: btn4
  b4: btn5
  b5: none
  b6: none

env:
  # Same engine as the NESiCA Final Edition: it polls a Direct3D event query into a 1-byte
  # variable, DXVK writes 4 bytes over the saved EBP.
  WAL_D3D9_QUERY_FIX: "1"

# Control names (the GUI's mapping rows).
controls:
  b1: A
  b2: B
  b3: C
  b4: D
