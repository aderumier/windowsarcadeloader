# Raiden IV (MOSS, Taito Type X) - template, override values in
# userprofiles/typex/raiden-4-typex.yaml.
system: typex
name: Raiden IV

# Direct3D 9 game (DXVK), JVS I/O on COM2.
# MMShader.fx is HLSL source compiled at load: Wine's d3dx9_31 fails it and the game crashes
# calling the missing effect (same file as the NESiCA build).
# d3dcompiler_47: ReShade compiles its effects with it, Wine's fails them.
tricks: [d3dx9_31, d3dcompiler_47]
# The Portrait dumps rotate the vertical game to a landscape screen with a bezel (ArcCabView):
# dgVoodoo's D3D9.dll (Direct3D 11) then ReShade as d3d11.dll (reshade: false for the portrait
# picture through DXVK d3d9).
reshade_files: [D3D9.dll, d3d11.dll]
files:
  # The dumps' dgVoodoo.conf (bestavailable output, DXGI-stretched 640x480 swap chain): dgVoodoo
  # resizes the swap chain at every frame, ReShade recreates its runtime each time and the
  # effect never shows. Direct3D 11 output with dgVoodoo's own aspect ratio scaling (a
  # screen-sized swap chain, as GigaWing Generations) is stable.
  dgVoodoo.conf: systemprofiles/typex/files/raiden/dgVoodoo.conf
  # Same preset, catching the 4:3 picture in the middle of that pillarboxed screen
  # (CenterLocked_ratio) before rotating it: the whole buffer otherwise, a square picture.
  ArcCabView/Presets/ArcCabView.ini: systemprofiles/typex/files/raiden/ArcCabView.ini

# Buttons Shoot, Bomb = b1, b2 (default mapping).

env:
  # The game reads DirectInput too (keyboard, joysticks): the PC keyboard's 2 (also P2 start)
  # opens the test menu. JVS only.
  WAL_DINPUT_DISABLE: "1"

# Control names (the GUI's mapping rows).
controls:
  b1: Shoot
  b2: Bomb
