# Raiden IV (MOSS, Taito Type X) - template, override values in
# userprofiles/typex/raiden-4-typex.yaml.
system: typex
name: Raiden IV

# Direct3D 9 game (DXVK), JVS I/O on COM2.
# MMShader.fx is HLSL source compiled at load: Wine's d3dx9_31 fails it and the game crashes
# calling the missing effect (same file as the NESiCA build).
tricks: [d3dx9_31]

# Buttons Shoot, Bomb = b1, b2 (default mapping).

env:
  # The game reads DirectInput too (keyboard, joysticks): the PC keyboard's 2 (also P2 start)
  # opens the test menu. JVS only.
  WAL_DINPUT_DISABLE: "1"
