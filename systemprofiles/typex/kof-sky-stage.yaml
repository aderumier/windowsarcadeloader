# The King of Fighters Sky Stage (SNK Playmore / MOSS, Taito Type X) - template, override
# values in userprofiles/typex/kof-sky-stage.yaml.
system: typex
name: The King of Fighters Sky Stage

# Direct3D 9 game (DXVK), JVS I/O on COM2.
# The dump's dinput8.dll is Microsoft's: use wine's.
hide: [dinput8.dll]
# Its d3d9.dll is ReShade: the vertical game rotated to a landscape screen with a bezel
# (reshade: false for the portrait picture).
reshade_files: [d3d9.dll]
# ReShade compiles its effects with d3dcompiler_47: Wine's (vkd3d) fails them.
tricks: [d3dcompiler_47]

# Buttons Shot, Bomb = b1, b2 (default mapping).

# Control names (the GUI's mapping rows).
controls:
  b1: Shot
  b2: Bomb
