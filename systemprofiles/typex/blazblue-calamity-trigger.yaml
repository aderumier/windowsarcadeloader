# BlazBlue Calamity Trigger (Arc System Works, Taito Type X2) - template,
# override values in userprofiles/typex/blazblue-calamity-trigger.yaml.
system: typex
name: BlazBlue Calamity Trigger

# 4 buttons (b1-b4 -> btn1-b4, default mapping).
env:
  # BlazBlue patch (CRC 0xf9297ecb, Calamity Trigger only -
  # Continuum Shift is the generic build and needs no patches): returns true.
  WAL_PATCHES: "0xECFD0:B801000000C3"
  # The game wants 1280x768 fullscreen, not a mode Wine emulates: use 1280x800
  # (16:10, scaled to the screen by Wine's fullscreen hack).
  WAL_D3D9_FULLSCREEN_SIZE: 1280x800

# Control names (the GUI's mapping rows).
controls:
  b1: A
  b2: B
  b3: C
  b4: D
