#
#  usagi online configure file
#
#  local message relay server
#

#  configure guide
#  It is set up on the command line. (a setup of priority)
#  A setup by the CONF file

# shop ID
# --id 1
#ID = 1
# MAC = A MAC address is formed in the cause.
ID = MAC

# MRN connection host:connection UDP port(host:53001)
# --mrn0 mrn0.usagionline.com:53001
# MRN0 = mrn0.usagionline.com:53001
#       .
#       .
# --mrn7 mrn7.usagionline.com:53001
#
# When a host name is received more than NESYS.
# MRN0 = NESYS
#
# Directly, in the case of the designation
# MRN7 = mrn7.usagionline.com:53001
#MRN0 = warashi.as.wakwak.ne.jp:60001

#MRN0 = 192.168.0.20:53001
#MRN0 = warashi.as.wakwak.ne.jp:60001
MRN0 = 127.0.0.1:53001


# MRC Listen port (52001)
# --port 52001
PORT = 52001

# shop password
# --pass test-pass-word
PASS = test-pass-word

# IP beacon
# --beacon on/off
BEACON = ON

# Dynamic MRID allotment (DMA)
# --dma_scope_start --dma_scope_end
DMA_SCOPE_START = 128
DMA_SCOPE_END = 255

# ping time-out time  (30)
# --ping_timeout 30
PING_TIMEOUT = 30

# The re-send number of times to the ping time-out (3)
# --ping_retry 3
PING_RETRY = 3

# When a WMR connection fails, standing by time  (60)
# --standby_time 60
STANDBY_TIME = 60

# MRN connection answer waiting time  (60)
# --mrn_timeout 60
MRN_TIMEOUT = 60

# WMR connection waiting time  (60)
# --wmr_timeout 60
WMR_TIMEOUT = 60

# The place of log output (NON/STDOUT/FILE/SYSLOG)
# --log_output
LOG_OUTPUT = FILE

# log output level (ERROR/WARNING/NOTICE/DEBUG)
# --log_level
LOG_LEVEL = DEBUG

# log output path (In the case of FILE )
# --log_path
LOG_PATH = ../log/lmrd.log

# daemon-ization repression (when a service starts with WIN32, always, TRUE)
# --no_daemon (Only a command line, daemon-ization repression)
DAEMON = TRUE

# Setup file path (only a command line)
# --conf /usr/local/uol/etc/lmrd.conf

