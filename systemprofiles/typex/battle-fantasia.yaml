# Battle Fantasia (Taito Type X2 build, NESiCAxLive release dump) - template, override values
# in userprofiles/typex/battle-fantasia.yaml.
system: typex
name: Battle Fantasia
exe: 'Z:\userdata\roms\nesica\Battle Fantasia for NesicaxLive\game.exe'

# Buttons: usual layout A=Button1 B=Button4 C=Button2 D=Button5 G=Button3; virtual top
# row b1-b4 = A B C D, b5 = G.
native_map:
  b1: btn1
  b2: btn4
  b3: btn2
  b4: btn5
  b5: btn3

env:
  # The game wants 1280x768 fullscreen, not a mode Wine emulates: use 1280x800 (16:10, scaled
  # to the screen by Wine's fullscreen hack).
  WAL_D3D9_FULLSCREEN_SIZE: 1280x800
  # Battle Fantasia patches for this executable (CRC 0xcdf01376):
  # skip the slow uppercase path loop, "fixes dual input" (returns true)
  WAL_PATCHES: "0xD062:9090,0xFF0A0:B801000000C3"
