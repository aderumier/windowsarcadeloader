# Super Street Fighter IV Arcade Edition Ver. 2012 (Capcom, Taito Type X2, cabinet build) -
# template, override values in userprofiles/typex/super-street-fighter-iv-ae-2012.yaml.
# Same game as the export standalone build (super-street-fighter-iv-ae), same setup but
# for the screen size.
system: typex
name: Super Street Fighter IV Arcade Edition Ver. 2012

# 6 buttons (b1-b6 -> btn1-b6, default mapping).

# Unlike the other builds, Ver. 2012 asks for a 1920x1080 fullscreen device and draws
# 1920x1080 (1280x720 showed a zoomed picture), as Street Fighter IV: a windowed 1920x1080
# device, its window borderless over the screen, the picture kept 16:9.
env:
  WAL_D3D9_WINDOWED_SIZE: 1920x1080
  WAL_D3D9_ASPECT: "16:9"
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: screen

# Control names (the GUI's mapping rows).
controls:
  b1: Light Punch
  b2: Medium Punch
  b3: Heavy Punch
  b4: Light Kick
  b5: Medium Kick
  b6: Heavy Kick
