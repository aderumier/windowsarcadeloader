# The King of Fighters Maximum Impact Regulation A (SNK, Taito Type X2) -
# template, override values in
# userprofiles/typex/king-of-fighters-maximum-impact-regulation-a.yaml.
system: typex
name: King of Fighters Maximum Impact Regulation A

# 6 buttons (b1-b6 -> btn1-b6, default mapping).
# The dump's dinput8.dll is Microsoft's: use wine's. The dump also ships Wine
# 10.16's own d3d8/d3d9/ddraw/wined3d: Wine loads them from the game dir as
# "builtin" despite the `=b` overrides, and the runner's ddraw then binds to the
# dump's older wined3d. Hide them all.
hide: [dinput8.dll, d3d8.dll, d3d9.dll, ddraw.dll, wined3d.dll]

# The intro movies (CRI Sofdec) are a DirectDraw YUY2 overlay, emulated by the
# runner's patched ddraw (GE-Proton patches/ge-video-rework/0075) with wined3d
# GL. With DXVK the game window already has a Vulkan swapchain and wined3d
# cannot draw the overlay on it: use wined3d for d3d8 too.
# See docs/KOF-MIRA-INTRO-VIDEO-DEBUG.md.
dxvk: false

env:
  # KOF Maximum Impact Regulation A patch (CRC 0x1782f027).
  # 0x1D6D7E, 0x1DB9E2, 0x1DC963, 0x1DCCEE, 0x1DD369: crash at the fight start. These
  # drawing functions save the RenderWare render states 10, 11 and 9 (texture filter) and
  # restore them, but the restore of 9 passes the saved value's address (lea) instead of
  # the value: RwRenderStateSet indexes its filter table with that stack address, read out
  # of bounds under Wine (thread stack higher than Windows'). lea -> mov.
  WAL_PATCHES: "0x447C:B80008009090,0x1D6D7E:8B,0x1DB9E2:8B,0x1DC963:8B,0x1DCCEE:8B,0x1DD369:8B"

# No back buffer override: the game renders natively at 640x480 (it requests a
# 640x480 back buffer and lays out its scene for it). Forcing 1280x800 put the
# 640x480 scene in the top-left quarter of the buffer (small image, movie black).
# Wine's desktop follows the 640x480 back buffer and the WM stretches the
# fullscreen window to the monitor.

# Control names (the GUI's mapping rows).
controls:
  b1: Button 1
  b2: Button 2
  b3: Button 3
  b4: Button 4
  b5: Button 5
  b6: Button 6
