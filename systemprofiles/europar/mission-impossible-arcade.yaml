# Mission: Impossible Arcade (SEGA Amusements, 2020, MissionImpossible.exe, Unity 2018.4 / Mono,
# 64-bit), a two-player gun game, each gun with two triggers - template, override values in
# userprofiles/europar/mission-impossible-arcade.yaml.
# The payload is the cabinet's hardware (WAL_EUROPAR_BOARD=mig, docs §6.3g): the guns (Unity's
# joystick functions answered with the players' guns), the shell the game connects to (coins,
# credits, its security challenges).
system: europar
name: "Mission: Impossible Arcade"

# Unity's own log beside the game; its 1920x1080 full screen window (the cabinet's), whatever
# size the prefix's Unity settings kept (1600x1080 after a 1600x1200 screen)
args: [-logFile, Player.log, -screen-fullscreen, "1", -screen-width, "1920", -screen-height, "1080"]

# loaded at the entry point (64-bit: wal-loader64): Unity's input functions wrapped before Mono
# registers them
payload_loader: true

# The shell's settings, read from ..\ShellData beside the game folder: the dump's, the guns'
# calibration the whole screen (0-4096, unclamped: the payload's guns are exact), free play from
# the common option (written by the payload).
files:
  Sega/ShellData/ShellData.ini: systemprofiles/europar/files/mission-impossible-arcade/ShellData.ini

env:
  # the network outputs' game name (DemulShooter's / U-Shoot's, their MAMEHooker .ini)
  WAL_OUTPUTS_NAME: "mia"
  WAL_EUROPAR_BOARD: mig
  # every mission and stage selectable (else mission 3 after a mission cleared, the stages in order)
  WAL_EUROPAR_UNLOCK: "1"
  # Its interface is laid out for 16:9: Unity at the screen's size (1600x1200) or at a size
  # other than its window's cut it on the right. A 1920x1080 desktop for the game, fitted onto
  # the screen, the swap chain windowed (stretched to the window: dxgi_size.rs); stretched over
  # a 4:3 screen (a gun game, no bars; ES's KEEP ASPECT RATIO on keeps 16:9), the guns' aim in
  # its picture
  WAL_DESKTOP_SIZE: 1920x1080
  WAL_WINDOW_POPUP: "1"
  WAL_DESKTOP_STRETCH: "1"
  WAL_KEEP_ASPECT_RATIO: "0"

options:
  - title: Game
    options:
      - key: WAL_EUROPAR_UNLOCK
        label: Unlock all missions and stages
        kind: bool
        description: >-
          Mission 3 selectable from the start (else after mission 1 or 2 cleared), and any stage
          of a mission (else the next one only).

input:
  # each gun (or mouse) aims, its triggers shoot; with lightguns a player has two guns (four
  # plugged: two each; two: one each while both play, both player 1's while alone), docs §6.3g
  guns_enabled: true
  stick_as_dpad: false

controls:
  lx: Gun aim (x)
  ly: Gun aim (y)
  b1: Left trigger
  b2: Right trigger
  start: Start
  coin: Coin
