# Nicktoons Nitro Racing (Raw Thrills, 2009) - template, override values in
# userprofiles/rawthrills/nicktoons-nitro-racing.yaml.
system: rawthrills
name: Nicktoons Nitro Racing

# Direct3D 8 game (sdaemon.exe) reading its JAMMA USB board itself: the payload (started
# through wal-loader) hands the game's report parser the board's reports built from the
# virtual sticks (payload sdaemon.rs). The first boot resets the audits and settings and
# checks every file (about a minute), then counts down (holding START stops the count).
# Force feedback: the wheel motor force, played on player 1's wheel (constant force) or
# gamepad (rumble).
env:
  WAL_RAWTHRILLS_GAME: nicktoons

# The kart: wheel = lx, gas = accel, brake = brake (analog), START = start, VIEW = b1, bill
# acceptor = b4, volume up / down (test menu navigation) = up / down, player 2's coin = coin 2.
native_map: {}

input:
  # steering must not press the d-pad
  stick_as_dpad: false
  # Left stick wheel, R2 gas, L2 brake, X view, B bill, d-pad up / down volume up / down.
  gamepad:
    r2: accel
    l2: brake
    b: b4
  # keyboard steering, gas and brake: full in 0.5 s
  keyboard_ramp_ms: 500
  # Keyboard (player 1): Left / Right wheel, Up gas, Down brake, Ctrl view, Left Shift bill,
  # Page Up / Page Down volume up / down, 1 start, 5 coin, 6 coin 2.
  keyboard:
    p1:
      KEY_LEFT: -lx
      KEY_RIGHT: lx
      KEY_UP: accel
      KEY_DOWN: brake
      KEY_PAGEUP: up
      KEY_PAGEDOWN: down

# Control names (the GUI's mapping rows).
controls:
  up: Volume up
  down: Volume down
  left: none
  right: none
  lx: Wheel
  accel: Gas
  brake: Brake
  b1: View
  b4: Bill
