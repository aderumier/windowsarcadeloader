# Initial D Arcade Stage 6 AA (Sega RingEdge 2), racing game with a wheel and pedals.
# Runs id6_dump_.exe (InitialD6_GLW_RE_SBUU.exe is the encrypted original).
# Override values in userprofiles/ringedge/initial-d-arcade-stage-6.yaml.
system: ringedge
name: Initial D Arcade Stage 6 AA

# dumped executable: .rdata left writable, the C runtime then stops ("R6002 floating point
# support not loaded")
readonly_sections:
  id6_dump_.exe: [.rdata]

# Cabinet: wheel, gas and brake pedals (JVS analog channels 0-2), shifter (player 2's JVS
# switches: up / down shift up / down), VIEW CHANGE (button 1), menu selection (directions).
# Virtual stick: wheel lx, pedals accel/brake, b1 SHIFT UP, b2 SHIFT DOWN, b3 VIEW CHANGE,
# directions the menus.
native_map:
  b1: p2up
  b2: p2down
  b3: btn1
  b4: none
  b5: none
  b6: none

input:
  stick_as_dpad: false
  # Left stick wheel, R2 gas, L2 brake, R1/L1 shift up/down, Y VIEW CHANGE, d-pad menus.
  gamepad:
    r1: b1
    l1: b2
    y: b3
    r2: accel
    l2: brake
  # Keyboard (player 1): Left / Right wheel, Up gas, Down brake, Ctrl / Alt shift up / down,
  # Space VIEW CHANGE. Wheel and pedals reach full deflection progressively, as a wheel turned
  # or a pedal pushed.
  keyboard_ramp_ms: 500
  keyboard:
    p1:
      KEY_LEFT: -lx
      KEY_RIGHT: lx
      KEY_UP: accel
      KEY_DOWN: brake

env:
  # full screen: the game draws its 1360x768 cabinet screen, scaled to the screen (aspect
  # kept) in a borderless window enlarged once the game has started; no mouse cursor
  WAL_RINGEDGE_GL_SCALE: 1360x768
  WAL_WINDOW_POPUP: "1"
  WAL_HIDE_CURSOR: "1"
  # its NVIDIA OpenGL shaders and behaviors on other GPUs (Mesa: AMD, Intel), see the
  # payload's cg.rs; NVIDIA GPUs keep the originals
  WAL_RINGEDGE_CG_FIX: auto
  # the wheel and pedals on the JVS board's analog channels: steering, gas, brake; the
  # cabinet's steering sensor covers about a third of its channel: a full turn of the wheel
  # (or the stick) is its full lock
  WAL_TYPEX_JVS_ANALOG_INPUTS: "lx*0.35,accel,brake"
  # its amJvs uses the serial port
  WAL_TYPEX_JVS_PORT: "mxjvs,COM4"
  # the wheel's drive board (force feedback: road forces, vibrations, centering spring)
  WAL_RINGEDGE_FFB: COM1
  # the card reader: the cabinet's card daemon started beside the game, its reader and the
  # card's RFID chip emulated (the card: sv/card.ic, inserted when the game asks for one;
  # without it, START at the card screen buys a new card from the dispenser)
  WAL_RINGEDGE_CARD_DAEMON: picodaemon.exe
  # offline cabinet (the Network option): the game's "network enabled" function (mov al,1;
  # ret) returns 0: no network check, ALL.Net or in-shop network at start (else "network
  # error 830x, cable disconnected", or a wait for the store's server box)
  WAL_RINGEDGE_OFFLINE: "1"
  WAL_RINGEDGE_OFFLINE_PATCHES: "0x53c091:00"
  # platform id AAL2: amBackup's RingEdge 2 SRAM layout
  WAL_RINGEDGE_BOARD: ringedge2
  WAL_RINGEDGE_DS_FILE: SBUU_Table.dat
  WAL_RINGEDGE_PCP: keychip.appboot.gameid=SBUU

options:
  - title: Network
    options:
      - key: WAL_RINGEDGE_OFFLINE
        label: Offline cabinet
        kind: bool
        description: >-
          Start without the arcade network: no network check, ALL.Net authentication or
          in-shop network (cabinet link) at boot. Off: the game looks for them (network
          error at boot without them).

# Control names (the GUI's mapping rows).
controls:
  up: Menu Up
  down: Menu Down
  left: Menu Left
  right: Menu Right
  lx: Wheel
  accel: Gas
  brake: Brake
  b1: Shift Up
  b2: Shift Down
  b3: View Change
  b4: none
  b5: none
  b6: none
