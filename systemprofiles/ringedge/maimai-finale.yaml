# maimai FiNALE (Sega RingEdge 2, Direct3D 9), game id SDEY, 1.99B (Japan): a rhythm game played
# on 8 buttons around a round touch screen, two players side by side. Runs maimai_dump_.exe (the
# unpacked maimai.exe, protector-packed).
# amLib is linked in (no amdaemon): the RingEdge payload emulates the system (keychip, SMBus
# EEPROM, the JVS I/O board, the amAuth/amMaster services) in the game's process, plus the
# game's touch sensors, LED boards and Aime readers (WAL_RINGEDGE_MAIMAI,
# crates/payload-ringedge/src/maimai.rs).
# Override values in userprofiles/ringedge/maimai-finale.yaml.
system: ringedge
name: maimai FiNALE

# two RingEdge games can't run at once (amLib binds the fixed pcp ports 40100-40191 on
# 127.0.0.1): maimai GreeN's prefix, unpacked from the shared prefix's archive
prefix: wine-prefix/maimai-test
prefix_archive: wine-prefix/full

# the game's settings, read at start:
# - SystemConfig.txt: the dump's, WINDOW 2160x1920 (the cabinet's two portrait 1080x1920
#   monitors side by side; the dump's 1100x1100 squeezed both)
# - GrooveMaster.ini (the development switches): ROTATE 1, the picture upright (each player's
#   circle the lower square of that screen; else turned for the cabinet's turned monitors),
#   NO_DELIVER / USB_DL_DISABLE (no update from the shop's server or a USB key: "the USB memory
#   is invalid" else), SET_CLOSE_HOUR / SET_CLOSE_MINUTE 0: no closing time (the test menu's
#   CLOSE SETTING, 24:00 by default with the day starting at 07:00: "today's play reception is
#   closed" from 00:00 to 06:59, entry refused)
files:
  SystemConfig.txt: systemprofiles/ringedge/files/maimai-finale/SystemConfig.txt
  GrooveMaster.ini: systemprofiles/ringedge/files/maimai-finale/GrooveMaster.ini

env:
  # platform id AAL2: amBackup's RingEdge 2 SRAM layout
  WAL_RINGEDGE_BOARD: ringedge2
  # the keychip's game id and the DS28CN01 challenge file amDongle checks against (shipped in
  # the dump)
  WAL_RINGEDGE_PCP: keychip.appboot.gameid=SDEY
  WAL_RINGEDGE_DS_FILE: data/SDEY_Table.dat
  # the test menu: on the test switch the game leaves, the cabinet starting maimai.exe gametest
  # (gametest.bat), and the test menu leaves when exited (game.bat again): started again with
  # those arguments (maimai.rs)
  WAL_RINGEDGE_MAIMAI_TEST_ARGS: gametest
  # the JVS I/O board's features the game requires (maimai GreeN's spec check): at least 4
  # switches, 6 analog channels (unused) and 6 general purpose outputs (its button lamps)
  WAL_TYPEX_JVS_ANALOG_INPUTS: ","
  WAL_TYPEX_JVS_OUTPUTS: "32"

  # the extend packs' check at start (FUN_006aa470): the packs' version files W:\EXTEND_VER.txt
  # and V:\EXTEND2_VER.txt (the SSD's extra partitions, "1.97") skipped, the dump holding the
  # packs' data in its own folder (the attract's "some movie data is broken" warning else;
  # never give the game a Y: drive: it empties Y:\ when its delivery data is inconsistent);
  # the LED boards' answers parsed only while a command waits for one (FUN_00580e50 looks the
  # answer's command up in its queue unchecked: entering the test menu empties the queue with an
  # answer still unread, and the game crashed on its checked iterator; a cave at +0x938d8 in an
  # int3 padding, jumped to from +0x180ea7)
  WAL_PATCHES: "0x2aa470:C3,0x938d8:83F9060F82CBD50E0083BE90000000000F84BED50E00E9CDD50E00,0x180ea7:E92C2AF1FF"
  WAL_PATCHES_EXE: maimai_dump_.exe
  # the main board's COM1 in the SetupDi enumeration (enumerator ACPI): the LED control lists
  # the main board's ports at start through amPlatformGetComInfo ("LED BD unknown error" when
  # it finds none; Wine lists none)
  WAL_COMPORTS: COM1

  # free play (the common option): the system menu's FREE PLAY, in the EEPROM's credit record
  # (devices.rs): "FREE PLAY" shown, games started without coins
  WAL_RINGEDGE_FREEPLAY_EEPROM: "1"

  # maimai's devices (maimai.rs): the LED boards on COM5-COM8, the touch sensors on COM3; the
  # touch controller streams from the start (the game looks for its frames before any command:
  # "Touch Sensor Not Found", error 3102, else)
  WAL_RINGEDGE_MAIMAI: "1"
  WAL_RINGEDGE_MAIMAI_TOUCH_RUN: "1"
  # the Aime readers on COM2 (segatools' generation 1, TN32MSEC003S): player 1's, and player
  # 2's beside it (address 1: "Aime Reader BAD" without)
  WAL_AIME_READER: tn32
  WAL_AIME_READER_2P: "1"
  # after a player's entry button (button 5), the player's card touched by itself when the
  # game asks for it (player 1's card 50000000000000000001, player 2's ...02:
  # WAL_RINGEDGE_AIME_CODE / WAL_RINGEDGE_AIME_CODE_2P)
  WAL_RINGEDGE_AUTO_CARD: "1"

  # the network: ALL.Net, the accounting and the updates are the network process
  # app\ALLNetProc.exe's (packed: under Wine it exits at once), emulated in the game's process
  # (allnetproc.rs: the shared blocks found through the game's singleton +0xB40E04, the
  # power-on's result with the title server's URI); the title server (maimai_server.rs, ARTEMiS'
  # MaimaiServlet, players in sv\maimai) and the AimeDB in the payload's ALL.Net server
  WAL_RINGEDGE_ALLNET: maimai
  WAL_RINGEDGE_ALLNETPROC: b40e04
  WAL_ALLS_TITLE_URI: "http://{router}/SDEY/197/"

  # the screens shown: both (side by side), or p1: player 1's alone, centered (maimai.rs: the
  # back buffer's left half, touches all player 1's), WAL_RINGEDGE_MAIMAI_BEZEL's PNG image
  # around it (a path from the game's maimai folder; black when empty)
  WAL_RINGEDGE_MAIMAI_SCREEN: both
  WAL_RINGEDGE_MAIMAI_BEZEL: ""

  # full screen: the game's 2160x1920 picture (two portrait screens) scaled to the screen,
  # aspect kept, in a borderless window
  WAL_D3D9_WINDOWED_SIZE: 2160x1920
  WAL_D3D9_ASPECT: "9:8"
  # the game's window screen-sized and borderless (its own window has a title bar, kept under
  # GNOME's top bar)
  WAL_WINDOW_SIZE: screen
  WAL_WINDOW_POPUP: "1"
  WAL_HIDE_CURSOR: "1"

options:
  - title: Game
    options:
      - key: WAL_FREEPLAY
        label: Free play
        kind: bool
        description: >-
          Games start without coins. Off: the coins and credits of the system test menu.
  - title: Screens
    options:
      - key: WAL_RINGEDGE_MAIMAI_SCREEN
        label: Screens shown
        kind: choice
        choices: [both, p1]
        description: >-
          both: the cabinet's two screens side by side (two players). p1: player 1's screen
          alone, centered and larger, the bezel image around it.
      - key: WAL_RINGEDGE_MAIMAI_BEZEL
        label: Bezel image (player 1 screen alone)
        kind: text
        description: >-
          A PNG image drawn around player 1's screen when it is shown alone (a path from the
          game's maimai folder, or absolute). Empty: black.
  - title: Aime card
    options:
      - key: WAL_RINGEDGE_AUTO_CARD
        label: Touch the card automatically
        kind: bool
        description: >-
          After a player's entry button, the player's Aime card is touched by itself when the
          game asks for it (the player's name, scores and progress kept on the card; player 2
          has a card of their own). Off: touch it with the card button.

# the 8 buttons around each screen: the JVS board's switches (maimai.rs inverts them, active low)
native_map:
  b1: right
  b2: left
  b3: btn2
  b4: btn3
  b5: btn4
  b6: btn5
  b7: btn6
  b8: btn7
  up: none
  down: none
  left: none
  right: none
  start: none

# the touch screens: a touchpad or touchscreen (the fingers), the mouse (its position, the left
# button) or the left stick with kp0, on either player's screen. Buttons 1-8 clockwise from the
# top right of the circle.
input:
  # its gamepad buttons are physical choices, not panel positions: no button layout
  pad_layout: false
  touch: true
  guns_enabled: true
  stick_as_dpad: false
  gun:
    BTN_LEFT: kp0
  # the right half of the ring on R1 Y B A (1-4), the left half on d-pad down / left / up and L1
  # (5-8); R2 the touch, X the player's Aime card (player 2 joining once the entry screen is
  # open: its button 5 there is the guest play)
  gamepad:
    r1: b1
    y: b2
    b: b3
    a: b4
    dpdown: b5
    dpleft: b6
    dpup: b7
    l1: b8
    r2: kp0
    x: card
  # the keyboard (segatools' maimai keys): W E D C X Z A Q player 1's buttons 1-8, the keypad's
  # 8 9 6 3 2 1 4 7 player 2's (keypad Enter its card); 5 coin, F1 service, F2 test, F4 player 1's
  # card (the defaults)
  keyboard:
    p1:
      KEY_W: b1
      KEY_E: b2
      KEY_D: b3
      KEY_C: b4
      KEY_X: b5
      KEY_Z: b6
      KEY_A: b7
      KEY_Q: b8
      KEY_V: none
    p2:
      KEY_R: none
      KEY_F: none
      KEY_D: none
      KEY_G: none
      KEY_A: none
      KEY_S: none
      KEY_Q: none
      KEY_W: none
      KEY_KP8: b1
      KEY_KP9: b2
      KEY_KP6: b3
      KEY_KP3: b4
      KEY_KP2: b5
      KEY_KP1: b6
      KEY_KP4: b7
      KEY_KP7: b8
      KEY_KPENTER: card
    p4:
      KEY_KP8: none
      KEY_KP2: none
      KEY_KP4: none
      KEY_KP6: none

controls:
  b1: Button 1 (top right)
  b2: Button 2
  b3: Button 3
  b4: Button 4
  b5: Button 5 (bottom left)
  b6: Button 6
  b7: Button 7
  b8: Button 8
  lx: Touch position
  ly: Touch position
  kp0: Touch
  card: Aime card
  coin: Coin
  service: Service
  test: Test
