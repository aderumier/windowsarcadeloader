# Puyo Puyo!! Quest Arcade (Sega RingEdge 2), touchscreen game. Runs bin/Pj24App.exe.
# The touch: the mouse or gun (a red dot where it touches); offline (no server machine), plays
# as a guest.
# Override values in userprofiles/ringedge/puyo-puyo-quest-arcade.yaml.
system: ringedge
name: Puyo Puyo!! Quest Arcade

# Wine's Direct3D: DXVK's SM3 shader compiler (dxbc-spirv) asserts on one of the game's shaders
# (sm3_io_map.cpp:880) and the game aborts at boot (exit code 3)
dxvk: false

input:
  guns_enabled: true
  stick_as_dpad: false
  # the touch screen: the mouse (its position, the left button)
  gun:
    BTN_LEFT: b8

controls:
  b8: Touch
  coin: Coin
  service: Service
  test: Test

# the cabinet's Y: drive (its dipsw.ini, its debug log): a folder of the dump
drives:
  y: Y

env:
  # its working directory is the dump root (hod5.ini, Data/), not bin/
  WAL_RINGEDGE_CWD: ".."
  # its touch panel (a CTR-251500 on COM1)
  WAL_RINGEDGE_TOUCH: COM1
  # the dump's hod5.ini [Touch Panel] calibration (p1_x, p1_y, p2_x, p2_y: X mirrored), undone
  # by the reports (the touch where the pointer is)
  WAL_RINGEDGE_TOUCH_CALIBRATION: "1280,86,83,674"
  # hod5.ini's s_Input = mouse: the touches at the Windows cursor, the button from a
  # DirectInput mouse: the cursor follows the pointer, b8 the fake DirectInput mouse's left
  # button (the real mouse dropped)
  WAL_RINGEDGE_MOUSE: "1"
  WAL_DINPUT_DISABLE: "1"
  # platform id AAL2: amBackup's RingEdge 2 SRAM layout
  WAL_RINGEDGE_BOARD: ringedge2
  WAL_RINGEDGE_DS_FILE: bin/SBYZ_Table.dat
  # its JVS board's features (else error 6402, "JVS I/O board does not fulfill the game spec"):
  # analog channels and 24 outputs
  WAL_TYPEX_JVS_OUTPUTS: "24"
  WAL_TYPEX_JVS_ANALOG_INPUTS: "lx,ly"
  # the test button (application 3): the game with -Start TestMode (start_app.bat's test)
  WAL_RINGEDGE_FOREGROUND: "3=-Start TestMode"
  # the test menu's CLOSE SETTING defaults to ALL TIME (hours 0) instead of 24:00 (the default
  # backup record's hours, 0xd6a30f): else "本日のプレイは終了しました" (play is over for today),
  # coins refused, at night
  WAL_PATCHES: "0x96a310:00"
  # the touch pointer: a small red dot where the mouse or gun touches (the game shows no cursor)
  WAL_HIDE_CURSOR: "1"
  WAL_CROSSHAIR: "1"
  WAL_CROSSHAIR_STYLE: disc
  WAL_CROSSHAIR_SIZE: "1"
  WAL_CROSSHAIR_COLOR: FF2020
  WAL_CROSSHAIR_HIDE: "0"

options:
  - title: Touch screen
    options:
      - key: WAL_CROSSHAIR
        label: Touch pointer
        kind: bool
        description: >-
          A small red dot where the mouse or gun touches (the game shows no cursor).
      - key: WAL_CROSSHAIR_SIZE
        label: Touch pointer size
        kind: number
        min: 1
        max: 6
        description: >-
          The dot's size, in percent of the screen height.
