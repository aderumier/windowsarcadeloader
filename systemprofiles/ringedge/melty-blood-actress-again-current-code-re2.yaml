# Melty Blood Actress Again Current Code (Sega RingEdge 2). Runs MBAA_RWMasterBuild.exe.orig:
# MBAA_RWMasterBuild.exe is a patched copy (amLib checks returning at once).
# Override values in userprofiles/ringedge/melty-blood-actress-again-current-code-re2.yaml.
system: ringedge
name: Melty Blood Actress Again Current Code (RingEdge 2)

env:
  # its amJvs uses the serial port
  WAL_TYPEX_JVS_PORT: COM4
  # platform id AAL2: amBackup's RingEdge 2 SRAM layout
  WAL_RINGEDGE_BOARD: ringedge2
  # the keychip DS28CN01 MACs amDongle checks: its fixed challenge
  WAL_RINGEDGE_DS_TABLE: "0x140d44,0x140d50"
  # debugging: amLib's log function and its modules' log levels
  # WAL_RINGEDGE_AMLOG: "0xb2d80"
  # WAL_RINGEDGE_AMLOG_LEVELS: "0x17e3f8,0x17e7dc,0x17e7e0,0x18ab30,0x18b038,0x18b958,0x18bd68,0x18c290,0x18c528,0x18c534,0x18c538,0x18c5c0,0x1907f0,0x1947d0"
