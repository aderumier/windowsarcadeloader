# Dream Raiders (Sega RingWide, 2012), 2 player lightgun game. Runs prg\Game.exe (game.bat's
# path: the game finds Game.ini and data in its folder's parent; a dump with Game.exe at its
# root needs it moved into prg).
# Override values in userprofiles/ringedge/dream-raiders.yaml.
system: ringedge
name: Dream Raiders

input:
  guns_enabled: true
  stick_as_dpad: false
  # the trigger also presses its player's start (joining the game by shooting), the middle
  # button inserts a coin
  gun:
    BTN_LEFT: b1,start
    BTN_MIDDLE: coin

controls:
  b1: Trigger

# the dump's Game.ini (a 1920x1080 screen and render size): its 2D screens (logos, menus) stay
# at their 1280x720 pixel size, small in the middle, and a fixed 1920x1080 fullscreen is cut
# on other screens; the cabinet's 1280x720 instead (the game reads ..\Game.ini: the dump root)
files:
  /Game.ini: systemprofiles/ringedge/files/dream-raiders/Game.ini

env:
  # the main board's monitor resolution (DIP switches 5-7, the manual's setting for the game):
  # 1280x720, switch 7 on, 5 and 6 off
  WAL_RINGEDGE_DIPSW: CF
  # its 1280x720 device in a borderless screen-sized window, the picture stretched to it, 16:9
  # kept (black bars on other screens)
  WAL_WINDOW_SIZE: screen
  WAL_WINDOW_POPUP: "1"
  WAL_D3D9_WINDOWED_SIZE: 1280x720
  WAL_D3D9_ASPECT: "16:9"
  # RingWide: amLib's platform id AAM (the RingEdge payload, a RingWide board)
  WAL_RINGEDGE_PLATFORM: AAM
  WAL_TYPEX_JVS_OUTPUTS: "20"
  # the guns on the JVS board's analog channels: 1/2 player 1 Y/X, 3/4 player 2 Y/X, high values
  # up / left (its default calibration: top-left C0h,C0h), as Let's Go Island
  WAL_TYPEX_JVS_ANALOG_INPUTS: "-ly,-lx,p2:-ly,p2:-lx"
  # region 04, export (the dump's Game.ini REGION E): the main board's (the EEPROM's static
  # record) must be 02 USA, 04 export or 08 China and match the keychip's, else error 0903
  # "wrong region" (a new EEPROM has none, the keychip's default is 01 Japan)
  WAL_RINGEDGE_PCP: keychip.appboot.gameid=SBXM;keychip.appboot.platformid=AAM;keychip.appboot.region=04
  WAL_RINGEDGE_REGION: "04"
  # the cabinet's credit settings record (SRAM, made by the system menu): without it error 0025
  # "main board malfunctioning" (a hang: its error screen spins)
  WAL_RINGEDGE_CREDIT_RECORD: "1"
  # the keychip's challenge file: missing from the dump, generated
  WAL_RINGEDGE_DS_FILE: SBXM_Table.dat
  # the test button (application 3): the game with T (its gametest.bat)
  WAL_RINGEDGE_FOREGROUND: "3=T"
  # its test menu's game settings (the EEPROM): GAME ENTRY MODE INDEPENDENT (gentry 0: each
  # player starts on their own, an energy bar each; 1 SHARE: one start seats both players),
  # CONTINUATION ON (gct 1; SHARE forces it), SEAT MOTION DISABLE (ioseat 0: no motion seat)
  WAL_RINGEDGE_GAME_SETTINGS: gentry=0,gct=1,ioseat=0
  # a player's sight only once that player plays (an unused gun at the center showed player
  # 2's sight all the time), whatever the player's status (+0x118ff60, 0x9c a player: 0 not
  # playing, 1 playing, 3 game over) said: stubs in the int3 padding at +0x250600 skip a
  # status 0 player. In game the sight drawer (+0x84720) asks +0x7e700 for its alpha (0: not
  # drawn): its call answers 0; the dream selection draws the sight sprite (+0x84630, eax the
  # player) directly: it returns at once.
  WAL_PATCHES: "0x250600:8BC369C09C00000083B860FF58010074078BC3E9E8E0E2FF33C0C3,0x847b1:E84ABE1C009090,0x250620:5269D09C00000083BA60FF5801005A7501C383EC08576A00E9F93FE3FF,0x84630:E9EBBF1C0090"
