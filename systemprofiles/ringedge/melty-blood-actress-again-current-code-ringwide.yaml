# Melty Blood Actress Again Current Code (Sega RingWide), fighting game. Runs MBAA.exe.
# Override values in userprofiles/ringedge/melty-blood-actress-again-current-code-ringwide.yaml.
system: ringedge
name: Melty Blood Actress Again Current Code (RingWide)

# the dump's empty _KeyConfig.ini (the PC version's pad configuration) unassigns every
# in-game input (START did nothing in game, the test menu was fine): absent, the game takes
# its cabinet defaults, as the RingEdge 2 dump (which has none)
hide:
  - _KeyConfig.ini

env:
  # RingWide: amLib's platform id AAM (the RingEdge payload, a RingWide board)
  WAL_RINGEDGE_PLATFORM: AAM
  WAL_RINGEDGE_DS_FILE: SBUB_Table.dat
  WAL_RINGEDGE_PCP: keychip.appboot.gameid=SBUB;keychip.appboot.platformid=AAM
  # the EEPROM's static record (region): without it amCredit never initializes, the title
  # shows FREE PLAY but START is refused (no credit to pay with)
  WAL_RINGEDGE_REGION: "01"
  # main board DIP switches SW5+SW6 = 1024x768: the 4:3 picture (default FF = 1920x1080 stretched)
  WAL_RINGEDGE_DIPSW: BF
  # the test menu: MBAA.exe /T (the cabinet's application 3)
  WAL_RINGEDGE_FOREGROUND: "3=/T"
