;; フレームレートを設定します
;; 0: Sync待ちを行わない
;; 1: 秒間60フレーム (1V)  デフォルト値
;; 2: 秒間30フレーム (2V)
;;      by Yoshimasa Hayashida, 2006/10/19
SYNCMODE = 1

;; 全体の音量(ボリューム)を半分に抑えた状態にする
SOUND_VOLUME_HALF = 0

;; サウンドのデバッグ表示出力レベル設定
;; 0: 出力しない（ FINAL のデフォルト）
;; 1: エラーのみ出力
;; 2: 再生ログも出力
;; 3: 生成開放など細かいログまで出力
SOUND_OUTPUT_LEVEL = 2

;; 全体の音量(ボリューム)を０にする（鳴っちゃうのもあるけど。。。だいたい無音）
SOUND_VOLUME_ZERO = 0

;; チートペナルティ(電断/WAN抜き)チェックと、ペナ適用を無効にします
DISABLE_CHEAT_PENALTY_CHECK = 0

;; CarDB で cCarDB_PHP を使うか？
CAR_DB_PHP_MODE = 0

;; レクサスモードにするか？
LEXUS_MODE = 0

