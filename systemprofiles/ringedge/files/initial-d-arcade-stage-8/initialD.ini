;; TAG 店内 連勝リミッタ（１，３，５，０(=無限)）
;; Lindbergh の場合はテストモードの値を使う
STR_WIN_LIMIT_TAG_VS = 0

;; 簡体字モード?   0:日本語   1:簡体字 (海外版のみ)
FONT_CHINESE = 0

;; サーバーBOX使用する?  (__INITIALD_EXP__時、WIN32 と LINDBERGH版__FINAL_RELEASE__以外 に適用)
;; 明示的に切り替えたい場合以外は、USE_SERVER_BOX は基本コメントアウト
;; USE_SERVER_BOX を定義すると、initialD.ini のシート番号が有効になります
;; --------------------------------------------------------------------------------------------
;;           || TESTMODE   USE_SERVER_BOX || PAIR_CABINET_ADDR  SEAT_NUMBER ||    状態
;; --------------------------------------------------------------------------------------------
;;    WIN    || x(未定義)       x         ||       x           initialD.ini || ONLINE(通常)
;;    WIN    ||    x           = 1        ||       x           initialD.ini || ONLINE(通常)
;;    WIN    ||    x           = 0        || initialD.ini      initialD.ini || OFFLINE(ペア) <-
;; -------------------------------------------------------------------------------------------
;; LINDBERGH ||  ENABLE         x         ||       x             Backup     || ONLINE(通常)
;; LINDBERGH ||  ENABLE        = 1        ||       x           initialD.ini || ONLINE(通常)
;; LINDBERGH ||  ENABLE        = 0        ||  FINAL仕様        initialD.ini || OFFLINE(ペア)
;; -------------------------------------------------------------------------------------------
;; LINDBERGH || DISABLE         x         || initialD.ini        Backup     || OFFLINE(ペア) <-
;; LINDBERGH || DISABLE        = 1        ||       x           initialD.ini || ONLINE(スタンドアロン)
;; LINDBERGH || DISABLE        = 0        ||  FINAL仕様        initialD.ini || OFFLINE(ペア)
;; -------------------------------------------------------------------------------------------
