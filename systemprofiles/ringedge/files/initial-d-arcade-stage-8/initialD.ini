;;--------------------------------------------------------------------
;; デバッグモード設定
;;--------------------------------------------------------------------
[ DebugSetting ]
;; レースタイムを無制限にします
RACE_TIME_INFINITE = 0

;; 【公道最速伝説】強制勝利・強制敗北を有効にします(S.DOWN+Vi+St = 勝ち / S.UP+Vi+St = 負け)
;;【MODE_APP_FINALでは無効になります】
FORCE_RACE_CONTROL = 0

;; タイムアタックモードを有効にします
TIMEATTACK_MODE_ENABLE = 1

;; sega spec JVS I/O エラーを無視するか？
IGNORE_JVS_ERROR = 1

;; sega spec キーチップエラーを無視するか？
IGNORE_KEYCHIP_ERROR = 1

;; inid spec eth0 の断線エラーを無視するか？
