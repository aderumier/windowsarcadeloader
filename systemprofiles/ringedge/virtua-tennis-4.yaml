system: ringedge
name: Virtua Tennis 4

env:
  # the keychip DS28CN01 MACs amDongle checks: its fixed challenge, its challenge file
  WAL_RINGEDGE_DS_TABLE: "0x3a3094,0x3a30a0"
  WAL_RINGEDGE_DS_FILE: archive/SBWX_Table.dat
