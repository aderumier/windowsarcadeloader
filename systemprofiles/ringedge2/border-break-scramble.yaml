# Border Break Scramble (Sega RingEdge 2), online team mech shooter. NRS engine, runs nrs.exe
# (PE32 / i386, develop build; a Lindbergh-derived OpenGL renderer, NV_gpu_program4 shaders).
# The amLib stack (amDongle keychip, amJvs JVS board, amSram/amEeprom, amBackup, amPlatform,
# ALL.Net) is statically linked into nrs.exe, so this reuses the RingEdge payload with the
# RingEdge 2 board. Override values in userprofiles/ringedge2/border-break-scramble.yaml.
#
# WORK IN PROGRESS - it plays up to its battle: attract, card select (「カードなし」), GP purchase,
# mode select (個人演習, the CPU practice, the only offline mode), faction, weapon and sortie
# point, then the battle (its 3D world, timer, HUD, minimap, firing, dash). The extended image
# is marked installed by two empty files in the dump's Y folder, Y/SBVA.extend and
# Y/SBVA.extend.complete, which the payload creates (else "Error 0913 Game Program Not Found on
# Storage Device").
# Free play by default (the Free play option); off, credits are kept in the backup: insert coins.
system: ringedge2
name: Border Break Scramble

# Its own wine prefix: two RingEdge games can't run at once (amLib binds the fixed pcp ports
# 40100-40191 on 127.0.0.1), so Border Break must not share `full` with Project DIVA etc.
prefix: wine-prefix/bb-test
# Unpacked from the shared prefix's archive (full.tar.gz, its verbs preinstalled): created from
# scratch, winetricks downloaded and unpacked every verb on the first start (7z failed on
# vcrun2003 on Batocera).
prefix_archive: wine-prefix/full

# game.bat runs tools\ringedge\mxGetHwInfo.exe (a cabinet hardware probe: it only validates the
# PCI graphic/sound IDs in HwInfo.ini and returns errorlevel 0) then nrs.bat, which finally runs
# `.\nrs.exe -wsvga -full -img`. We skip the batch files and the probe and run nrs.exe directly.
#   -wsvga  1024x600 picture (the cabinet resolution; HwInfo.ini resolution = 1024 x 600)
#   -full   full screen
#   -img    load game data from the rom/ image
#   -nnc    "network-checking disable" (built-in flag): skip the in-shop GAME-LAN check at boot
#   -free   "set freeplay" (built-in flag): only a debug flag, credits still needed (free play:
#           the payload, the Free play option)
args: [-wsvga, -full, -img, -nnc, -free]

env:
  # RingEdge 2 board: amPlatform returns platform id AAL2, amBackup uses the RE2 SRAM layout,
  # the SMBIOS reports SEGA / RINGEDGE2 / AAL2 (else "PlatformID is Invalid").
  WAL_RINGEDGE_BOARD: ringedge2
  # amDongle keychip: the game id answered to keychip.appboot.gameid. SBVA, confirmed by the
  # version table embedded in nrs.exe ("rom/version.txt SBVA 4.04.00 4.5.0") and matching the
  # dump's DS challenge table SBVA_Table.dat (the amDongle DS28CN01 MAC table).
  # billing.nearfull: the billing type in its high 16 bits, 1 the only one Border Break accepts
  # (alpb's MODE check after its accounting report, else Error 21 ErrNo 8113), 512 near full
  WAL_RINGEDGE_PCP: keychip.appboot.gameid=SBVA;keychip.billing.nearfull=00010200
  # (the platform id stays the default AAL: the boot check FUN_0045a6f0 wants exactly "AAL")
  # the EEPROM static record's region (Japan): amLib reads 0 without it, ANDed with the keychip's
  # region 01 -> error index 4 "Error 0903 Wrong Region" (FUN_00458fd0), the boot's black screen
  WAL_RINGEDGE_REGION: "01"
  # ... and a well formed board serial number in that record: the billing library
  # (alpbExInitialize, FUN_006ffd60) checks it, without it "Error 21" (alpb not initialized)
  WAL_RINGEDGE_BOARD_SERIAL: AAVE-01A00000001
  # the RingEdge 2's Realtek HD Audio codec (HwInfo.ini sound-device), enumerated by
  # amPlatformGetSoundInfo: none under Wine -> error index 6 "Error 0906 Sound Function Not Found"
  WAL_RINGEDGE_SOUND_DEVICE: "10ec:0888"
  # the USB devices (the cabinet's aim control, a Sega USB HID device 0ca3:000b), answered by the
  # payload: Wine's own USB enumeration can block the boot after the JVS check for long seconds
  WAL_RINGEDGE_USB_DEVICES: "0ca3:000b"
  # ... and the raw input mouse the boot counts (FUN_0067cdf0: a name with "HID#Vid_0ca3&Pid_000b#",
  # case sensitive), listed by the payload
  WAL_RINGEDGE_RAW_MOUSE: "HID#Vid_0ca3&Pid_000b"
  # main board DIP switches (FUN_0045a0e0): resolution (bits 0x70) 2 = 1024x600, the only one the
  # boot check FUN_00679cb0 accepts ("Error 0910 Wrong Resolution Setting" else, the default FF
  # is 7), and 0x08 off = horizontal monitor ("Wrong Horizontal / Vertical Setting" else)
  WAL_RINGEDGE_DIPSW: "20"
  # its keychip AES check (FUN_004595a0): 3 blocks at 0xb841cc decrypted by the keychip must be
  # the string at 0xb84198, else the keychip is unauthenticated (error index 1)
  WAL_RINGEDGE_KEYCHIP_DECRYPT: "7841cc:784198:30"
  # the keychip DS challenge table shipped in the dump root
  WAL_RINGEDGE_DS_FILE: SBVA_Table.dat

  # The boot's checks (FUN_0089a010): IC card R/W, network (ALL.Net auth, its title server
  # /SBVA/ and its billing below), extended image, game server.
  #
  # Full-screen presentation: the game draws a 1024x600 picture. Scale it to the screen (aspect
  # kept) in a borderless popup window, no cursor - as the other RingEdge 2 games.
  WAL_RINGEDGE_GL_SCALE: 1024x600
  WAL_WINDOW_POPUP: "1"
  WAL_HIDE_CURSOR: "1"
  # Shaders: rom/shader.pfa holds NV_gpu_program4 assembly (`!!NVvp4.0`/`!!NVfp4.0`, Cg's
  # gp4), translated to ARB programs for Mesa by the fix-up. (The dump's
  # rom/shader_lindbergh.pfa is an older build of them for another parameter layout - matrices
  # at env 83, colors in fragment env 0: with it the battle's world is not drawn.)
  WAL_RINGEDGE_CG_FIX: auto
  # its objects' matrix index (vertex attribute 7) is an integer array its ARB programs read as
  # floats: given as a float array (else every object drawn with the first matrix)
  WAL_RINGEDGE_GL_INT_ATTRIBS: "1"
  # Network link up: amNetwork's query_nic_status answers status=1 with the addresses in the one
  # reply, so amLib's net-status bit 1 (link up) is set and the boot's DHCP step (FUN_004f6310)
  # passes instead of spinning on query_dhcp_status (the "DHCP WAIT" shared with Project DIVA).
  # This is the proper fix; the offline DHCP patch above is no longer needed.
  WAL_RINGEDGE_NIC_STATUS: "1"
  # the keychip's network address dotted (the game reads it with inet_addr, else ERROR 8001)
  WAL_RINGEDGE_NETWORKADDR_DOTTED: "1"
  # the payload's ALL.Net server answers amAuth (the game's auth -> the game/title server URIs),
  # as Project DIVA. Without it the ALL.Net stage never completes (keychip.version poll loop).
  WAL_ALLS_ALLNET: "1"
  # its own ALL.Net client (amLib's alw, http://naominet.jp/sys/servlet/PowerOn, as Project
  # DIVA): the store router and ALL.Net's hosts resolved by the payload, its connections to
  # them the payload's ALL.Net server
  WAL_RINGEDGE_ALLNET: borderbreak
  # its billing's OpenSSL 0.9.8i verifies no SHA-256 certificate: the billing server's dummy PKI
  # re-issued with SHA-1 (the CA the keychip gives, the server's certificate)
  WAL_BILLING_SHA1: "1"
  # amJvs uses the serial JVS driver and may also open a COM port (as Initial D 7).
  WAL_TYPEX_JVS_PORT: "mxjvs,COM4"
  # the I/O board must declare analog inputs, rotary inputs and 20 general purpose outputs (the
  # node check FUN_0067afa0, else "Error 6401 JVS I/O board is not connected").
  # Left grip (the JVS board, player 1; the game's INPUT TEST, FUN_008a04b0): button 1 JUMP,
  # button 2 DASH, button 3 ACTION; the move stick on analog channel 1 (X) and 0 (Y): the game
  # swaps the two channels (FUN_00679de0); its Y up is forward (the stick's up negative: inverted,
  # else forward and back swapped)
  WAL_TYPEX_JVS_ANALOG_INPUTS: "-ly,lx"
  WAL_TYPEX_JVS_ROTARY: "2"
  WAL_TYPEX_JVS_OUTPUTS: "20"
  # Right grip: the cabinet's aim control is a USB mouse read with DirectInput (relative motion,
  # ~127 counts a frame the game's full aim speed; buttons A fire, B, C). The right stick moves
  # it, b4 b5 b6 press its buttons
  WAL_DINPUT_MOUSE_STICK: "90"
  WAL_DINPUT_MOUSE_STICK_AXES: "rx,ry"
  WAL_DINPUT_MOUSE_BUTTONS: "b4,b5,b6"
  # ... a DirectInput mouse button only counts with its window message (0x67a068: the right
  # grip's buttons ANDed with WM_L/R/MBUTTON's): the three checks jumped over
  WAL_PATCHES: "0x27a083:EB,0x27a098:EB,0x27a0ad:EB"
  # COM1 is the cabinet's touch panel, Sega's CTR-251500 controller (as Puyo Puyo!! Quest),
  # checked at boot ("CHECKING TOUCH PANEL", error 22 without an answer)
  WAL_RINGEDGE_TOUCH: COM1
  # its 1024x600 screen (the touch reports' scale); the touch: the pointer (the left stick, a
  # mouse acting as a gun) with b8
  WAL_RINGEDGE_TOUCH_SCREEN: 1024x600
  # the game's calibration (the backup's 5-point table at 0x16dbfe8, read from the dump) on
  # 4095 minus the panel's X and Y (FUN_008b31e0): the screen's X 0-1023 from 326-3803, Y 0-599
  # from 332-3641, i.e. X mirrored on the panel, Y from the bottom (the screen points of the
  # panel's report at the screen's top left and bottom right)
  WAL_RINGEDGE_TOUCH_CALIBRATION: "942.25,48.8,73,533.5"
  # the touch pointer: a small red dot where the left stick points (drawn over the picture by
  # the OpenGL fix-up), hidden after 5 s without moving (the stick also moves the mech in battle)
  WAL_CROSSHAIR: "1"
  WAL_CROSSHAIR_STYLE: disc
  WAL_CROSSHAIR_SIZE: "2"
  WAL_CROSSHAIR_COLOR: FF2020
  WAL_CROSSHAIR_HIDE: "5"
  # the pointer (touch and dot): the mouse (on the pedals) or the left stick, the last moved
  WAL_RINGEDGE_TOUCH_POINTER: pedals-stick
  WAL_CROSSHAIR_AXES: pedals-stick
  # COM2 is the cabinet's IC card reader/writer, checked at boot ("CHECKING IC CARD R/W", error
  # 23 without an answer): emulated without a card
  WAL_RINGEDGE_IC_CARD: COM2
  # the test button (foreground application 3): relaunch the game with -test (its gametest.bat)
  WAL_RINGEDGE_FOREGROUND: "3=-test"

# amPlatformGetOsVersion reads C:\System\SystemVersion.txt (8 digits: the RingEdge OS version,
# 0011.01.02 the RingEdge Lv2 SDK of HwInfo.ini); without it the boot check FUN_0045a6f0 sets
# error index 3 = "Error 0902 Wrong System Platform". The dump's System/ folder holds it.
c_folders:
  System: System

# the cabinet's Y: and W: drives (FUN_0089cdc0: the data roots, W:/lfs_server the network data
# download list; absent, "[LFS SERVER] Download-list Write Error"): folders of the dump
drives:
  y: Y
  w: W

# Left grip: move stick and its three buttons; right grip: the aim (right stick) and its three
# buttons; the touch panel for the menus (start: touch the screen).
input:
  stick_as_dpad: false
  # the mouse (or a gun) is the touch pointer, its left button the touch: its position on the
  # pedals, which the game does not read (on the left stick it would walk the mech in battle);
  # the touch's place is the mouse or the left stick, whichever moved last
  guns_enabled: true
  gun:
    x: accel
    y: brake
    BTN_LEFT: b8
    BTN_RIGHT: none
    BTN_MIDDLE: none
    BTN_2: none
  # the keyboard: WASD the move stick, the arrows the aim (the defaults: left Ctrl jump, left
  # Alt dash, Space action, left Shift fire, V the touch)
  keyboard:
    p1:
      KEY_W: -ly
      KEY_S: ly
      KEY_A: -lx
      KEY_D: lx
      KEY_UP: -ry
      KEY_DOWN: ry
      KEY_LEFT: -rx
      KEY_RIGHT: rx

# Control names for the GUI mapping rows.
controls:
  lx: Move stick X
  ly: Move stick Y
  rx: Aim X
  ry: Aim Y
  b1: Jump
  b2: Dash
  b3: Action
  b4: Fire (right grip A)
  b5: Right grip B
  b6: Right grip C
  b8: Touch

options:
  - title: Game
    options:
      - key: WAL_FREEPLAY
        label: Free play
        kind: bool
        description: >-
          Games start without coins. Off: the coins and credits of the system test menu.
      - key: WAL_CROSSHAIR
        label: Touch pointer
        kind: bool
        description: >-
          A small red dot where the left stick points (the touch position).
      - key: WAL_CROSSHAIR_SIZE
        label: Touch pointer size
        kind: number
        min: 1
        max: 6
        description: >-
          The dot's size, in percent of the screen height.
