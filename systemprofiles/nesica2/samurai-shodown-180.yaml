# Samurai Shodown 1.80.00 (SNK, NESiCAxLive 2, 64-bit Unreal Engine 4) - template, override
# values in userprofiles/nesica2/samurai-shodown-180.yaml.
system: nesica2
name: Samurai Shodown (1.80.00)

# The real executable is started directly (game.exe is Unreal's launcher stub). The game loads
# NxL2Core.dll at run time from its Unreal plugin folder: the payload's x86_64 build goes there.
# Its NESYS client is the game's own NxL2NESYSLib.dll (served by the payload's NESYS pipe).
payload_install: [Onion/Plugins/NxL2CorePlugin/NxL2Core.dll]

env:
  # Offline NESYS: the service answers but reports the network down (NW_ERROR), as other
  # loaders run it. Online, the game reads its card object storage (character data, type 442)
  # before every fight and waits forever on "loading..." for a reply format we do not know.
  WAL_NESICA_NESYS_OFFLINE: "1"
  # Online only: the certificate's server list (`ms`, `ss`, and `s3`: NxL2NESYSLib.dll crashed
  # without it).
  WAL_NESICA_NESYS_HOST: card_id=7020392010281502,ms=127.0.0.1,ss=127.0.0.1,s3=127.0.0.1
# Control names (the GUI's mapping rows).
controls:
  b1: A
  b2: B
  b3: C
  b4: D
