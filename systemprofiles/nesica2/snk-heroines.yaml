# SNK Heroines Tag Team Frenzy (SNK, NESiCAxLive 2, 64-bit) - template, override values in
# userprofiles/nesica2/snk-heroines.yaml.
system: nesica2
name: SNK Heroines Tag Team Frenzy

# 64-bit game (Direct3D 11, XAudio2.8), as The King of Fighters XIV: NxL2Core.dll replaced by
# the payload's x86_64 build; the game talks to the NESYS service on its pipe itself.

# The dump's dinput8.dll is a 32-bit input hack of another loader (not loadable here).
hide: [dinput8.dll]

env:
  # The certificate's server list, as KOF XIV (`ms` and `ss` read after the certificate).
  WAL_NESICA_NESYS_HOST: card_id=7020392010281502,ms=127.0.0.1,ss=127.0.0.1
  # 1080p (the cabinet setting); 0 = 720p.
  WAL_NXL2_SETTINGS: Resolution=1

# Buttons A B C D = b1-b4 (default mapping).

# Control names (the GUI's mapping rows).
controls:
  b1: A
  b2: B
  b3: C
  b4: D
