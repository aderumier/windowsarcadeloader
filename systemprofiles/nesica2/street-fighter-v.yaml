# Street Fighter V Type Arcade (Capcom / Taito, NESiCAxLive 2, 64-bit Unreal Engine 4) -
# template, override values in userprofiles/nesica2/street-fighter-v.yaml.
system: nesica2
name: Street Fighter V Type Arcade

# The real executable is started directly (WindowsNoEditor\StreetFighterV.exe is Unreal's
# launcher stub). The cabinet's I/O board (the levers, buttons, coins, the NESiCA reader) is
# Taito's USB I/O library, StreetFighterV\Plugins\USBIOPlugin\UIO_AMIC.dll: the payload
# (sfv.rs), started by wal-loader before the game. The game's NESYS client
# (NESYSUtil\NESiCAUtilLib.dll) talks to the payload's NESYS pipe.
payload_install: [WindowsNoEditor/StreetFighterV/Plugins/USBIOPlugin/UIO_AMIC.dll]
payload_loader: true

# The NESiCAxLive deliveries the game mounts from its drive's root: C:\Patch\patch.pak, the
# patch_chara_stage paks (later characters and stages), TitlePlate.pak (the title plates'
# list), sound.pak. The dump's Patch folder (the game stops at once without it).
c_folders:
  Patch: Patch

env:
  # The certificate's server list, as the other NESiCAxLive 2 games.
  WAL_NESICA_NESYS_HOST: card_id=7020392010281502,ms=127.0.0.1,ss=127.0.0.1
  # The card is put on the reader when the game reads it (no card input on a gamepad).
  WAL_NESICA_CARD_AUTO: "1"
  # A new card is registered by the game (NESYS card insert): no reissue reserved, unregistered.
  WAL_NESYS_REGISTER: "1"
  # Only the payload's input: no DirectInput pad.
  WAL_DINPUT_DISABLE: "1"

# One player per cabinet (the versus is cabinet to cabinet: here against the computer).
# Control names (the GUI's mapping rows).
controls:
  b1: Light punch
  b2: Medium punch
  b3: Heavy punch
  b4: EX1
  b5: Light kick
  b6: Medium kick
  b7: Heavy kick
  b8: EX2
  start: Start
  coin: Coin
  service: Service
  test: Test
