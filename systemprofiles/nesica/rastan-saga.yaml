# Rastan Saga (NESiCAxLive) - template, override values in
# userprofiles/nesica/rastan-saga.yaml.
system: nesica
name: Rastan Saga

# Direct3D 9 game (DXVK). No crypto key.
# d3d9.dll of the dump is ReShade (CRT shader): use DXVK.
hide: [d3d9.dll]

# Buttons Attack, Jump = b1, b2 (default mapping).

env:
  # The game wants 1280x768 fullscreen, not a mode Wine emulates: 1280x800, scaled to the screen.
  WAL_D3D9_FULLSCREEN_SIZE: 1280x800

# Control names (the GUI's mapping rows).
controls:
  b1: Attack
  b2: Jump
