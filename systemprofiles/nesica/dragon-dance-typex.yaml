# Dragon Dance (Taito, filed as TAITO TYPE X) - template, override values in
# userprofiles/nesica/dragon-dance-typex.yaml.
# The NESiCAxLive build (same game.exe and game_liong.exe as nesica/dragon-dance), with a
# replacement iDmacDrv32.dll: the NESiCA payload stands in for it.
system: nesica
name: Dragon Dance

# game.exe (NxL_DD_Check) starts "game_liong.exe -s", see nesica/dragon-dance.
# Native DirectMusic/dsound: with wine's it crashed 3 s after start.
tricks: [dmband, dmcompos, dmime, dmloader, dmscript, dmstyle, dmsynth, dmusic, dmusic32, dsound, dswave, dsdmo, gmdls]

# d7vk: particle effects drawn with an opaque black background with wine's ddraw, see
# nesica/dragon-dance.
graphics: d7vk

# Crash at start (+0x1174b) when the saved display settings differ from the defaults: same
# code patch as nesica/dragon-dance.
env:
  WAL_PATCHES: "0xF804:8B0DA4BF7C0085C97517EB20909090"
  WAL_PATCHES_EXE: game_liong.exe

# Button 1 = b1 (default mapping). The trackball is the Windows mouse.
