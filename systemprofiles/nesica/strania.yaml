# Strania: The Stella Machina (NESiCAxLive) - template, override values in
# userprofiles/nesica/strania.yaml.
system: nesica
name: 'Strania: The Stella Machina'

# Direct3D 9 game (DXVK), XAudio2. No crypto key.
# xinput1_3.dll of the dump is Microsoft's: use wine's.
# Sound effects use XAudio2 2.6 through registration-free COM, as Senko no Ronde DUO
# (game.exe.manifest -> Dlls.XAudio2.manifest -> the dump's XAudio2_6.dll, loaded by path
# whatever the DLL overrides): without the manifests the game gets wine's xaudio2_6.
hide: [xinput1_3.dll, game.exe.manifest, Dlls.XAudio2.manifest, XAudio2_6.dll]
# Silent with the native XAudio2 2.6 / XACT 3.6 (the dump's, registered, and the prefix's xact):
# wine's.
dll_overrides:
  xaudio2_6: b
  xactengine3_6: b

# Buttons A, B = b1, b2 (default mapping).
