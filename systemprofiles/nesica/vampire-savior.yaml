# Vampire Savior: The Lord of Vampire (NESiCAxLive) - template, override values in
# userprofiles/nesica/vampire-savior.yaml.
system: nesica
name: 'Vampire Savior: The Lord of Vampire'
exe: 'Z:\userdata\roms\nesica\Vampire Savior - The Lord of Vampire\game.exe'

# Direct3D 9 game (DXVK), XAudio2. test.exe is the test menu.

# Buttons LP MP HP / LK MK HK (FastIO btn1-btn6, as WindowsLoader): virtual top row b1-b3 =
# punches, bottom row b5-b7 = kicks.
native_map:
  b4: none
  b5: btn4
  b6: btn5
  b7: btn6
