# The King of Fighters 2002 Unlimited Match (NESiCAxLive) - template, override values in
# userprofiles/nesica/kof-2002-um.yaml.
system: nesica
name: The King of Fighters 2002 Unlimited Match
exe: 'Z:\userdata\roms\nesica\The King of Fighters 2002 - Unlimited Match\game.exe'

# Direct3D 9 game (DXVK), imports the debug d3dx9d_42.dll shipped with it. No crypto key.
# dinput8.dll of the dump is "Game Loader All RH" (a Type X loader hack): use wine's.
hide: [dinput8.dll]

# Buttons A B C D: usual layout A=Button1 B=Button2 C=Button4 D=Button5 (2 rows of 3).
# Virtual top row b1-b4 = A B C D.
native_map:
  b1: btn1
  b2: btn2
  b3: btn4
  b4: btn5
  b5: none
  b6: none

env:
  # It polls a Direct3D event query into a 1-byte variable at the top of its stack frame; DXVK
  # writes the whole 4-byte BOOL and overwrites the saved EBP: crash after the first frame.
  WAL_D3D9_QUERY_FIX: "1"
