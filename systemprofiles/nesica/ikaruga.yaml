# Ikaruga (NESiCAxLive) - template, override values in
# userprofiles/nesica/ikaruga.yaml.
system: nesica
name: Ikaruga

# Direct3D 9 game (DXVK), XAudio2. No crypto key.
# Text is drawn with GDI fonts "MS UI Gothic" (Japanese): aliases to Source Han Sans.
tricks: [fakejapanese]

# Buttons Fire, Polarity, Release = b1-b3 (default mapping).

# Control names (the GUI's mapping rows).
controls:
  b1: Fire
  b2: Polarity
  b3: Release
