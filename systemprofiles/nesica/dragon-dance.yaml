# Dragon Dance (NESiCAxLive) - template, override values in
# userprofiles/nesica/dragon-dance.yaml.
system: nesica
name: Dragon Dance

# game.exe (NxL_DD_Check) stands in for the NESiCAxLive launcher: it creates the NxL events,
# shared memory and pipe, then starts "game_liong.exe -s" (started directly it exits).
# DirectDraw + Direct3D (DX6) game; the dump's ddraw.dll (DDrawCompat) is hidden.
# With wine's dsound/DirectMusic it crashed 3 s after start (method call on a NULL object):
# native ones.
tricks: [dmband, dmcompos, dmime, dmloader, dmscript, dmstyle, dmsynth, dmusic, dmusic32, dsound, dswave, dsdmo, gmdls]
# d7vk: with wine's ddraw (wined3d GL) the particle effects (the dragon's smoke, the sparkles
# of a match) drew their black background opaque.
graphics: d7vk

# Button 1 = b1 (default mapping). The trackball is the Windows mouse (game mouse events):
# a mouse or trackball on the PC works directly.

# Crashed at start (game_liong.exe+0x1174b, method call on NULL) when the display settings
# differ from the defaults (e.g. once saves exist): applying them (+0xe120) frees an effect
# object (0x7cbfa4) and recreates the device, whose window messages draw a frame before the
# object is recreated; its "created" flag (0x7cbfa8) is still set. The frame now checks the
# object itself: mov ecx,[0x7cbfa4] / test ecx,ecx / jne draw / jmp skip.
env:
  WAL_PATCHES: "0xF804:8B0DA4BF7C0085C97517EB20909090"
  WAL_PATCHES_EXE: game_liong.exe
