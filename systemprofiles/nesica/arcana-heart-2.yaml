# Arcana Heart 2 (NESiCAxLive) - template, override values in
# userprofiles/nesica/arcana-heart-2.yaml (same keys, only what changes).
system: nesica
name: Arcana Heart 2
# Windows path of the game executable (Z:\ = Linux /, C:\ = prefix drive_c).
exe: 'Z:\userdata\roms\nesica\Arcana Heart 2\game.exe'

graphics: wine
# d3d11.dll is a ReShade build (bezel) and Dinput8.dll a Microsoft one: use wine's.
hide: [d3d11.dll, Dinput8.dll]

# Buttons A B C D E: E is FastIO Button6.
# Virtual stick top row b1-b4 = A B C D, bottom row b5 = E.
native_map:
  b5: btn6

env:
  # Resolution=0: built-in 480p (SD) mode
  WAL_NESICA_REG: "Resolution=1"
