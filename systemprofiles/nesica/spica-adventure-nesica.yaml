# Spica Adventure (NESiCAxLive, game.exe CRC32 0x739bde93).
# Override values in userprofiles/nesica/spica-adventure-nesica.yaml.
# This release still uses JVS on COM2: load the Type X payload.
system: typex
name: Spica Adventure (NESiCAxLive)

# Direct3D 9 game (DXVK), JVS I/O on COM2.

# Buttons 1-3 = b1-b3 (default mapping).

# Control names (the GUI's mapping rows).
controls:
  b1: Attack
  b2: Jump
  b3: Button 3
