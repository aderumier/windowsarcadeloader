# Nitroplus Blasterz: Heroines Infinite Duel (NESiCAxLive) - template, override values in
# userprofiles/nesica/nitroplus-blasterz.yaml.
system: nesica
name: 'Nitroplus Blasterz: Heroines Infinite Duel'

# Direct3D 9 game (DXVK), XAudio2. No crypto key.
# ksuser.dll of the dump is Microsoft's: use wine's.
hide: [ksuser.dll]

# Buttons 1-6 = b1-b6 (default mapping).

# Control names (the GUI's mapping rows).
controls:
  b1: Button 1
  b2: Button 2
  b3: Button 3
  b4: Button 4
  b5: Button 5
  b6: Button 6
