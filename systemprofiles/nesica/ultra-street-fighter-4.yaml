# Ultra Street Fighter 4 (NESiCAxLive) - template, override values in
# userprofiles/nesica/ultra-street-fighter-4.yaml.
system: nesica
name: Ultra Street Fighter 4

# Direct3D 9 game (DXVK), XAudio2. test.exe is the test menu.
# dinput8.dll of the dump is Microsoft's: it enumerates the host's raw HID devices and
# blocks reading ones that never report (security keys, ...): use wine's.
hide: [dinput8.dll]

# Buttons LP MP HP / LK MK HK (FastIO btn1-btn6): virtual top row b1-b3 =
# punches, bottom row b5-b7 = kicks.
native_map:
  b4: none
  b5: btn4
  b6: btn5
  b7: btn6

env:
  # encrypted data: crypto service with the Ultra Street Fighter 4 key
  WAL_NESICA_KEY: usf4
