# Exception (NESiCAxLive) - template, override values in
# userprofiles/nesica/exception.yaml.
system: nesica
name: Exception

# No picture with wine's dsound: native dsound/DirectMusic.
tricks: [dmband, dmcompos, dmime, dmloader, dmscript, dmstyle, dmsynth, dmusic, dmusic32, dsound, dswave, dsdmo, gmdls]

# OpenGL game (SDL 1.2). glu32.dll of the dump is Microsoft's: use wine's.
hide: [glu32.dll]

# Buttons 1-3 = b1-b3 (default mapping).

env:
  # Its config file runs it in a 640x480 window: SDL_SetVideoMode made fullscreen.
  WAL_SDL_FULLSCREEN: "1"

# Control names (the GUI's mapping rows).
controls:
  b1: Button 1
  b2: Button 2
  b3: Button 3
