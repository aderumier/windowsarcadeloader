# Persona 4 The Ultimate in Mayonaka Arena (NESiCAxLive) - template, override values in
# userprofiles/nesica/persona-4-arena.yaml.
system: nesica
name: Persona 4 The Ultimate in Mayonaka Arena
exe: 'Z:\userdata\roms\nesica\P4U - Persona 4 The Ultimate in Mayonaka Arena\game.exe'

# Direct3D 9 game (DXVK), XAudio2.
# Dinput8.dll of the dump is Microsoft's: use wine's.
hide: [Dinput8.dll]

# Buttons A B C D = b1-b4 (default mapping).

env:
  # encrypted data: crypto service with the Persona 4 Arena key
  WAL_NESICA_KEY: persona4arena
  # the content key as a plaintext blob encrypted for the game (as KOF XIII Climax): with the
  # SIMPLEBLOB reply the game crashed when stage 1 starts
  WAL_NESICA_CRYPT_REPLY: plaintext
  # shop hours check (test menu OPEN/CLOSE TIME) always "open" (same function as BBCF):
  # otherwise NESiCA is disabled after closing time with a red "closing time has passed" banner
  WAL_PATCHES: "0x6C9D0:B801000000C3"
