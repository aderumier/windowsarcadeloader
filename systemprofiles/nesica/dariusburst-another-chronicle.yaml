# Dariusburst Another Chronicle (Taito) - template, override values in
# userprofiles/nesica/dariusburst-another-chronicle.yaml.
# The previous version of Dariusburst Another Chronicle EX, same setup (see its profile):
# NESiCA architecture although the dump is filed with the Type X2 games.
# Build 1.05 (game.exe: "DARIUSBURST ANOTHER CHRONICLE Ver1.05").
system: nesica
name: Dariusburst Another Chronicle (1.05)

env:
  # encrypted data: crypto service with the Dariusburst key
  WAL_NESICA_KEY: darius
  # coin counters consumed by the game (as EX)
  WAL_FASTIO_COIN: counter
  # 4-player cabinet: a second FastIO board (players 3/4) must answer, else I/O error
  WAL_FASTIO_BOARDS: "2"
  # master volume knob (0x4124) at maximum (silent at 0)
  WAL_FASTIO_ANALOG1: "FF"
  # Test menu in Japanese (Shift-JIS), unreadable under a western code page.
  WAL_ANSI_CODEPAGE: "932"
  # Right (players 3/4) screen un-flipped, as EX: the composite shader's isInv_RV -> 0.0f
  # (1.05 build addresses).
  WAL_PATCHES: "0x4D4E34:302E306620202020,0x4D4E4C:2A20302E306620202020202D"
  # The game draws both screens side by side in one 2720x768 back buffer (two 1360x768) and
  # sizes its window to the screen: stretched to it, the picture was too tall. Presented to a
  # centered 85:24 rectangle, black bars ("0": stretched; Batocera ES: KEEP ASPECT RATIO).
  WAL_D3D9_ASPECT: "85:24"
  WAL_KEEP_ASPECT_RATIO: "1"

# The dump's init.ini disables JVS (6th line 0): coins never credited. EX's file, JVS on
# (same settings otherwise).
files:
  init.ini: systemprofiles/nesica/files/dariusburst-another-chronicle-ex/init.ini

# The game's own options, for the GUI's Options tab (its env variables above).
options:
  - title: Display
    options:
      - key: WAL_KEEP_ASPECT_RATIO
        label: Keep aspect ratio
        kind: bool
        description: >-
          The game's wide picture (two 16:9 screens side by side) with its aspect kept, black
          bars above and below. Off: stretched to the whole screen.

# Control names (the GUI's mapping rows).
controls:
  b1: Shot
  b2: Burst
