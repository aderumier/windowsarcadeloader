# Gouketsuji Ichizoku: Matsuri Senzo Kuyou (NESiCAxLive) - template, override values in
# userprofiles/nesica/gouketsuji-ichizoku.yaml.
system: nesica
name: 'Gouketsuji Ichizoku: Matsuri Senzo Kuyou'

# Direct3D 9 game (DXVK); loads iDmacDrv32.dll at runtime (not imported).
# D3D8.dll/D3D9.dll are dgVoodoo (DDraw/D3DImm hidden by the wine graphics mode).
hide: [D3D8.dll, D3D9.dll]

# Buttons 1-6 = b1-b6 (default mapping).

# Control names (the GUI's mapping rows).
controls:
  b1: Button 1
  b2: Button 2
  b3: Button 3
  b4: Button 4
  b5: Button 5
  b6: Button 6
