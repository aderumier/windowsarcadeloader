# Psychic Force 2012 (NESiCAxLive) - template, override values in
# userprofiles/nesica/psychic-force-2012.yaml.
system: nesica
name: Psychic Force 2012
# game.exe (PhyLauncher) stands in for the NESiCAxLive launcher: it creates the NxL events,
# shared memory and pipe, then starts "game2.exe launcher", which waits for them (started
# directly it never opens its I/O): the dump's .windowsloader points to game.exe.
# game2.exe loads our iDmacDrv32.dll from the run directory. TestMode.exe is the test menu.

# Direct3D 8 game (DXVK d3d8). No crypto key.
# Never opened its I/O with wine's dsound: native dsound/DirectMusic.
tricks: [dmband, dmcompos, dmime, dmloader, dmscript, dmstyle, dmsynth, dmusic, dmusic32, dsound, dswave, dsdmo, gmdls]

# Buttons 1-6 = b1-b6 (default mapping).

env:
  # HD mode (Resolution=1) picks resolution preset 5, 1280x768, which Wine does not offer
  # ("Cannot Support Full Screen"): preset 6, 1280x720 (mov esi,5 -> mov esi,6).
  WAL_PATCHES: "0xA79BB:06"
  # only in game2.exe (TestMode.exe loads the payload too)
  WAL_PATCHES_EXE: game2.exe
