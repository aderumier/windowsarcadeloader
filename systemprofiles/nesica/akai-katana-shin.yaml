# Akai Katana Shin (NESiCAxLive) - template, override values in
# userprofiles/nesica/akai-katana-shin.yaml.
system: nesica
name: Akai Katana Shin

# Direct3D 9 game: through DXVK (default). No crypto key.
# Its sprite effects (Sprite_i*.cfx) are HLSL source compiled at load: Wine's d3dx9_37 fails
# ("Failed to compile ASCII effect") and the renderer crashes on the missing effect.
tricks: [d3dx9_37]
# Dinput8.dll of the dump is Microsoft's: use wine's.
hide: [Dinput8.dll]

# Buttons 1-4 = b1-b4 (default mapping).

# Control names (the GUI's mapping rows).
controls:
  b1: Button 1
  b2: Button 2
  b3: Button 3
  b4: Button 4
