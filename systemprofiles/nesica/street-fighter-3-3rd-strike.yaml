# Street Fighter III 3rd Strike: Fight for the Future (NESiCAxLive) - template, override values in
# userprofiles/nesica/street-fighter-3-3rd-strike.yaml.
system: nesica
name: 'Street Fighter III 3rd Strike: Fight for the Future'

# Direct3D 9 game (DXVK), XAudio2. test.exe is the test menu.

# Buttons LP MP HP / LK MK HK (FastIO btn1-btn6): virtual top row b1-b3 =
# punches, bottom row b5-b7 = kicks.
native_map:
  b4: none
  b5: btn4
  b6: btn5
  b7: btn6

# Control names (the GUI's mapping rows).
controls:
  b1: Light Punch
  b2: Medium Punch
  b3: Heavy Punch
  b5: Light Kick
  b6: Medium Kick
  b7: Heavy Kick
