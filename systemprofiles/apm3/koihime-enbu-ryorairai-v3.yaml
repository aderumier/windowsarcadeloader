# Koihime Enbu RyoRaiRai Version 3 (Sega ALLS, APM3 edition; 32-bit). Runs KoihimeEnbu_apm3.exe;
# its test mode is the same program (the dump's gametest.bat), started again by the test switch.
# Aime card: always on the reader (the game asks after START); the card input (F4, pad guide)
# takes it off. The player's data in apms/gs-<aime id>.json of the game folder (the payload's
# ABAAS game server).
# Override values in userprofiles/apm3/koihime-enbu-ryorairai-v3.yaml.
system: apm3
name: Koihime Enbu RyoRaiRai Version 3

env:
  # a 16:9 game on a 4:3 screen (Batocera at 1600x1200: its Direct3D 9 window 1392x783, small
  # in the middle): a 1920x1080 desktop for it, its borderless window that size, stretched over
  # the screen (WAL_KEEP_ASPECT_RATIO "1", Batocera ES's KEEP ASPECT RATIO: black bars), its
  # device windowed at 1920x1080
  WAL_DESKTOP_SIZE: 1920x1080
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: 1920x1080
  WAL_D3D9_WINDOWED_SIZE: 1920x1080
  WAL_DESKTOP_STRETCH: "1"
  WAL_KEEP_ASPECT_RATIO: "0"
  WAL_DESKTOP_CLIENT: "1"
  WAL_APM3_TEST: KoihimeEnbu_apm3.exe
  # the test program is the game started again: marked by an argument the game ignores
  WAL_APM3_TEST_ARGS: "-wal-test"
  # ALL.Net, the Aime server and the game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  WAL_APM3_CARD_AUTO: "1"

input:
  gamepad:
    guide: card

controls:
  card: Aime card (take off / put back)
