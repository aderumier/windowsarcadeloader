# Nosferatu Lilinor (Sega ALLS, APM3 edition; Unity, 64-bit). Runs NLAM.exe; the test switch
# starts its test mode (-test, the dump's gametest.bat), whose exit starts the game again.
# Aime card: always on the reader (the game asks after START); the card input (F4, pad guide)
# takes it off. The player's data in apms/gs-<aime id>.json of the game folder (the payload's
# ABAAS game server).
# Override values in userprofiles/apm3/nosferatu-lilinor.yaml.
system: apm3
name: Nosferatu Lilinor

env:
  # a 16:9 game on a 4:3 screen (Batocera at 1600x1200: letterboxed, or cut on the right): a
  # 1920x1080 desktop for it, its borderless window stretched over the screen
  # (WAL_KEEP_ASPECT_RATIO "1", Batocera ES's KEEP ASPECT RATIO: black bars); the window's
  # client size in the desktop's units (GetClientRect, WM_SIZE): its back buffer
  WAL_DESKTOP_SIZE: 1920x1080
  WAL_WINDOW_POPUP: "1"
  WAL_DESKTOP_STRETCH: "1"
  WAL_KEEP_ASPECT_RATIO: "0"
  WAL_DESKTOP_CLIENT: "1"
  WAL_APM3_TEST: NLAM.exe
  WAL_APM3_TEST_ARGS: "-test"
  # ALL.Net, the Aime server and the game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  WAL_APM3_CARD_AUTO: "1"
  # no play sequence id in the game server's answers: the game refuses the player's data with
  # one ("the play data could not be read")
  WAL_APM3_GS_SEQ: "0"

input:
  gamepad:
    guide: card

controls:
  card: Aime card (take off / put back)
