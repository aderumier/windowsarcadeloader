# Otoshu DX (Sega ALLS, APM3 edition; Unity 2018 IL2CPP, 64-bit: the payload's apm.dll). Runs
# otsdx.exe; the test switch starts its test mode (-t, gametest.bat), whose exit starts the game
# again. A touch screen game: the mouse (or player 1's gun) touches.
# Override values in userprofiles/apm3/otoshu-dx.yaml.
system: apm3
name: Otoshu DX

# Unity reads the screen before the game loads its system library: the payload loaded first
# (wal-loader64, the game's apm.dll: its own load finds it loaded), the game desktop's size
# seen from the start (Unity letterboxed its 16:9 picture in a screen-sized window)
payload_loader: true
# Unity starts at the size saved in the registry (full screen window, letterboxed by Unity):
# 1920x1080, windowed (the desktop is stretched over the screen)
registry: [systemprofiles/apm3/files/otoshu-dx/screen.reg]

env:
  # a 16:9 game on a 4:3 screen (Batocera at 1600x1200: letterboxed): a 1920x1080 desktop for
  # it, its borderless window stretched over the screen (WAL_KEEP_ASPECT_RATIO "1", Batocera
  # ES's KEEP ASPECT RATIO: black bars); the window's client size in the desktop's units (the
  # payload's touches too)
  WAL_DESKTOP_SIZE: 1920x1080
  WAL_WINDOW_POPUP: "1"
  WAL_DESKTOP_STRETCH: "1"
  WAL_KEEP_ASPECT_RATIO: "0"
  WAL_DESKTOP_CLIENT: "1"
  WAL_APM3_TEST: otsdx.exe
  WAL_APM3_TEST_ARGS: "-t"
  # the touch screen: player 1's gun, its trigger the touch
  WAL_APM3_TOUCH: "1"
  # the dot where it touches (the game shows no cursor): its size in percent of the screen
  # height, its color
  WAL_CROSSHAIR: "1"
  WAL_CROSSHAIR_SIZE: "1.5"
  WAL_CROSSHAIR_COLOR: FF2020
  # ALL.Net, the Aime server and the game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  WAL_APM3_CARD_AUTO: "1"

native_map:
  b1: touch

input:
  guns_enabled: true
  stick_as_dpad: false
  gamepad:
    guide: card

controls:
  lx: Touch position (x)
  ly: Touch position (y)
  b1: Touch
  card: Aime card (take off / put back)

options:
  - title: Game
    options:
      - key: WAL_CROSSHAIR
        label: Touch pointer
        kind: bool
        description: >-
          A small red dot where the mouse or gun touches (the game shows no cursor).
