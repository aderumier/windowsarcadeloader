# Virtua Fighter 3tb Online (Sega ALLS, APM3 edition; 64-bit, Direct3D 11). Runs
# App\runtime\media\arashi.exe; its test mode is the same program (the dump's gametest.bat),
# started again by the test switch.
# Aime card: always on the reader (the game asks after START); the card input (F4, pad guide)
# takes it off. The player's data in apms/gs-<aime id>.json of the game folder (the payload's
# ABAAS game server).
# Override values in userprofiles/apm3/virtua-fighter-3tb-online.yaml.
system: apm3
name: Virtua Fighter 3tb Online

env:
  WAL_APM3_TEST: arashi.exe
  # the test program is the game started again: marked by an argument the game ignores
  WAL_APM3_TEST_ARGS: "-wal-test"
  # ALL.Net, the Aime server and the game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  WAL_APM3_CARD_AUTO: "1"
  # the dump's app.json subGameId
  WAL_APM3_GAME_ID: SDJQ

input:
  gamepad:
    guide: card

controls:
  b1: Guard
  b2: Punch
  b3: Kick
  b4: Escape
  b5: none
  b6: none
  b7: none
  b8: none
  card: Aime card (take off / put back)
