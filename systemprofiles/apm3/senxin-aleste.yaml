# Senxin Aleste (Sega ALLS, APM3 edition). Runs senxin_aleste_apm3.exe -a (the dump's game.bat);
# the test switch starts its test mode (-t, gametest.bat), whose exit starts the game again.
# Aime card: always on the reader ("use the Aime?" after START: left then button 1); the card
# input (F4, pad guide) takes it off. The player's records and settings in apms/gs-<aime id>.json
# of the game folder (the payload's ABAAS game server). Japanese only (its config.txt LANGUAGE
# is ignored).
# Override values in userprofiles/apm3/senxin-aleste.yaml.
system: apm3
name: Senxin Aleste

args: [-a]

env:
  WAL_APM3_TEST: senxin_aleste_apm3.exe
  WAL_APM3_TEST_ARGS: "-t"
  # ALL.Net, the Aime server and the game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  WAL_APM3_CARD_AUTO: "1"

input:
  gamepad:
    guide: card

controls:
  card: Aime card (take off / put back)
