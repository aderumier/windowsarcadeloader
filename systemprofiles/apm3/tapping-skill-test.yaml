# Tapping Skill Test (Sega ALLS, APM3 edition; 64-bit, Direct3D 11). Runs GL_pc.exe (the dump:
# the FJ11 update, SDFJ_FJ11_..._1_FJ10, flat: the FJ10 dump's GS3.PAR plus GS3_V10100.PAR); the
# test switch starts GL_pc_test.exe (the dump's gametest.bat), whose exit starts the game again.
# A touch screen game (tap, swipe, pinch): the mouse (or player 1's gun) touches; its window
# takes the mouse wheel as the two finger pinch (pinch_in / pinch_out: wheel notches).
# Override values in userprofiles/apm3/tapping-skill-test.yaml.
system: apm3
name: Tapping Skill Test

env:
  # a 16:9 game on a 4:3 screen (Batocera at 1600x1200: cut on the right): a 1920x1080 desktop for
  # it, its borderless window stretched over the screen (WAL_KEEP_ASPECT_RATIO "1", Batocera
  # ES's KEEP ASPECT RATIO: black bars); the window's client size in the desktop's units (the
  # payload's touches too)
  WAL_DESKTOP_SIZE: 1920x1080
  WAL_WINDOW_POPUP: "1"
  WAL_DESKTOP_STRETCH: "1"
  WAL_KEEP_ASPECT_RATIO: "0"
  WAL_DESKTOP_CLIENT: "1"
  WAL_APM3_GAME_ID: SDFJ
  WAL_APM3_TEST: GL_pc_test.exe
  # the game and its test program read the I/O board as winmm joystick 0
  WAL_APM3_JOYSTICK: "1"
  # the touch screen: player 1's gun, its trigger the touch
  WAL_APM3_TOUCH: "1"
  # the dot where it touches (the game shows no cursor): its size in percent of the screen
  # height, its color
  WAL_CROSSHAIR: "1"
  WAL_CROSSHAIR_SIZE: "1.5"
  WAL_CROSSHAIR_COLOR: FF2020
  WAL_HIDE_CURSOR: "1"
  # no ABAAS link server: the built-in link's ready flags (0x1402b9c94, 0x14209a354) never set;
  # the network status functions (0x14006c3c0 banner, 0x14006c580, 0x14006c5e0, 0x14006c630)
  # read them as set: only ALL.Net and the Aime server decide (no "Aime / versus unavailable"
  # banner)
  WAL_APM3_NO_LINK_PATCHES: "0x6c41f:41B80100000090,0x6c433:85E49090909090,0x6c595:41B90100000090,0x6c5ae:85E490909090,0x6c604:85E49090909090,0x6c60e:85E49090909090,0x6c663:85E49090909090,0x6c66d:85E49090909090"
  # ALL.Net, the Aime server and the game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  WAL_APM3_CARD_AUTO: "1"

# button 1 touches the screen, buttons 2 / 3 pinch in / out (zoom out / in)
native_map:
  b1: touch
  b2: pinch_in
  b3: pinch_out

input:
  guns_enabled: true
  # the mouse wheel zooms: up pinches out (zoom in), down pinches in (zoom out)
  gun:
    wheel_up: b3
    wheel_down: b2
  gamepad:
    guide: card

controls:
  b1: Touch
  b2: Pinch in (zoom out; mouse wheel down)
  b3: Pinch out (zoom in; mouse wheel up)
  card: Aime card (take off / put back)

options:
  - title: Game
    options:
      - key: WAL_CROSSHAIR
        label: Touch pointer
        kind: bool
        description: >-
          A small red dot where the mouse or gun touches (the game shows no cursor).
