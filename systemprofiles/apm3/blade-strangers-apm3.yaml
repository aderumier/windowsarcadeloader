# Blade Strangers (Sega ALLS, APM3 edition). Runs himekaku.exe (OpenGL; apm_x86.dll delay
# loaded). One player per cabinet (the APM3 versus mode is two linked cabinets).
# Aime card: always on the reader (the game asks after START whether to use it); the card input
# (F4, pad guide) takes it off (guest play). The player's data (name, league, records) in
# apms/gs-<aime id>.json of the game folder, the payload's ABAAS game server.
# Override values in userprofiles/apm3/blade-strangers-apm3.yaml.
system: apm3
name: Blade Strangers (APM3)

env:
  # a 16:9 OpenGL game (GLUT) on a 4:3 screen (Batocera at 1600x1200: letterboxed): a 1920x1080
  # desktop for it, its borderless window and its 1920x1080 drawing child stretched over the
  # screen (WAL_KEEP_ASPECT_RATIO "1", Batocera ES's KEEP ASPECT RATIO: black bars), their
  # client size in the desktop's units; the game's 1920x1080 viewports fitted to the window
  WAL_DESKTOP_SIZE: 1920x1080
  WAL_WINDOW_POPUP: "1"
  WAL_DESKTOP_STRETCH: "1"
  WAL_KEEP_ASPECT_RATIO: "0"
  WAL_DESKTOP_CLIENT: "1"
  WAL_GL_SIZE: 1920x1080
  WAL_D3D9_ASPECT: "16:9"
  # the test switch starts the cabinet's test program (.NET, 64-bit: the payload's apm.dll)
  WAL_APM3_TEST: gametest.exe
  # no network banner ("Aime play and national / in-store matching unavailable"; online, the
  # access code hint): the banner's switch on the network state (0x4aa3d0: 2 offline) jumps to
  # the code hiding both its texts (0x49943e)
  WAL_PATCHES: "0x9925a:E9DF01000090909090"
  WAL_PATCHES_EXE: himekaku.exe
  # ALL.Net, the Aime server and the ABAAS game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  # the card on the reader without pressing anything
  WAL_APM3_CARD_AUTO: "1"
  # no ABAAS matching server (no link): the studio logo scene waits for its connection (the je
  # at 0x4f9c24), and the network state (0x4aa3d0: 0 = card play) also needs it ready (the je
  # at 0x4aa40b, else 1: the game skips the card read)
  WAL_APM3_NO_LINK_PATCHES: "0xf9c24:9090,0xaa40b:9090"

input:
  gamepad:
    guide: card

controls:
  card: Aime card (take off / put back)
