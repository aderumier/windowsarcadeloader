# Under Night In-Birth Exe:Late[cl-r] (Sega ALLS, APM3 edition). Runs RingGame.exe; the test
# switch starts TestModeApp.exe (the dump's gametest.bat), whose exit starts the game again.
# One player per cabinet (the APM3 versus mode is two linked cabinets): player 1 against the CPU.
# Aime card: always on the reader (read at the game's "Data Certification" prompt); the card
# input (F4, pad guide) takes it off (guest play). The player's data in apms/<aime id>.dat of the
# game folder.
# Override values in userprofiles/apm3/under-night-in-birth-exe-late-cl-r.yaml.
system: apm3
name: Under Night In-Birth Exe:Late[cl-r]

# A B C D = push01 push02 push03 push05 (the 8-button layout's first two columns): b1-b4
native_map:
  b4: push05
  b5: push04

env:
  # ALL.Net and the Aime server up: Aime cards (WAL_APM3_ONLINE: "0" boots offline: no card)
  WAL_APM3_ONLINE: "1"
  # the card on the reader without pressing anything
  WAL_APM3_CARD_AUTO: "1"
  # online: the title server's setup skipped a flag never set (the cmp/je at 0x43e748): the jump
  # NOPed, the game resolves <game id>.apm.sys-all.net and uses the payload's server
  WAL_APM3_ONLINE_PATCHES: "0x3e74f:909090909090"
  # no ABAAS matching server: the boot waits 1800 frames (30 s) for the link before the attract
  # mode; 1 frame (the countdown at 0x9bc8f4, set at 0x52edb7)
  WAL_APM3_NO_LINK_PATCHES: "0x12edbd:01000000"

input:
  gamepad:
    guide: card

# Control names (the GUI's mapping rows).
controls:
  b1: A
  b2: B
  b3: C
  b4: D
  b5: none
  b6: none
  b7: none
  b8: none
  card: Aime card (take off / put back)
