# Rolling Gunner (Sega ALLS, APM3 edition; 32-bit, SDL2). Runs game01.exe; the test switch
# starts its test mode (-t, the dump's gametest.bat), whose exit starts the game again.
# Aime card: always on the reader (the game asks after START); the card input (F4, pad guide)
# takes it off. The player's data in apms/gs-<aime id>.json of the game folder (the payload's
# ABAAS game server).
# Override values in userprofiles/apm3/rolling-gunner.yaml.
system: apm3
name: Rolling Gunner

# full screen (the dump's fullscreen.bat: -f)
args: [-f]

# the game's sounds from C:\SDGW\sound (the dump's game.bat copies resource\sound there)
c_folders:
  SDGW/sound: resource/sound

env:
  # a 16:9 game on a 4:3 screen (Batocera at 1600x1200: SDL2's 1920x1080 Direct3D 9 picture
  # unscaled, cut on the right): a 1920x1080 desktop for it, its borderless window stretched over
  # the screen (WAL_KEEP_ASPECT_RATIO "1", Batocera ES's KEEP ASPECT RATIO: black bars); the
  # window's client size and points in the desktop's units (SDL2 reads its size as its client's
  # corner on the screen)
  WAL_DESKTOP_SIZE: 1920x1080
  WAL_WINDOW_POPUP: "1"
  WAL_DESKTOP_STRETCH: "1"
  WAL_KEEP_ASPECT_RATIO: "0"
  WAL_DESKTOP_CLIENT: "1"
  WAL_DESKTOP_CLIENT_POINTS: "1"
  WAL_APM3_TEST: game01.exe
  # the test mode full screen too
  WAL_APM3_TEST_ARGS: "-t -f"
  # ALL.Net, the Aime server and the game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  WAL_APM3_CARD_AUTO: "1"

input:
  gamepad:
    guide: card

controls:
  card: Aime card (take off / put back)
