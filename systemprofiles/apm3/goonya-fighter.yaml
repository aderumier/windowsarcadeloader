# Goonya Fighter (Sega ALLS, APM3 edition; Unity, 64-bit). Runs game\Goonya Fighter.exe; the test
# switch starts gametest\gametest.exe (.NET), whose exit starts the game again.
# Aime card: always on the reader (the game asks after START); the card input (F4, pad guide)
# takes it off. The player's data in apms/gs-<aime id>.json of the game folder (the payload's
# ABAAS game server).
# Override values in userprofiles/apm3/goonya-fighter.yaml.
system: apm3
name: Goonya Fighter

# the game and its test program each load the apm.dll of their folder
payload_install: [game/apm.dll, gametest/apm.dll]

env:
  WAL_APM3_TEST: ..\gametest\gametest.exe
  # ALL.Net, the Aime server and the game server up: Aime cards ("0" boots offline)
  WAL_APM3_ONLINE: "1"
  WAL_APM3_CARD_AUTO: "1"

input:
  gamepad:
    guide: card

controls:
  card: Aime card (take off / put back)
