# Mario Kart Arcade GP DX (Namco ES3, 32-bit DirectInput racing game).
system: namcoes3
name: Mario Kart Arcade GP DX

# The cabinet game's wheel and controls are DirectInput. The 32-bit bngrw replacement exposes
# the launcher input as a fake wheel and supplies the Banapass reader and memory FFB bridge.
large_address_aware: true
pre_launch: [PreprocessAmAuth.exe]
tricks: [vcrun2010, d3dx9_43, d3dx10_43]

# Separate cabinet data volumes: the game writes redundant Test Mode/settings copies
# with timestamped names and temporary files, then reloads them on the next boot.
drives:
  f: F
  g: G

env:
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: screen
  # The cabinet wheel's exact DirectInput product name: the game only enables force feedback
  # (and takes the I/O board switches) while a device by this name is present.
  WAL_DINPUT_WHEEL: "Immersion TouchSense Steering Wheel (USB HID)"
  WAL_DINPUT_WHEEL_AXIS: lx
  WAL_DINPUT_WHEEL_Y_AXIS: brake
  WAL_DINPUT_WHEEL_Z_AXIS: accel
  WAL_NAMCOES3_FFB_SPRING: "0"
  WAL_NAMCOES3_FFB_MODE: "custom"
  # The game's auto-accelerate assist (full throttle while the pedal is released): off.
  WAL_NAMCOES3_AUTO_ACCEL: "0"
  WAL_NAMCOES3_JVS_PORT: COM1,COM3
  # Banapass card server: the cabinet server (HTTPS on 192.168.112.254) is redirected here as
  # plain HTTP, and the built-in server answers a card with a fully unlocked profile.
  WAL_NAMCOES3_CARD_SERVER: "127.0.0.1:49200"
  WAL_NAMCOES3_PROFILE_SERVER: "1"
  WAL_NAMCOES3_PROFILE_NAME: "Unlocked"

# The game's own options, for the GUI's Options tab (its env variables above).
options:
  - title: Gameplay
    options:
      - key: WAL_NAMCOES3_AUTO_ACCEL
        label: Auto accelerate
        kind: bool
        description: >-
          The game's assist that drives at full throttle while the accelerator pedal is
          released ("auto accel is on!"). Off: the kart only moves with the pedal.
  - title: Banapass card
    options:
      - key: WAL_NAMCOES3_PROFILE_SERVER
        label: Unlocked profile server
        kind: bool
        description: >-
          Answer a card with a fully unlocked profile (every kart, character and course),
          from a server built into the loader. Off: the card server address below must
          point at another server.
      - key: WAL_NAMCOES3_PROFILE_NAME
        label: Player name
        kind: text
        description: The name of the unlocked profile (32 characters at most).
      - key: WAL_NAMCOES3_CARD_SERVER
        label: Card server
        kind: text
        description: >-
          host:port the game's card server requests go to, as plain HTTP (the built-in
          server listens there too).
  - title: Force feedback
    options:
      - key: WAL_NAMCOES3_FFB_MODE
        label: Effect type
        kind: choice
        choices: [real, custom]
        description: >-
          real: the game's own force feedback, passed through as is. custom: effects
          synthesized from the game state (steering, wall hits, drift, boost, surfaces,
          pickups).
      - key: WAL_NAMCOES3_FFB_STEER
        label: Steering
        kind: number
        min: 0
        max: 100
        description: The constant force while steering (custom).
      - key: WAL_NAMCOES3_FFB_SHAKE
        label: Impact
        kind: number
        min: 0
        max: 100
        description: The shake on a wall, kart or item hit (custom).
      - key: WAL_NAMCOES3_FFB_BOOST
        label: Boost
        kind: number
        min: 0
        max: 100
        description: The rumble of a nitro boost (custom).
      - key: WAL_NAMCOES3_FFB_DRIFT
        label: Drift
        kind: number
        min: 0
        max: 100
        description: The rumble while drifting (custom).
      - key: WAL_NAMCOES3_FFB_TERRAIN
        label: Surface
        kind: number
        min: 0
        max: 100
        description: The rumble of the ground (dirt, grass, sand, water, ...) (custom).
      - key: WAL_NAMCOES3_FFB_PICKUP
        label: Pickup
        kind: number
        min: 0
        max: 100
        description: The blip of a coin, a weapon or a landing (custom).
      - key: WAL_NAMCOES3_FFB_SPRING
        label: Wheel spring
        kind: number
        min: 0
        max: 10000
        description: The wheel's centering force.
  - title: Debug
    options:
      - key: WAL_NAMCOES3_FFB_TRACE
        label: Trace the force feedback
        kind: bool
        description: Log every force feedback state change to the game log.

input:
  stick_as_dpad: false
  # Keyboard steering and pedals reach full travel in half a second.
  keyboard_ramp_ms: 500
  gamepad:
    x: b1
    a: b2
    l2: brake
    y: b5
    r2: accel
    leftx: lx
    start: start
    back: coin
    l3: service
    r3: test
    guide: card
    dpup: b7
    dpdown: b8
  keyboard:
    p1:
      KEY_LEFT: -lx
      KEY_RIGHT: lx
      KEY_UP: accel
      KEY_DOWN: brake
      KEY_LEFTCTRL: b1
      KEY_LEFTALT: b2
      KEY_ENTER: b4
      KEY_SPACE: b5
      KEY_Z: b7
      KEY_X: b8
      KEY_1: start
      KEY_5: coin
      KEY_F1: service
      KEY_F2: test
      KEY_F4: card

controls:
  lx: Steering wheel
  accel: Gas pedal
  brake: Brake pedal
  b1: Enter switch
  b2: Mario button
  b3: Brake
  b5: Item
  b7: Menu up
  b8: Menu down
  start: Start
  coin: Coin
  service: Service
  test: Test
  card: Banapass card
