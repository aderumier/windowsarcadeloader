# Crazy Ride (UNIS, Unreal Engine 4.19, 64-bit, CrazyTaxiGame 1.9) - template, override values
# in userprofiles/unis/crazy-ride.yaml.
# One driving cabinet. The payload answers the game's UsbPluginsDll_R.dll (the I/O board:
# pedals, buttons, operator's buttons; the wheel; the coins; the dongle) (docs §6.3j).
# Free play: the game's own pay setting (the dump's Setting_Pay.ini), operator menu.
system: unis
name: Crazy Ride

dll_overrides:
  # the game imports xinput1_3.dll: the payload
  xinput1_3: "n,b"

# The operator menu's input calibration: the payload's wheel (255 left .. 1 right, 128 the
# centre) and pedals (1..255), CRLF lines (the game's ini parser)
files:
  Setting_Test_Input.ini: systemprofiles/unis/files/crazy-ride/Setting_Test_Input.ini
  Setting_Test_Input_Backups.ini: systemprofiles/unis/files/crazy-ride/Setting_Test_Input.ini
  # one screen: the cabinet's second one (the 600x800 touch screen's ranking list, right of
  # the main picture in a 2520x1080 window) off, the game's picture 16:9 (the dump's file,
  # bEnableSplitscreen=false, its comments dropped)
  SysStart/Game/CrazyCab/CrazyTaxiGame/Config/DefaultManage_Menu.ini: systemprofiles/unis/files/crazy-ride/DefaultManage_Menu.ini

env:
  WAL_UNIS_BOARD: usbplugins
  # full screen: the game sizes its 16:9 picture from the screen's height (on a 1920x1200
  # screen 2133x1200, its right cut off): a 1920x1080 desktop for it, its borderless window
  # fitted onto the real screen (aspect kept)
  WAL_DESKTOP_SIZE: 1920x1080
  WAL_WINDOW_POPUP: "1"

input:
  stick_as_dpad: false
  # the keyboard: the arrows steer (left / right) and drive (up the gas, down the brake),
  # pushed progressively
  keyboard_ramp_ms: 500
  keyboard:
    p1:
      KEY_LEFT: -lx
      KEY_RIGHT: lx
      KEY_UP: accel
      KEY_DOWN: brake

controls:
  lx: Steering
  accel: Gas
  brake: Brake
  start: Start (in a race, the nitro)
  b1: Nitro (start)
  coin: Coin
  test: Operator menu (open, move up)
  down: Menu down
  service: Menu enter
