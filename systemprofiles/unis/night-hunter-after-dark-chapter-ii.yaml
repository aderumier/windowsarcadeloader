# Night Hunter: After Dark Chapter II (UNIS "qumo" guns, Unity 5.5, Mono, 64-bit) - template,
# override values in userprofiles/unis/night-hunter-after-dark-chapter-ii.yaml.
# Two guns. The payload emulates the cabinet's USB HID board (guns, triggers, big buttons,
# coins, the operator's buttons) and its dongle (docs §6.3j).
system: unis
name: "Night Hunter: After Dark Chapter II"

dll_overrides:
  # Unity 5.5 loads xinput1_3.dll at start: the payload
  xinput1_3: "n,b"
  # a mod loader in some dumps (winhttp.dll, BepInEx): Wine's own, the game unmodified
  winhttp: "b"

# The guns' calibration: the payload's aim is the picture's 0..4095, unchanged (the dump's is
# a cabinet's guns')
files:
  Assets/config/game/excel_data/jiaoqiang.csv: systemprofiles/unis/files/night-hunter-after-dark-chapter-ii/jiaoqiang.csv

env:
  WAL_UNIS_BOARD: qumo
  # the game draws its own gun marks
  WAL_CROSSHAIR: "0"
  # free play (the operator menu's setting, set at each start); "0": coins
  WAL_UNIS_FREEPLAY: "1"

options:
  - title: Game
    options:
      - key: WAL_UNIS_FREEPLAY
        label: Free play
        kind: bool
        description: >-
          Free play: the trigger starts a game. Off: coins buy credits (the operator
          menu's coin settings).

input:
  # each player's gun (or mouse) aims, its trigger shoots
  guns_enabled: true
  stick_as_dpad: false

controls:
  lx: Gun aim (x)
  ly: Gun aim (y)
  b1: Trigger
  start: Start (trigger)
  b2: Big button
  b3: Change weapon
  coin: Coin
  test: Operator menu
  service: Menu select
  down: Menu move
  up: Menu move
