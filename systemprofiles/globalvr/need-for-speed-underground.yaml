# Need for Speed Underground (Global VR) - template, override values in
# userprofiles/globalvr/need-for-speed-underground.yaml.
# The cabinet frontend GvrRoot\UniverShell2.exe (a .NET 1.1 program: attract, coins, car and
# track choice, career) starts the game, C:\Underground\UndergroundGVR.exe, for each race. Both
# read the cabinet database through PLUSDE.dll (SQL Server on the cabinet): the dump has the
# SQLite version of NFSU_GVR_Portable in its place (PLUSDE.dll, GvrSqlite.dll, sqlite3.dll next
# to both programs and in GvrPlus\1\lib, the original kept as PLUSDE.dll.sqlserver; the seeded
# game.db, its fonts and the frontend's debug C runtimes, in NFSU_GVR_SQLite and GvrRoot).
# Both import GVRInputRaw.dll, the cabinet's wheel, pedals and buttons: the payload takes its
# place (payload gvrinput.rs, the same state as Need for Speed GT).
system: globalvr
name: Need for Speed Underground

# Its prefix: .NET 1.1 (CLR 1.1, the mixed-mode PLUSDE.dll fails on Mono and CLR 2), shared with
# Need for Speed Carbon: unpacked from wine-prefix/dotnet11.tar.gz, else installed by the
# launcher's dotnet11 verb (winetricks' installs nothing in a 64-bit prefix): netfx.msi without
# its 64-bit launch condition, the assembly cache filled; native mscoree, mscorwks, fusion.
prefix: wine-prefix/dotnet11
prefix_tricks: [dotnet11]

payload_install: [GvrRoot/GVRInputRaw.dll, UndergroundGVR/GVRInputRaw.dll]

dll_overrides:
  mscoree: n
  mscorwks: n
  fusion: n
  # the native C++ runtime of the mixed-mode .NET code (Wine's has no __CxxCallUnwindDtor),
  # in the dump next to both programs
  msvcr71: n,b
  msvcp71: n,b

# the cabinet's folders, by absolute path in its data and registry
c_folders:
  gvrroot: GvrRoot
  gvr: gvr
  Underground: UndergroundGVR
  GvrPlus: GvrPlus

# The cabinet's registry: database schema and key paths, the frontend's game entry.
registry: [systemprofiles/globalvr/files/need-for-speed-underground/cabinet.reg]

# The cabinet's fonts (the frontend's menus), from NFSU_GVR_Portable too.
fonts:
  - NFSU_GVR_SQLite/Fonts/GVR_NFSU.TTF
  - NFSU_GVR_SQLite/Fonts/GVR_digital.ttf
  - NFSU_GVR_SQLite/Fonts/ETHNOCEN.TTF
  - NFSU_GVR_SQLite/Fonts/DIGITALDREAMNARROW.ttf

# The database (C:\GvrPlus\game.db), kept in the dump: leaderboards, career.
initial_files:
  GvrPlus/game.db: "{dump}/NFSU_GVR_SQLite/game.db"

# The dump's ArcadeConfig mod (an ASI loader as dinput8.dll) runs the game without the
# frontend: off, the game runs as on the cabinet.
hide: [dinput8.dll]

env:
  # the game's own controllers off: the wheel, pedals and buttons come from GVRInputRaw.dll
  WAL_DINPUT_DISABLE: "1"
  # The frontend and the race draw 800x600: a borderless screen-sized window the back buffer is
  # stretched to, presented to a centered 4:3 rectangle (black bars); WAL_KEEP_ASPECT_RATIO "0"
  # (Batocera ES: KEEP ASPECT RATIO off): the whole screen.
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: screen
  WAL_D3D9_ASPECT: "4:3"
  WAL_D3D9_WINDOWED_SIZE: 800x600
  WAL_KEEP_ASPECT_RATIO: "1"

input:
  # the wheel must not press the d-pad
  stick_as_dpad: false
  # Left stick wheel, R2 gas, L2 brake, L1 / R1 shift down / up, X view, Y music, B nitrous,
  # A e-brake, d-pad down look back.
  gamepad:
    r2: accel
    l2: brake
    l1: b5
    r1: b6
    a: b7
    b: b3
    dpdown: b4
  # keyboard steering, gas and brake: full in 0.5 s
  keyboard_ramp_ms: 500
  # Keyboard (player 1): Left / Right wheel, Up gas, Down brake, Ctrl view, Alt music, Space
  # nitrous, Left Shift look back, Z / X shift down / up (W / X on AZERTY), C handbrake, 1 start,
  # 5 coin, F2 operator menu.
  keyboard:
    p1:
      KEY_LEFT: -lx
      KEY_RIGHT: lx
      KEY_UP: accel
      KEY_DOWN: brake

# Control names (the GUI's mapping rows).
controls:
  up: none
  down: none
  left: none
  right: none
  lx: Wheel
  accel: Gas
  brake: Brake
  b1: View
  b2: Music
  b3: Nitrous
  b4: Look back
  b5: Shift down
  b6: Shift up
  b7: E-brake
  b8: none
