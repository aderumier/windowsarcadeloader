[ArcadeConfig]
NoSQL = 1					// Disables usage of SQL server. This is MANDATORY! (on machines without a set up SQL server for GVR)
NoGVRInput = 0              // Disables usage of GlobalVR input methods. You need this in order to use your keyboard/gamepad.
ForceWindowed = 0
ScreenPrintf = 0            // Shows framerate and many other things. Very useful (the only known PC build with this!)
SkipFE = 0                  // Skips frontend. Function designed for quick testing. Enabled by default in arcade (for a good reason). To go to frontend, copy your FRONTEND folder from Underground.
DemoShellMode = 1           // Enabling this disables SkipFE. Current function is unknown.
GVRTournament = 0
Career = 0                  // Career mode bool. Use GLOBAL\career for global chunks. Contains stock, unmodified chunks from regular UG.
CareerCheat = 0
HardWalls = 0               // Changes wall collision behavior. Car will turn away from the wall to reduce a chance of getting stuck.
ResetDebug = 0
ShowDist = 0
DebugCameras = 0			// Enables debug cameras. Use right at the start. Inputs are buggy in this version. Otherwise same as regular UG. Enabled by default.
AttachConsole = 0           // Hooks a console for prints. Currently force-enabling printing crashes the game. Useful for quitting the game as it has no borders. Enabled by default.
ResultsTime = 0
Screenshot = 0              // Enables screenshot functionality. Currently NOT working.
NoSound = 0
NoMusic = 0
QuitEarly = 0
ShowCatchup = 0
PauseWorld = 0

[TrackSettings]
SkipFENumLaps = 4
SkipFETrackDirection = 1
Traffic = 3                 // Controls traffic density level. (0 = disabled, 1 to 3 levels)
SkipFENumAICars = 7         // Up to 7 AI cars! Exclusive for Arcade version!
AIDifficulty = 0
SkipFETrackNumber = 1002	    // Track number. Check GlobalB in a hex editor for a complete list or check TRACKS folder. Defaults to 1001 (Market Street). (0 = Default)
Trans = 0                   // 1 = Manual (GVR 6-gear shifter only), 0 = Automatic
MusicTrack = 14				// There are some repeated tracks so beware of that.
RandomMusicTrack = 0        // Enables a music shuffler.
ShortCheckpoint = 0         // Decreases checkpoint time.
DragPilot = 0
Gain = 0
Car = 0                     // Doesn't work. Seems to load stuff from the SQL database. You can only drive the white Honda Civic for now.
CarUpgrade = 0
CatchUp = 0

[GameplaySettings]
StabilityControl = 0        // Enables/disables traction control.
NoJumpCam = 0               // Doesn't work at all. GlobalVR screwed up on this one.
NoAbort = 1                 // Disables auto reset on full stop or wrong way. Recommended as it is VERY annoying. Enabled by default.
NoTimeout = 0               // Disables the arcade timer timeout.
NoBlur = 0                  // Motion blur disabler.
NoHUD = 0                   // Does not entirely disable it.
GiveMeNOS = 0               // Infinite NOS cheat
CameraStiffness = 0.0       // Unknown effect. The camera is very stiff regardless.
NumDrags = 0
