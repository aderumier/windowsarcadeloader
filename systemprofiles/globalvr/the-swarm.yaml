# The Swarm (Global VR) - template, override values in userprofiles/globalvr/the-swarm.yaml.
# The dump is a PC port of the cabinet game: the_swarm_controls.exe (patched, .pcfix
# sections) normally started by its .NET adapter (Swarm PC Fix/SwarmInput.exe), which
# passes the arguments below and feeds the guns through Local\SwarmPcInputV1. The payload
# is that adapter (payload swarm.rs): b1 fire, b2 grenade, b3 shield, start.
system: globalvr
name: The Swarm

args: ["-windowed", "-width", "1920", "-height", "1080", "-logFull"]

env:
  WAL_GLOBALVR_SWARM: "1"

input:
  # lightguns first, then mice
  guns_enabled: true
  # the gun position must not press the d-pad
  stick_as_dpad: false

# Control names (the GUI's mapping rows).
controls:
  up: none
  down: none
  left: none
  right: none
  b1: Fire
  b2: Grenade
  b3: Shield
