# SiN (Global VR) - template, override values in userprofiles/globalvr/sin.yaml.
# Global VR's virtual reality pod version of Ritual's SiN (2002, Quake II engine): the player
# stands in the pod, a head-mounted display and its tracker aim and turn, the gun fires and
# walks. The dump: the cabinet's install disc (SIN.iso, its WinZip installer unpacked) at the
# cabinet's paths, C:\orion (the frontend and the game in C:\orion\sin, the configuration
# orion.cfg) and its system files (System Files: the operator setup's Visual Basic runtime).
# The frontend test.exe (attract, credits, character selection, high scores) starts the game,
# sin.exe, for each play. Both read the pod through ogsdll.dll: the payload replaces its
# hardware (payload sin.rs).
system: globalvr
name: SiN

# The frontend runs with the payload (it hooks the pod library, the dongle check and the game
# start).
payload_loader: true

# the cabinet's folder (configuration, bookkeeping)
c_folders:
  orion: orion

# No gamescope. The frontend's 640x480 screen (DirectDraw): Wine's display mode emulation scales
# it, its aspect kept. The game (Quake II's engine, OpenGL, 640x480 from its renderer loaded at
# the game's start) gets no mode change, a borderless window of the screen's centered 4:3
# rectangle, black around, and its 640x480 picture scaled into it (payload glview.rs).
env:
  WAL_EXE_ENV: "sin.exe: WAL_NO_MODE_CHANGE=1, WAL_WINDOW_POPUP=1, WAL_WINDOW_SIZE=aspect, WAL_D3D9_ASPECT=4:3, WAL_GL_CORNER=640x480, WAL_BEZEL=black"

input:
  # Keyboard (player 1): left / right turn, up / down walk forward / back, Ctrl fire (and
  # start), Alt use, Space jump, 5 coin.
  keyboard:
    p1:
      KEY_LEFT: -lx
      KEY_RIGHT: lx
      KEY_PAGEUP: -ry
      KEY_PAGEDOWN: ry

# Control names (the GUI's mapping rows).
controls:
  up: Walk forward
  down: Walk back
  left: none
  right: none
  lx: Turn
  rx: Turn
  ry: Look up / down
  b1: Fire
  b2: Use
  b3: Jump
  b4: none
  b5: none
  b6: none
  b7: none
  b8: none
  service: none
