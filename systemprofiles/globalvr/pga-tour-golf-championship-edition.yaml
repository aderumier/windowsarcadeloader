# PGA TOUR Golf Championship Edition (Global VR, 1.2) - template, override values in
# userprofiles/globalvr/pga-tour-golf-championship-edition.yaml.
# The dump: the game's install CDs (pga tour v1.2 disc 1 and 2) at the cabinet's paths (the game
# in C:\Program Files\EA SPORTS\Tiger Woods PGA TOUR 2002), their _Registry, fonts (Fonts) and
# system files (System Files) kept. The first Championship Edition: the UniverShell frontend
# (Internet Explorer showing the shell's HTML pages, scripted through its ShellControl.ocx)
# starts the game, TW2002.exe, for each play; no cabinet database yet (Championship Edition II
# and III's .NET classes).
system: globalvr
name: PGA TOUR Golf Championship Edition

# the shell's start page
args: ["c:\\TW2002_Shell\\Shell\\EABrand\\EABrand.html"]

# The frontend runs with the payload (it hooks its pages and the game start); the payload is also
# the trackball board library of the shell control and of the game's engine.
payload_loader: true
payload_install:
  - GVRInputRaw.dll
  - Orion/UsbTrackerDll.dll
  - Program Files/EA SPORTS/Tiger Woods PGA TOUR 2002/Bin/UsbTrackerDll.dll

# The cabinet's paths.
c_folders:
  Orion: Orion
  TW2002_Shell: TW2002_Shell
  Tournament: Tournament
  Program Files/EA SPORTS: Program Files/EA SPORTS

registry: [systemprofiles/globalvr/files/pga-tour-golf-championship-edition/cabinet.reg]

# The cabinet's Windows\system files the frontend loads. Its movies are Indeo 5: the native
# codec (ir50_32.dll, copied to the dump's System Files, from Beach Head's) next to the frontend.
files:
  Orion/msdxm.ocx: "{dump}/System Files/msdxm.ocx"
  Orion/ir50_32.dll: "{dump}/System Files/ir50_32.dll"

dll_overrides:
  ir50_32: n

# The game's MFC 4.2 library (the cabinet's Windows has it).
tricks: [mfc42]

fonts:
  - Fonts/AUOC____.TTF
  - Fonts/TT1027M_.TTF
  - Fonts/TT1028M_.TTF
  - Fonts/WINGDNG3.TTF

graphics: wine

# The cabinet's 800x600 screen, scaled to the real one with its aspect kept.
gamescope:
  enabled: true
  width: 800
  height: 600
  args: [-S, fit, -f]

input:
  # the stick rolls the trackball, it must not press the d-pad
  stick_as_dpad: false
  # The mouse is the trackball: its position wraps (the trackball's counters) on the right
  # stick axes, the gamepad's right stick left out of them.
  guns_enabled: true
  guns_mice: 1
  mouse_screen: [65536, 65536]
  mouse_wrap: true
  gun:
    x: rx
    y: ry
    BTN_LEFT: b1
    BTN_RIGHT: b2
    BTN_MIDDLE: none
  gamepad:
    rightx: none
    righty: none
  # Keyboard (player 1): arrows roll the trackball (the swing: down then up), 1 start,
  # F2 operator menu. Mouse: the swing is the mouse pulled back, then pushed forward.
  keyboard:
    p1:
      KEY_LEFT: -lx
      KEY_RIGHT: lx
      KEY_UP: -ly
      KEY_DOWN: ly

# Control names (the GUI's mapping rows).
controls:
  up: none
  down: none
  left: none
  right: none
  lx: Trackball left / right
  ly: Trackball swing (back / forward)
  rx: none
  ry: none
