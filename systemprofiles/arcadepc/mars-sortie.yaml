# Mars Sortie (MRCQ "TJZS", Shooter.exe, Unity 5.4, Mono, 64-bit) - template, override values in
# userprofiles/arcadepc/mars-sortie.yaml.
# Four guns. The payload is the cabinet's hardware: its laser camera guns and GMB board's
# signals fed into the game, the absent board's errors and the SuperDog dongle check skipped,
# the game's own keys posted (WAL_ARCADEPC_BOARD=marssortie, docs §6.3i); the dump's BepInEx
# plugin is not loaded.
system: arcadepc
name: Mars Sortie

# Unity's own log beside the game; its 16:10 picture (the cabinet's 1280x800) at 1680x1050,
# black bars around it on another screen shape
args: [-logFile, Player.log, -screen-width, "1680", -screen-height, "1050", -screen-fullscreen, "1"]

# the game's records (credits, accounting, the price: coins per game) made in the game's run
# folder, not written into the dump's (the dump's are a cabinet's)
hide: [GameRecords1.dat, GameRecords2.dat]

dll_overrides:
  # Unity tries xinput1_3.dll: the payload
  xinput1_3: "n,b"
  # Wine's winhttp: the dump's Unity Doorstop (its BepInEx plugin) not loaded
  winhttp: "b"

env:
  # the guns and the stations' buttons, free play (the price's getters made 0), the crosshairs
  # (WAL_CROSSHAIR: the playing stations'), the operator menus' keypad keys; the players' photos
  # the game's (its webcam when present)
  WAL_ARCADEPC_BOARD: marssortie
  # the guns aim over Unity's picture (the resolution of args), centered in its window
  WAL_DEMUL_RESOLUTION: 1680x1050
  # each station's own keys (the game's: coin 1..4, fire a s d f, start / weapon switch q w e r)
  WAL_DEMUL_KEYS_P2: "key_1=key_2,key_a=key_s,key_q=key_w"
  WAL_DEMUL_KEYS_P3: "key_1=key_3,key_a=key_d,key_q=key_e"
  WAL_DEMUL_KEYS_P4: "key_1=key_4,key_a=key_f,key_q=key_r"
  # the game's own crosshairs ("Display hair cross"): the common crosshair option's default
  WAL_CROSSHAIR: "1"

input:
  # each gun (or mouse) aims, its trigger shoots
  guns_enabled: true
  stick_as_dpad: false

# The game's keys (its board signals' keyboard keys, player 1's; the others' above): the trigger
# fires (a), a station's shot starts it (start is that shot too: q, its start signal's key, is
# also the weapon switch, which does not start), the change button switches the weapon (q), 1
# coin; space OK (in the attract: the operator menu), the arrows (the operator menus).
native_map:
  b1: key_a
  b2: key_q
  start: key_a
  coin: key_1
  test: key_space
  service: key_space
  up: key_up
  down: key_down
  left: key_left
  right: key_right

options:
  - title: Game
    options:
      - key: WAL_FREEPLAY
        label: Free play
        kind: bool
        description: >-
          Games start without coins. Off: the settings menu's price (2 coins a game by default).

controls:
  lx: Gun aim (x)
  ly: Gun aim (y)
  b1: Trigger
  b2: Change weapon
  start: Start (a shot)
  coin: Coin
  test: Operator menu / OK
  service: OK
  up: Menu up
  down: Menu down
  left: Menu left / decrease
  right: Menu right / increase
