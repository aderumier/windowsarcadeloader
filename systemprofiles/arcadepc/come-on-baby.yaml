# Come on Baby! (ExtraLine, 2000, COBDEMO.exe, Glide 2, 32-bit) - template, override values in
# userprofiles/arcadepc/come-on-baby.yaml.
# A party game of mini-games: two players, a stick, two buttons and a start button each. The
# payload is the cabinet's parallel port board (docs §6.3i). Glide on the dump's dgVoodoo 2.53.
system: arcadepc
name: Come on Baby!

# loaded at the executable's entry point (the game imports no DLL of ours)
payload_loader: true
dll_overrides:
  xinput1_3: "n,b"

env:
  WAL_ARCADEPC_BOARD: comeonbaby
  # The boot's protection (0x412790: c:\windows\win386p.swp against C:'s volume serial
  # number) returns 1 (xor eax, eax; inc eax; ret). The window's WM_MOVE (0x4121b3) closed
  # the game when Glide's grSstControl(move) returned 0 (dgVoodoo): never closes (jmp).
  WAL_PATCHES: "0x12790:31C040C3,0x121BC:EB"
  # The dump's dgVoodoo 2.53 (Direct3D 11, windowed: its own 640x480 window at 0,0) keeps its
  # window; its user32 calls are resolved by its unpacker (MPRESS): the payload replaces its
  # SetWindowPos, the window kept at the screen's centered 4:3 rectangle (created there,
  # borderless), its picture stretched into it, no display mode change, black around.
  WAL_ARCADEPC_GLIDE_WINDOW: "0"
  WAL_PACKED_IMPORTS: user32.dll
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: aspect
  WAL_D3D9_ASPECT: "4:3"
  WAL_NO_MODE_CHANGE: "1"
  WAL_BEZEL: black
  # GNOME's top bar pushed the full-height window down
  WAL_DESKTOP_UNMANAGED: "1"
  WAL_HIDE_CURSOR: "1"

options:
  - title: Game
    options:
      - key: WAL_FREEPLAY
        label: Free play
        kind: bool
        description: >-
          Games start without coins. Off: one coin per credit (to start and to continue).

controls:
  up: Up
  down: Down
  left: Left
  right: Right
  b1: Button A
  b2: Button B
  start: Start
  coin: Coin
  service: Service (credit)
  test: Test menu
