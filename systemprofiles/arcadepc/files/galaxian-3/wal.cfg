<?xml version="1.0"?>
<!-- The payload's devices (mame.rs): gun n = player n, its buttons 1-4 trigger 1, trigger 2, start, coin; the keyboard for the operator keys. -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_LIGHTGUN_X"><newseq type="standard">GUNCODE_1_XAXIS</newseq></port>
            <port type="P1_LIGHTGUN_Y"><newseq type="standard">GUNCODE_1_YAXIS</newseq></port>
            <port type="P1_BUTTON1"><newseq type="standard">GUNCODE_1_BUTTON1</newseq></port>
            <port type="P1_BUTTON2"><newseq type="standard">GUNCODE_1_BUTTON2</newseq></port>
            <port type="COIN1"><newseq type="standard">GUNCODE_1_BUTTON4</newseq></port>
            <port type="P2_LIGHTGUN_X"><newseq type="standard">GUNCODE_2_XAXIS</newseq></port>
            <port type="P2_LIGHTGUN_Y"><newseq type="standard">GUNCODE_2_YAXIS</newseq></port>
            <port type="P2_BUTTON1"><newseq type="standard">GUNCODE_2_BUTTON1</newseq></port>
            <port type="P2_BUTTON2"><newseq type="standard">GUNCODE_2_BUTTON2</newseq></port>
            <port type="COIN2"><newseq type="standard">GUNCODE_2_BUTTON4</newseq></port>
            <port type="P3_LIGHTGUN_X"><newseq type="standard">GUNCODE_3_XAXIS</newseq></port>
            <port type="P3_LIGHTGUN_Y"><newseq type="standard">GUNCODE_3_YAXIS</newseq></port>
            <port type="P3_BUTTON1"><newseq type="standard">GUNCODE_3_BUTTON1</newseq></port>
            <port type="P3_BUTTON2"><newseq type="standard">GUNCODE_3_BUTTON2</newseq></port>
            <port type="COIN3"><newseq type="standard">GUNCODE_3_BUTTON4</newseq></port>
            <port type="P4_LIGHTGUN_X"><newseq type="standard">GUNCODE_4_XAXIS</newseq></port>
            <port type="P4_LIGHTGUN_Y"><newseq type="standard">GUNCODE_4_YAXIS</newseq></port>
            <port type="P4_BUTTON1"><newseq type="standard">GUNCODE_4_BUTTON1</newseq></port>
            <port type="P4_BUTTON2"><newseq type="standard">GUNCODE_4_BUTTON2</newseq></port>
            <port type="COIN4"><newseq type="standard">GUNCODE_4_BUTTON4</newseq></port>
            <port type="P5_LIGHTGUN_X"><newseq type="standard">NONE</newseq></port>
            <port type="P5_LIGHTGUN_Y"><newseq type="standard">NONE</newseq></port>
            <port type="P5_BUTTON1"><newseq type="standard">NONE</newseq></port>
            <port type="P5_BUTTON2"><newseq type="standard">NONE</newseq></port>
            <port type="COIN5"><newseq type="standard">NONE</newseq></port>
            <port type="P6_LIGHTGUN_X"><newseq type="standard">NONE</newseq></port>
            <port type="P6_LIGHTGUN_Y"><newseq type="standard">NONE</newseq></port>
            <port type="P6_BUTTON1"><newseq type="standard">NONE</newseq></port>
            <port type="P6_BUTTON2"><newseq type="standard">NONE</newseq></port>
            <port type="COIN6"><newseq type="standard">NONE</newseq></port>
            <!-- Galaxian 3's attendant start: any player's start -->
            <port type="START1"><newseq type="standard">GUNCODE_1_BUTTON3 OR GUNCODE_2_BUTTON3 OR GUNCODE_3_BUTTON3 OR GUNCODE_4_BUTTON3</newseq></port>
            <!-- Galaxian 3's test menu (its default, 5, is coin 1's key too) -->
            <port type="P1_SELECT"><newseq type="standard">KEYCODE_F2</newseq></port>
        </input>
    </system>
</mameconfig>
