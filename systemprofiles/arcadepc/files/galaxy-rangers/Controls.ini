; Galaxy Rangers controls (the dump's community ArcadeControls), for the arcadepc payload:
; every player aims with its XInput pad (xinput1_3.dll = the payload, the guns' absolute
; position on the left stick), the keyboard and mice are filtered.
[Game]
Players=4
RequireStart=1
Width=1920
Height=1080
Fullscreen=1

[Keyboard]
