; VCThunder 0.5's settings for windowsarcadeloader (Hydro Thunder, Offroad Thunder; every key:
; the runtime's docs/configuration.md). The payload rewrites [graphics] aspect / widescreen /
; frame_rate and [controls] dip_switches from the profile's options at each start.
[paths]
data_dir = .
save_dir = save

[graphics]
vcglide_renderer = auto
fullscreen = true
window_scale = auto
render_scale = 1
raster_height = 400
video_mode = auto
aspect = 4:3
widescreen = false
frame_rate = 30
vsync = auto

[audio]
audio = true
volume = 100
output = mix
balance = 15

[controls]
dip_switches = 0xFF
input_background = true

; the payload's DirectInput wheel: X steering, Y gas, Z brake (released at the range's low end)
[analog]
provider = dinput
deadzone_percent = 0
pov_digital = false
dinput_deadzone_percent = 0
dinput_steering_axis = x
dinput_throttle_axis = y
dinput_brake_axis = z
dinput_pedal_mode = separate
dinput_steering_invert = false
dinput_throttle_invert = false
dinput_brake_invert = false
dinput_steering_range_percent = 100

[ffb]
enabled = true
direction = normal
strength_percent = 100
autocenter = false
rumble = false

; no keyboard but the second coin slot and Offroad's gears (the payload's latch: it starts in
; first gear, the runtime's shift_up / shift_down latch in neutral)
[digital]
coin1 = NONE
coin2 = 6
start1 = NONE
service1 = NONE
service_mode = NONE
steer_left = NONE
steer_right = NONE
throttle = NONE
brake = NONE
boost = NONE
view_high = NONE
view_low = NONE
view_pilot = NONE
volume_down = NONE
volume_up = NONE
shift1 = E
shift2 = F
shift3 = G

; the payload's wheel buttons (WAL_DINPUT_WHEEL_BUTTONS, numbered from 1): b1 b2 b3 b4 b6 b5
; coin start service test up down b7 b8 (b5 / b6: Offroad's shift up / down, the payload's)
[gamepad]
boost = 1
view_high = 2
view_low = 3
view_pilot = 4
shift_down = 0
shift_up = 0
menu_prev = 5
menu_next = 6
coin1 = 7
coin2 = 0
start1 = 8
service1 = 9
service_mode = 10
volume_up = 11
volume_down = 12
shift1 = 0
shift2 = 0
shift3 = 0

[link]
link = off

[diagnostics]
log_file = vcthunder.log
log_level = info
