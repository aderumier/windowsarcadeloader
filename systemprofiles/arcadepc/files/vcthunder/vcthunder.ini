; VCThunder's settings for windowsarcadeloader (Hydro Thunder, Offroad Thunder): the payload
; rewrites the [graphics] aspect / widescreen and [controls] dip_switches keys from the
; profile's options at each start.
[graphics]
vcglide_renderer = gpu
vcglide_threads = 0
fullscreen = true
window_scale = 1
render_scale = 1
aspect = 4:3
widescreen = false
raster_height = 400
video_mode = auto
vcglide_log = vcglide.log
vcglide_verbose = false
glide_capture =
glide_capture_frames = 60
glide_frames =

[audio]
audio = true
volume = 100
output = mix
balance = 15
dcs_ms = 5

; the payload's DirectInput wheel: X steering, Y gas, Z brake (0 released .. full)
[analog]
provider = dinput
deadzone_percent = 0
pov_digital = false
dinput_device = auto
dinput_name =
dinput_deadzone_percent = 0
dinput_steering_axis = x
dinput_throttle_axis = y
dinput_brake_axis = z
dinput_pedal_mode = separate
dinput_steering_invert = false
dinput_throttle_invert = false
dinput_brake_invert = false
dinput_steering_range_percent = 100

[ffb]
enabled = true
invert = false
strength_percent = 100
device_gain_percent = 100
autocenter = false

[timing]
cpu_hz = 333000000
speed_percent = 100

[controls]
dip_switches = 0xFF
io_ms = 16
input_background = true

; the keys the payload reports down from the virtual sticks (GetAsyncKeyState)
[digital]
coin1 = 0x35
coin2 = 0x36
start1 = 0x31
service1 = 0x39
service_mode = F2
steer_left = NONE
steer_right = NONE
throttle = NONE
brake = NONE
boost = 0x41
view_high = 0x42
view_low = 0x43
view_pilot = 0x44
volume_down = 0x4A
volume_up = 0x4B
shift1 = 0x45
shift2 = 0x46
shift3 = 0x47
shift_up = NONE
shift_down = NONE

; no DirectInput button: the wheel's buttons are not read
[gamepad]
coin1 = 0
coin2 = 0
start1 = 0
service1 = 0
service_mode = 0
boost = 0
view_high = 0
view_low = 0
view_pilot = 0
volume_down = 0
volume_up = 0
shift1 = 0
shift2 = 0
shift3 = 0
shift_up = 0
shift_down = 0

[link]
link = off
link_rx_budget = 64

[paths]
data_dir = .
save_dir = save

[diagnostics]
log_file = vcthunder.log
log_level = info
r2_cache = true
stall_ms = 60
