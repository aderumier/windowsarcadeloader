# Wild West Shoot Out (CowBoy.exe, Unity 5.6, Mono, 32-bit) - template, override values in
# userprofiles/arcadepc/wild-west-shoot-out.yaml.
# Two guns. The payload is the cabinet's hardware: its COM1 I/O board (triggers, coins, test,
# select) emulated, its camera guns and dongle check stubbed, the guns written into the game's
# camera data (WAL_ARCADEPC_BOARD=wws, docs §6.3i); the dump's BepInEx plugin is not loaded.
system: arcadepc
name: Wild West Shoot Out

# Unity's own log beside the game; the cabinet's 16:9 picture at 1920x1080 full screen (its
# default: 1024x768; its attract frame and intros' black bars are laid out for 16:9, at 4:3 the
# 3D scene showed around them)
args: [-logFile, Player.log, -screen-width, "1920", -screen-height, "1080", -screen-fullscreen, "1"]

# the game's settings (installed at each start: changes in its settings menu last until the next
# launch): the dump's (English, 3 coins a game, difficulty 3), the credits counted from zero;
# free play from the common option (WAL_FREEPLAY, below)
files:
  GameConfig.xml: systemprofiles/arcadepc/files/wild-west-shoot-out/GameConfig.xml
  GameCount.xml: systemprofiles/arcadepc/files/wild-west-shoot-out/GameCount.xml

dll_overrides:
  # Unity tries xinput1_3.dll: the payload
  xinput1_3: "n,b"
  # Wine's winhttp: the dump's Unity Doorstop (its BepInEx plugin) not loaded
  winhttp: "b"

env:
  WAL_ARCADEPC_BOARD: wws
  # the guns aim over Unity's picture (the resolution of args), centered in its window; the
  # crosshairs placed for it (their canvas is 1920 units wide: wws.rs)
  WAL_DEMUL_RESOLUTION: 1920x1080
  # the game's own crosshairs (its FrontSight setting, below): the common option's default
  WAL_CROSSHAIR: "1"
  # free play: the settings' Free; the crosshairs: their FrontSight
  WAL_ARCADEPC_XML: "GameConfig.xml:Free={freeplay},FrontSight={crosshair}"

input:
  # each gun (or mouse) aims, its trigger shoots; shooting off the screen reloads
  guns_enabled: true
  stick_as_dpad: false
  gun:
    offscreen: b6

# The cabinet has no start buttons: a shot starts. The board's coin (each player's), test (the
# settings) and select (their item).
native_map:
  # the gun's (or mouse's) right button reloads
  b2: reload
  b3: reload
  start: trigger
  coin: coin
  test: test
  service: select

options:
  - title: Game
    options:
      - key: WAL_FREEPLAY
        label: Free play
        kind: bool
        description: >-
          Games start without coins. Off: 3 coins a game (the settings menu changes it).

controls:
  lx: Gun aim (x)
  ly: Gun aim (y)
  b1: Trigger (reloads off screen)
  b2: Reload (right button)
  b3: Reload
  b6: Gun off screen
  start: Start (a shot)
  coin: Coin
  test: Settings menu
  service: Settings select
