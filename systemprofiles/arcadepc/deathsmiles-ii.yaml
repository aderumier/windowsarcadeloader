# Deathsmiles II (Cave, 2009, cvgame.exe, Direct3D 9, 32-bit, 640x480) - template, override
# values in userprofiles/arcadepc/deathsmiles-ii.yaml.
# A two player shooting game: a stick and three buttons each. The payload emulates the
# cabinet's COM3 I/O board (WAL_ARCADEPC_BOARD=cave, docs §6.3i).
system: arcadepc
name: Deathsmiles II

# loaded at the executable's entry point (the game imports no DLL of ours)
payload_loader: true
dll_overrides:
  xinput1_3: "n,b"
  # dgVoodoo 2.79.3's D3D9.dll (added to the dump; Direct3D 9 on 11, DXVK's): with DXVK's
  # Direct3D 9 the 3D backgrounds flashed (a sky dropped, buildings stretched for a frame),
  # wined3d's worse
  d3d9: "n,b"
files:
  # its settings: windowed borderless, the screen's size, 4:3 kept, no watermark
  dgVoodoo.conf: systemprofiles/arcadepc/files/deathsmiles-ii/dgVoodoo.conf

# the dump's community input library and its settings: not used (the payload is the board)
hide: [ds2_monitor.dll, monitor_input.bin, monitor_opt.bin]

env:
  # the window never sees its deactivation: the game stops (NOW LOADING forever) while another
  # window has the focus
  WAL_DESKTOP_ACTIVE: "1"
  WAL_ARCADEPC_BOARD: cave
  WAL_HIDE_CURSOR: "1"

options:
  - title: Game
    options:
      - key: WAL_FREEPLAY
        label: Free play
        kind: bool
        description: >-
          The SYSTEM menu's COIN MODE set to FREE PLAY: games start without coins. Off: one
          coin per credit when it was free play.

controls:
  up: Up
  down: Down
  left: Left
  right: Right
  b1: Button 1
  b2: Button 2
  b3: Button 3
  start: Start
  coin: Coin
  service: Service (credit)
  test: Test menu (hold)
