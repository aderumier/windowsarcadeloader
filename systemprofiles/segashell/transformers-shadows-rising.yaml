# Transformers: Shadows Rising (Sega Amusements, 2018), 2 player lightgun game on a Windows PC
# run by Sega's Shell. Runs Sega/Transformers2/Transformers2.exe; the payload plays the Shell.
# Override values in userprofiles/segashell/transformers-shadows-rising.yaml.
system: segashell
name: "Transformers: Shadows Rising"

input:
  guns_enabled: true
  stick_as_dpad: false
  # the trigger also presses its player's start (joining the game by shooting); the cabinet's
  # lever: right button pushed up, middle button pulled down (free play: no coin needed)
  gun:
    BTN_LEFT: b1,start
    BTN_RIGHT: up
    BTN_MIDDLE: down

controls:
  b1: Trigger
  up: Lever up
  down: Lever down

env:
  # the I/O board: CSAEBoard::Update replaced by the payload's
  WAL_SEGASHELL_BOARD: "0x17a5f0"
  # CSAEBoard::IsActive returns true (the lever buttons are only read on an active board);
  # no Shell security challenges (CShellMgr's flag cleared: unanswered, the game quits)
  WAL_PATCHES: "0x17a380:B801000000C3,0x1e70e4:00"
  # native 1280x720 by default, lighter on small GPUs (its DefaultResolution() made to return
  # "hdtv"; its command line resolution names are ignored), 1920x1080 with the option
  WAL_SEGASHELL_DEFAULT_RESOLUTION: "0x2607f0"
  WAL_SEGASHELL_FULLHD: "0"
  # vsync and the launcher's 60 fps limit kept: without vsync it ran too fast on a Batocera
  # machine (60 frames per second all the same). At 1920x1080 an integrated GPU missed
  # refreshes with vsync (~22 frames per second): the default 1280x720 holds 60.

options:
  - title: Display
    options:
      - key: WAL_SEGASHELL_FULLHD
        label: Full HD (1920x1080)
        kind: bool
        description: >-
          Render at 1920x1080, the cabinet's resolution. Off: 1280x720, lighter on small
          GPUs (integrated graphics drop below 60 frames per second in stages at 1080p).
