# Transformers: Shadows Rising (Sega Amusements, 2018), 2 player lightgun game on a Windows PC
# run by Sega's Shell. Runs Sega/Transformers2/Transformers2.exe; the payload plays the Shell.
# Override values in userprofiles/segashell/transformers-shadows-rising.yaml.
system: segashell
name: "Transformers: Shadows Rising"

input:
  guns_enabled: true
  stick_as_dpad: false
  # the trigger also presses its player's start (joining the game by shooting); the cabinet's
  # lever: right button pushed up, middle button pulled down (free play: no coin needed)
  gun:
    BTN_LEFT: b1,start
    BTN_RIGHT: up
    BTN_MIDDLE: down

# the test menu (F2) is the Shell's program, Sega/shell/Shell.exe: its folder made a real
# directory of the run tree (its own Game.ini copied in place) so that its logs (~50 files)
# stay out of the dump
files:
  Sega/shell/Game.ini: "{dump}/Sega/shell/Game.ini"

controls:
  b1: Trigger
  up: Lever up
  down: Lever down
  test: Test menu (gun calibration, settings, bookkeeping)
  service: Service (test menu, next item)

env:
  # the I/O board: CSAEBoard::Update replaced by the payload's
  WAL_SEGASHELL_BOARD: "0x17a5f0"
  # CSAEBoard::IsActive returns true (the lever buttons are only read on an active board);
  # no Shell security challenges (CShellMgr's flag cleared: unanswered, the game quits)
  WAL_PATCHES: "0x17a380:B801000000C3,0x1e70e4:00"
  # (the payload is also loaded by the test menu program)
  WAL_PATCHES_EXE: Transformers2.exe
  # native 1280x720 by default, lighter on small GPUs (its DefaultResolution() made to return
  # "hdtv"; its command line resolution names are ignored), 1920x1080 with the option
  WAL_SEGASHELL_DEFAULT_RESOLUTION: "0x2607f0"
  WAL_SEGASHELL_FULLHD: "0"
  # vsync and the launcher's 60 fps limit kept: without vsync it ran too fast on a Batocera
  # machine (60 frames per second all the same). At 1920x1080 an integrated GPU missed
  # refreshes with vsync (~22 frames per second): the default 1280x720 holds 60.
  # test menu: TEST (F2) ends the game and starts the Shell (from the game's directory)
  WAL_SEGASHELL_TEST_MENU: ../shell/Shell.exe
  # the Shell: straight into its test menu after its start (state 1 returns 0x21 instead of 2:
  # no updates, dongle and launch cycle), its data folders next to its own (c:\Sega\ShellData,
  # c:\Sega\GameData: ..\ShellData, ..\GameData, the game reads ShellData.ini there)
  WAL_SEGASHELL_SHELL_PATCHES: "0xcc08:21,0x8eac8:2E2E5C5368656C6C4461746100,0x8eadc:2E2E5C47616D654461746100,0x8eaf0:2E2E5C47616D654461746100,0x8eb80:2E2E5C47616D65446174615C52616E6B446174612E6A736F6E00"
  # its I/O board's HID report (guns, buttons) and its buttons, from the virtual sticks
  WAL_SEGASHELL_SHELL_INPUT: "0xffd030,0x1004980"
  # the test menu's exit: the calls of states 28 (game launch) and 2 (restart), back to the game
  WAL_SEGASHELL_SHELL_EXIT: "0xd0fd,0xcfad"

options:
  - title: Display
    options:
      - key: WAL_SEGASHELL_FULLHD
        label: Full HD (1920x1080)
        kind: bool
        description: >-
          Render at 1920x1080, the cabinet's resolution. Off: 1280x720, lighter on small
          GPUs (integrated graphics drop below 60 frames per second in stages at 1080p).
