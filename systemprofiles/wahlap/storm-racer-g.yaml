# Storm Racer G (Wahlap Technology / Sega, 2013), racing game with a wheel, pedals and a boost
# button on a Windows PC: bin/racing.exe, its USB I/O board driver (usb_io.dll) replaced by
# the payload.
# Override values in userprofiles/wahlap/storm-racer-g.yaml.
system: wahlap
name: Storm Racer G

input:
  stick_as_dpad: false
  gamepad:
    r2: accel
    l2: brake
  keyboard_ramp_ms: 500
  keyboard:
    p1:
      KEY_LEFT: -lx
      KEY_RIGHT: lx
      KEY_UP: accel
      KEY_DOWN: brake
      KEY_W: up
      KEY_S: down

env:
  # its 1360x768 window (racing.cfg: fullscreen = 0, a windowed device) made a borderless
  # window over the whole screen, its picture stretched to it, 16:9 kept
  WAL_WINDOW_SIZE: screen
  WAL_WINDOW_POPUP: "1"
  WAL_D3D9_WINDOWED_SIZE: 1360x768
  WAL_D3D9_ASPECT: "16:9"
  # The movies (logo, attract) are WMV9 (WMV3) AVIs read through AVIFile: Microsoft's WMV9 VCM
  # codec, WMV9VCM.dll, extracted into bin/ from wmv9VCMsetup.exe (cabextract), registered at
  # startup. Without it the first movie frame fails ("lpbi != 0") and the game crashes.
  WAL_VFW_CODECS: vidc.wmv3=WMV9VCM.dll
  # their audio read sizes asked the Windows way (Wine answers 0 bytes: an assert per frame)
  WAL_VFW_READ_FIX: "1"
  # A debug build: its asserts wait for a key on the console (c: continue, i: ignore...),
  # forever under Wine: answered "continue". One fires at each start (CLocMgr.cpp: textTable
  # string count, 34 compiled in, 155 in the assets' table), harmless.
  # The race's checkpoint billboards (HUD objects checkPoint, finishPoint, checkPole,
  # checkPole2, looked up at 0x416ac6) are in no resource of the dump: their per-frame update
  # (0x41bb20) dereferenced the missing objects (crash at the first race frame): it returns.
  # Its debug overlay is hidden: "cam pos" (0x4e3d00) and "fps" (0x4e3e07), drawn while their
  # debug menu options are on, the race's "ahead sect, arrow" line (0x40f4e0 returns) and the
  # NetDb version label of the bottom status bar (0x465d13: drawn as empty; its icons stay).
  # The results' winner crown (backend UI "crown") has no "*_win" text in the dump's assets:
  # its count text written at the race's end (0x4424a0, the crash after crossing the finish
  # line) and its animations (0x444b10, 0x444d20) skipped when the text is missing (checks in
  # the int3 padding at 0x442f74 and 0x437ed8, relative code only: the exe is relocated).
  WAL_PATCHES: "0xc008b:B063909090,0x1bb20:C21800,0xe3d00:90E9,0xe3e07:90E9,0xf4e0:C3,0x65d13:EB,\
    0x4259b:E8D409000090,0x42f74:8BB6D406000083BE4801000000750883C404E955F6FFFFC3,\
    0x44c60:8BB64801000085F60F84A7000000C686E0000000009090909090,\
    0x44cdc:8B864801000085C0742FF30F108E240100000F57D2680000803FE815C007008B8648010000F30F108E24010000FFB02C010000E8BCFD070090,\
    0x44d20:E8B331FFFF90,0x37ed8:8B864C01000083BE4801000000750E83C40453BB01000000E97ACE0000C3"

controls:
  lx: Wheel
  accel: Gas
  brake: Brake
  b1: Boost
  up: Menu up
  down: Menu down
  test: Operator menu
