# Tomb Raider Arcade (Adrenaline Amusements, Unity 2017.2, Mono, 64-bit) - template, override
# values in userprofiles/adrenaline/tomb-raider.yaml.
# Four guns: Sixense STEM electromagnetic trackers the payload poses to aim where each player's
# gun points; the trigger is the gun's button on the cabinet's Kaboom Adrio board, the tracker's
# own button reloads. The payload emulates the trackers' base, the board (coins, start buttons,
# triggers, the operator's keypad, the ticket feeders) and its Matrix dongle (docs §6.3k).
system: adrenaline
name: Tomb Raider

dll_overrides:
  # Unity loads xinput1_3.dll at start: the payload
  xinput1_3: "n,b"
  # the dump's Unity Doorstop proxy winhttp.dll: Wine's own, no plugins
  winhttp: "b"

# the full screen mode: the Resolution option (GUI's Options tab)
args: [-screen-fullscreen, "1", -screen-width, "{WAL_RESOLUTION.width}", -screen-height, "{WAL_RESOLUTION.height}"]

env:
  WAL_RESOLUTION: 1280x720
  # Wine's full screen mode emulation scales a lower mode to the screen with AMD FSR 1
  WINE_FULLSCREEN_FSR: "1"
  WAL_TOMBRAIDER_SHADOWS: "off"
  # the GUI's checkboxes show these (the payload's own default when unset: on)
  WAL_TOMBRAIDER_POSTPROCESS: "1"
  WAL_TOMBRAIDER_FOG: "1"
  WAL_TOMBRAIDER_REFLECTION: "1"

# An integrated Radeon 860M (15 W) holds 60 frames per second at 1280x720 + FSR without the
# shadows; the frame's costs at 1920x1080 (game mode screen, 22.6 ms): shadows 4.4 ms,
# post-processing 3.6 ms, fog 1.2 ms, water reflection 0.4 ms.
options:
  - title: Display
    options:
      - key: WAL_RESOLUTION
        label: Resolution
        kind: choice
        choices: [1280x720, 1600x900, 1920x1080]
        description: >-
          The game's 3D picture resolution, scaled to the screen (FSR upscaling below).
          1920x1080 is the cabinet's; 1280x720 (the default) is lighter on small GPUs (an
          integrated Radeon 860M: 60 frames per second with the shadows off, 35-42 at
          1920x1080 with every effect).
      - key: WINE_FULLSCREEN_FSR
        label: FSR upscaling
        kind: bool
        description: >-
          A resolution under the screen's upscaled with AMD FSR 1 (sharper than a plain
          stretch). On (the default); no effect at the screen's own resolution.
      - key: WAL_TOMBRAIDER_SHADOWS
        label: Shadows
        kind: choice
        choices: ["on", low, "off"]
        description: >-
          The real-time shadows, the heaviest effect: on (the game's high resolution, two
          cascades), low (low resolution, no cascades) or off (the default).
      - key: WAL_TOMBRAIDER_POSTPROCESS
        label: Post-processing
        kind: bool
        description: >-
          Every camera's ambient occlusion, bloom, depth of field and colour grading. On (the
          default); off: a flatter, greyer picture, lighter.
      - key: WAL_TOMBRAIDER_FOG
        label: Volumetric fog
        kind: bool
        description: The fog and mist layers. On (the default).
      - key: WAL_TOMBRAIDER_REFLECTION
        label: Water reflection
        kind: bool
        description: >-
          The water's planar reflection (the scene rendered a second time). On (the
          default).

input:
  # each player's gun (or mouse) aims, its trigger shoots
  guns_enabled: true
  stick_as_dpad: false

native_map:
  b1: trigger
  b2: reload
  start: start
  coin: coin
  test: operator
  service: select
  up: up
  down: down

controls:
  lx: Gun aim (x)
  ly: Gun aim (y)
  b1: Trigger
  b2: Reload
  start: Start
  coin: Coin
  test: Operator menu
  service: Select (operator)
  up: Previous (operator)
  down: Next (operator)
