# Candy Crush Arcade (Adrenaline Amusements / Sarbakan, Unity 4.6, Mono, 32-bit, Direct3D 11) -
# template, override values in userprofiles/adrenaline/candy-crush-arcade.yaml.
# A touch screen game played with the mouse (or a gun): the candies swapped by dragging them.
# The payload makes player 1's gun the game's mouse and emulates the cabinet's Kaboom Adrio
# two-feeder board (coins, the operator's keypad, the ticket feeders) and its Matrix dongle
# (docs §6.3k).
system: adrenaline
name: Candy Crush Arcade

dll_overrides:
  # Unity loads xinput1_3.dll at start: the payload
  xinput1_3: "n,b"

# loaded at the executable's entry point: Unity reads the screen's size before it loads
# xinput1_3.dll (the 1080x1920 desktop must be there first)
payload_loader: true

env:
  # the touch screen: Unity's mouse, player 1's gun
  WAL_ADRENALINE_MOUSE: "1"
  # the dot where it touches (the game shows no cursor): its size in percent of the screen
  # height, its color
  WAL_CROSSHAIR: "1"
  WAL_CROSSHAIR_SIZE: "1.5"
  WAL_CROSSHAIR_COLOR: FF2020
  # no system arrow over the game (the dump's assembly shows it): the dot is the pointer
  WAL_HIDE_CURSOR: "1"
  # The cabinet's portrait monitor: a 1080x1920 desktop for the game, its window fitted onto
  # the real screen (aspect kept, centered).
  WAL_DESKTOP_SIZE: 1080x1920
  # the dump's assembly asks a 1920x1080 full screen (the original 1080x1920): the desktop's
  WAL_ADRENALINE_FULLSCREEN_DESKTOP: "1"
  # the cabinet art around the picture (in the dump), its opening fitted to the game's window,
  # its parts stretched to the screen's edges (no black bars)
  WAL_BEZEL: bezel.png
  WAL_BEZEL_FIT: stretch
  # the window not managed: placed by the payload at the top of the screen (a window
  # manager's panel pushed it down); never deactivated (Unity minimized it without the focus)
  WAL_DESKTOP_UNMANAGED: "1"
  WAL_DESKTOP_ACTIVE: "1"

args: [-screen-fullscreen, "1", -screen-width, "1080", -screen-height, "1920"]

# the button touches only (not the keypad's up as well)
native_map:
  b1: touch

input:
  # player 1's gun (or the mouse) aims, its trigger touches
  guns_enabled: true
  stick_as_dpad: false

controls:
  lx: Touch position (x)
  ly: Touch position (y)
  b1: Touch (hold and drag to swap candies)
  b2: Select (operator)
  coin: Coin
  test: Operator menu
  service: Operator menu

options:
  - title: Game
    options:
      - key: WAL_CROSSHAIR
        label: Touch pointer
        kind: bool
        description: >-
          A small red dot where the mouse or gun touches (the game shows no cursor).
      - key: WAL_CROSSHAIR_SIZE
        label: Touch pointer size
        kind: number
        min: 1
        max: 6
        description: >-
          The dot's size, in percent of the screen height.
