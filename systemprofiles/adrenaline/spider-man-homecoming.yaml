# Spider-Man Homecoming (Adrenaline Amusements, Unity 5.5, Mono, 32-bit) - template, override
# values in userprofiles/adrenaline/spider-man-homecoming.yaml.
# Two players, one button each. The payload emulates the cabinet's Kaboom Adrio board (coins,
# the players' buttons, the operator's keypad, the ticket feeders) and its Matrix dongle
# (docs §6.3k).
system: adrenaline
name: Spider-Man Homecoming

dll_overrides:
  # Unity loads xinput1_3.dll at start: the payload
  xinput1_3: "n,b"

# loaded at the executable's entry point: Unity reads the screen's size before it loads
# xinput1_3.dll (the 1080x1920 desktop must be there first)
payload_loader: true

env:
  # The cabinet's portrait monitor: the game sets 1080x1920 full screen at start
  # (ApplicationManager: Screen.SetResolution(1080, 1920, true)). Not a mode of a landscape
  # screen: NVIDIA's drivers give a black screen (native Windows too). A 1080x1920 desktop for
  # the game (its full screen at the desktop's size, no mode change), its window fitted onto the
  # real screen (aspect kept, centered).
  WAL_DESKTOP_SIZE: 1080x1920

# the start size too (else Unity's last one, saved in the registry)
args: [-screen-fullscreen, "1", -screen-width, "1080", -screen-height, "1920"]

controls:
  b1: Web (the player's button)
  b2: Select (operator)
  coin: Coin
  test: Operator menu
  service: Operator menu
