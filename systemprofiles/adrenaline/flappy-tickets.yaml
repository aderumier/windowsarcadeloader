# Flappy Tickets (Adrenaline Amusements, Unity 4.6, Mono, 32-bit) - template, override values in
# userprofiles/adrenaline/flappy-tickets.yaml.
# The players' buttons on the cabinet's Kaboom Adrio two-feeder board (coins, the operator's
# keypad, the ticket feeders), emulated by the payload with the Matrix dongle (docs §6.3k; the
# dump has no dongle library: emulated whole).
system: adrenaline
name: Flappy Tickets

dll_overrides:
  # Unity loads xinput1_3.dll at start: the payload
  xinput1_3: "n,b"

# loaded at the executable's entry point: Unity reads the screen's size before it loads
# xinput1_3.dll (the 1080x1920 desktop must be there first)
payload_loader: true

env:
  # The cabinet's portrait monitor: the game sets 1080x1920 full screen at start
  # (ApplicationManager: Screen.SetResolution(1080, 1920, true)). A 1080x1920 desktop for the
  # game, its window fitted onto the real screen (aspect kept, centered).
  WAL_DESKTOP_SIZE: 1080x1920
  # the cabinet art around the picture (in the dump), its opening fitted to the game's window,
  # its parts stretched to the screen's edges (no black bars)
  WAL_BEZEL: bezel.png
  WAL_BEZEL_FIT: stretch
  # the window not managed: placed by the payload at the top of the screen (a window
  # manager's panel pushed it down); never deactivated (Unity minimized it without the focus)
  WAL_DESKTOP_UNMANAGED: "1"
  WAL_DESKTOP_ACTIVE: "1"

# the start size too (else Unity's last one, saved in the registry)
args: [-screen-fullscreen, "1", -screen-width, "1080", -screen-height, "1920"]

controls:
  b1: Flap (the player's button)
  b2: Select (operator)
  coin: Coin
  test: Operator menu
  service: Operator menu
