# Mario & Sonic at the Rio 2016 Olympic Games Arcade (Sega, Nu 1.1, 2016; game id SDCH):
# 64-bit Direct3D 11, a portrait 1080x1920 screen.
# amdaemon.exe (the cabinet's system service) is started first, then the game (package\app.exe),
# both with the ALLS payload: on the Nu, amdaemon reads the JVS I/O board through the AMEX
# board (WAL_ALLS_JVS).
# Override values in userprofiles/seganu/mario-and-sonic-at-rio-2016-olympic-games.yaml.
system: alls
name: Mario & Sonic at the Rio 2016 Olympic Games

# both programs started by wal-loader64 with the payload
payload_loader: true
# game.bat's -m; the game's window at the desktop's size (its full screen mode takes the real
# screen's size)
args: [-m, -windowed]

# game.bat's amdaemon command line (its configuration files merged in this order)
background:
  - >-
    amdaemon.exe -c config_common.json config_ex.json config_jp.json config_st1_ex.json
    config_st1_jp.json config_st2_ex.json config_st2_jp.json config_st3_ex.json config_st3_jp.json
    config_st4_ex.json config_st4_jp.json config_wal.json -l Y:\amdaemon.log
background_wait_ms: 5000

# merged last by amdaemon: its video setup off (it rotates the cabinet's monitor; the
# launcher fits the portrait picture instead), the network address from DHCP, the LAN install
# off (cabinet 1 is the store's install server)
files:
  package/config_wal.json: systemprofiles/alls/files/mario-and-sonic-at-rio-2016-olympic-games/config_wal.json

# The cabinet's drives: E: the AMFS (the image information, the system backup amdaemon keeps),
# Y: the game's data (its logs, backup; the AMEX board's EEPROM and SRAM)
drives:
  e: AMFS
  y: AppData

# the cabinet (the game's input test): two levers, each read by 8 direction sensors (the JVS
# layout `levers`: the left lever on player 1's directions, the right lever on player 1's
# right stick or player 2's directions), a button on each lever, a foot sensor on each side,
# six jump sensors (a jump breaks them all)
native_map:
  start: start
  b1: start
  b2: p2start
  b3: btn5
  b4: p2btn5
  b5: btn6+btn7+btn8+p2btn6+p2btn7+p2btn8

env:
  WAL_ALLS_GAME_ID: SDCH
  WAL_ALLS_PLATFORM_ID: AAV1
  # the keychip's region: 1 Japan (Japanese, the Aime cards and the game server), 4 export
  # (English: the export game has no Aime screens, no game server)
  WAL_ALLS_REGION: "1"
  # the Nu's amdaemon reads the JVS I/O board through the AMEX board (the lever buttons'
  # lamps on its general purpose outputs)
  WAL_ALLS_JVS: "1"
  WAL_TYPEX_JVS_LAYOUT: levers
  WAL_TYPEX_JVS_OUTPUTS: "8"
  # amdaemon's clock reported synced with ALL.Net's (amRtcIsServerSync: mov eax,1; ret);
  # offline it never is: error 8114 "ALL.Net System error (RTC)"
  WAL_ALLS_DAEMON_PATCHES: "0xed890:B801000000C3"
  # ALL.Net's authentication accepted (the payload's server) and the Aime reader on COM1
  # (amdaemon's aime unit port 1; player 1's card input touches it with the player's card)
  WAL_ALLS_ALLNET: "1"
  # the game server (Sega's CTS: rankings, the Aime players' data) in the game's process
  WAL_ALLS_CTS: "1"
  WAL_ALLS_AIME_PORT: COM1
  # the cabinet's reader (837-15286, its firmware 0x92 in package\): another model gets a firmware
  # update, then is never polled for cards
  WAL_AIME_READER: "15286"
  # after start, the card touched by itself when the game asks for it
  WAL_ALLS_AUTO_CARD: "1"
  # the main cabinet's announcements (UDP 20199, to the subnet's broadcast address) heard by the
  # game itself: else CONNECT MAIN CABINET waits, then BAD
  WAL_ALLS_UDP: "1"
  # the LED board (837-15093) on COM12, else error 3001 "LED Board Not Found"
  WAL_ALLS_LED_PORT: COM12
  # the cabinet's portrait monitor: a 1080x1920 desktop for the game, its window fitted onto
  # the real screen (in the bezel); -windowed opens a captioned window: made a borderless popup, not managed
  # by the window manager
  WAL_DESKTOP_SIZE: 1080x1920
  WAL_EXE_ENV: "app.exe: WAL_WINDOW_POPUP=1"
  WAL_DESKTOP_UNMANAGED: "1"
  WAL_DESKTOP_ACTIVE: "1"
  # the cabinet art in the dump root's bezel.png (the game runs in package\), its opening
  # fitted to the game's window
  WAL_BEZEL: ..\bezel.png
  WAL_BEZEL_FIT: "1"

options:
  - title: Language
    options:
      - key: WAL_ALLS_REGION
        label: Region
        kind: choice
        choices: ["1", "4"]
        description: >-
          1: Japan, Japanese text, with the Aime cards (the player's name and progress) and the
          game server. 4: export, English text, played without cards (the export game has no
          Aime screens).
  - title: Aime card
    options:
      - key: WAL_ALLS_AUTO_CARD
        label: Touch the card automatically
        kind: bool
        description: >-
          After start, the Aime card is touched by itself when the game asks for it (the
          player's name and progress kept on the card). Off: touch it with the card button.

controls:
  up: Left lever up
  down: Left lever down
  left: Left lever left
  right: Left lever right
  rx: Right lever (left / right)
  ry: Right lever (up / down)
  b1: Left lever button
  b2: Right lever button
  b3: Left foot (run)
  b4: Right foot (run)
  b5: Jump
  start: Left lever button
  coin: Coin
  service: Service
  test: Test
  card: Aime card
