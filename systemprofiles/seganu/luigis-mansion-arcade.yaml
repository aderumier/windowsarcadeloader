# Luigi's Mansion Arcade (Sega / Capcom, Nu 1.x, 2015; game id SDCF): 64-bit Direct3D 11,
# two gun-shaped vacuum controllers.
# Runs exe\x64\VACUUM.exe from its folder (its data paths: ..\..\DataGlobal\EN\Data).
# Override values in userprofiles/seganu/luigis-mansion-arcade.yaml.
system: seganu
name: Luigi's Mansion Arcade

# started by wal-loader64 with the 64-bit payload
payload_loader: true

# the cabinet's Y: drive (application data)
drives:
  y: Y

env:
  WAL_SEGANU_GAME_ID: SDCF
  WAL_SEGANU_PLATFORM_ID: AAV0
  # free play (the common option): the game's coin settings (EEPROM record 0x1200, free play at
  # +0x18), from which it writes amLib's credit record
  WAL_SEGANU_FREEPLAY_BYTE: "0x1218"
  # a blank backup set up as the game does (its id record and copy, its default coin settings:
  # size, coin / credit values, start 2, continue 1, free play); else its first boot sets it up,
  # free play off
  WAL_SEGANU_FREEPLAY_RECORD: "0x1f0:5d5b0c930000000053444346010000\
    00,0x9f0:5d5b0c930000000053444346010000\
    00,0x1200:1c000000010000000100000002000000020000000100000000"
  # the I/O board on COM1 (guns, coins, switches; lamps), its object in the game (the guns'
  # calibration)
  WAL_SEGANU_LMAIO: COM1
  WAL_SEGANU_LMAIO_OBJECT: "0x4f6c98"
  # the cabinet's switches on the board (its first word): test 0x4, service 0x2
  WAL_SEGANU_LMAIO_SW: "1test=0:4,1service=0:2"
  # the executable's Capcom protector (it ends the process under Wine after unpacking the
  # game): the game started at its entry point once unpacked, the functions the protector
  # replaced by jumps into its virtual machine written back (and the calls to the first one),
  # and its data folder path (decrypted by the protector after its checks)
  WAL_SEGANU_UNPACK: "0x30fb70"
  WAL_SEGANU_UNPACK_PATCHES: "485a:,5c16:46,adc1:9B,ca34:28,cbb7:A5,d02e:2E,d054:08,d450:0C,da1b:41,da93:C9,de2e:2E,deae:AE,37fa6:B6,11c5f0:,11d2df:,2b4270:488B05F1891E00833800740A8B80B401000085C0750233C0F3C3,34e0d4:4889542410554883EC30488BEA488D05F7F1DCFF4883C4305DC3CC4889542410554883EC30488BEA488D05DCF1DCFF4883C4305DC3,3d0c20:2E2E2F2E2E2F44617461476C6F62616C2F454E2F446174612F00"

input:
  # each player's gun (or mouse) aims, its trigger vacuums
  guns_enabled: true
  stick_as_dpad: false
  # the trigger also presses start (joins the game), as the middle button
  gun:
    BTN_LEFT: b1,start
    BTN_MIDDLE: start

controls:
  lx: Gun aim (x)
  ly: Gun aim (y)
  b1: Trigger (vacuum; on a gun, also start)
  b2: Action button
  b4: Gun off the screen
  start: Start
  coin: Coin
  service: Service
  test: Test
