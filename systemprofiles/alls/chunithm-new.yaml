# CHUNITHM NEW!! (Sega, ALLS, 2021; game id SDHD, version 2.00): CHUNITHM on ALLS, a 32-bit
# Direct3D 9 rhythm game played on a touch slider (16 keys) under infrared air sensors.
# amdaemon.exe (64-bit, beside the game in App\bin: game.bat's) runs the "Type 4" USB I/O board
# (the air sensors, test, service, coins) and the Aime reader on COM4, then the game
# (App\bin\chusanApp.exe) with its slider on COM1 and LED boards on COM2 / COM3 (a CVT cabinet),
# both with the ALLS payload (segatools' chusanhook).
# The dump's programs are packed with a protector that dies under Wine (direct system calls): the
# same game's unpacked 2.02 programs and ICF (SEGAguide SDHD/202.zip) are laid over them, the
# packed ones kept as .orig.
# Override values in userprofiles/alls/chunithm-new.yaml.
system: alls
name: CHUNITHM NEW!!

# Wine's Direct3D: DXVK's SM3 shader compiler (dxbc-spirv) asserts on CHUNITHM's pixel shaders
dxvk: false

# game.bat's amdaemon command line (a store server cabinet, CVT) and the profile's configuration
# last: its video setup off, the network address from DHCP, no LAN install, no e-money terminal
background:
  - >-
    amdaemon.exe -f -c config_common.json config_server.json config_cvt.json config_wal.json
background_wait_ms: 5000
files:
  App/bin/config_wal.json: systemprofiles/alls/files/chunithm-new/config_wal.json

# The cabinet's drives: E: the AMFS (the image information, the system backup amdaemon keeps),
# Y: the game's data (Y:\SDHD: its logs; the players in Y:\chuni)
drives:
  e: amfs
  y: AppData

env:
  WAL_ALLS_BOARD: chusan
  WAL_ALLS_GAME_ID: SDHD
  WAL_ALLS_PLATFORM_ID: ACA1
  # the system DIP switches (game.bat's): 1 the store's delivery server (else it waits for one
  # on the LAN), 2 the 120 Hz monitor's port settings, 3 a CVT cabinet (the LED boards on COM2 /
  # COM3, the 837-15286 reader on COM4)
  WAL_ALLS_DIPSW: "07"
  # ALL.Net's authentication accepted, the title server (the players' data) in amdaemon
  WAL_ALLS_ALLNET: "1"
  WAL_ALLS_TITLE_URI: "http://{router}/SDHD/200/"
  # the LED board's identity: the dump's firmware's (firm\update_15093-06_6710_90_adf7.hex)
  WAL_ALLS_LED_BOARD: "15093-06,6710,adf7"
  # amdaemon's Aime unit on COM4 (a CVT cabinet's 837-15286, firmware 0x94)
  WAL_ALLS_AIME_PORT: COM4
  WAL_AIME_READER: "15286"
  WAL_ALLS_AUTO_CARD: "1"
  # the card touched 4 s after the slider: the attract reads (and drops) a card touched at once,
  # the card prompt after the slider's touch reads it then
  WAL_ALLS_AUTO_CARD_DELAY_MS: "4000"
  WAL_CHUNI_NEWS: "0"
  WAL_ALLS_TIMEWARP: "1"
  # its fullscreen device lost with the focus (the game quits): windowed, borderless, 16:9
  WAL_D3D9_WINDOWED_SIZE: 1920x1080
  WAL_D3D9_ASPECT: "16:9"
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: screen
  # CRI ADX2's exclusive-mode stream played in shared mode
  WAL_WASAPI_SHARED: "1"
  # a red dot where the mouse is (the common crosshair option, the mouse on the pedals), always
  # shown; the desktop's own arrow hidden
  WAL_CROSSHAIR: "1"
  WAL_CROSSHAIR_AXES: pedals
  WAL_CROSSHAIR_STYLE: disc
  WAL_CROSSHAIR_SIZE: "1.5"
  WAL_CROSSHAIR_COLOR: FF2020
  WAL_CROSSHAIR_HIDE: "0"
  WAL_HIDE_CURSOR: "1"
  OPENSSL_ia32cap: "~0x20000000"

options:
  - title: Aime card
    options:
      - key: WAL_ALLS_AUTO_CARD
        label: Touch the card automatically
        kind: bool
        description: >-
          After the slider's first touch, the Aime card is touched by itself when the game asks
          for it (the player's name, scores and progress kept on the card). Off: touch it with
          the card button.
  - title: News
    options:
      - key: WAL_CHUNI_NEWS
        label: Show the news at login
        kind: bool
        description: >-
          The game's announcements (events, new songs, courses), one screen each after the
          card login: a new player sees them all (each 30 s, or 次へ to skip).

# the keyboard as segatools': S D F G H J K L the slider from the left (two keys each), Space the
# air (raise the hand); 1 start, 5 coin, F1 service, F2 test, F4 card (the defaults). These keys
# are player 2's and 3's by default: freed there. The arrows for the menus: left the slider's
# keys 1-2 (the menus' left), right its keys 5-6 (the menus' right), up nothing.
input:
  # the touchpad (or a touchscreen) as the slider, finger by finger: each finger the key under it
  # (16 across), a finger in its top third raises the hand (air)
  touch: true
  # the mouse too, beside the touchpad: its left button touches the key under the red dot (the
  # picture's top third: the air); on the pedals (the sticks touch the slider), the button on the
  # card reader's keypad 0 (no keypad on this reader)
  guns_enabled: true
  gun:
    x: accel
    y: brake
    BTN_LEFT: kp0
    BTN_RIGHT: none
    BTN_MIDDLE: none
    BTN_2: none
  keyboard:
    p1:
      KEY_S: left
      KEY_D: down
      KEY_F: up
      KEY_G: right
      KEY_H: b1
      KEY_J: b5
      KEY_K: b2
      KEY_L: b6
      KEY_SPACE: b3
      KEY_RIGHT: up
      KEY_UP: none
    p2:
      KEY_S: none
      KEY_D: none
      KEY_F: none
      KEY_G: none
    p3:
      KEY_J: none
      KEY_K: none
      KEY_L: none

controls:
  lx: Slider, left half (direction picks the key)
  ly: Slider, left half
  rx: Slider, right half (direction picks the key)
  ry: Slider, right half
  left: Slider keys 1-2
  down: Slider keys 3-4
  up: Slider keys 5-6
  right: Slider keys 7-8
  b1: Slider keys 9-10
  b5: Slider keys 11-12
  b2: Slider keys 13-14
  b6: Slider keys 15-16
  b3: Air (raise the hand)
  b4: Air (raise the hand)
  b7: Air (raise the hand)
  b8: Air (raise the hand)
  start: Start (with the automatic card)
  coin: Coin
  service: Service
  test: Test
  card: Aime card
  kp0: Mouse touch (the key under the red dot)
