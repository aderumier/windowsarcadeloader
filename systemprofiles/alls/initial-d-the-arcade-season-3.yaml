# Initial D THE ARCADE Season 3 (Sega, ALLS UX, 2023; game id SDGT, version 2.30): Unreal
# Engine 4, 64-bit Direct3D 11, 1920x1080. One player: a wheel, gas and brake pedals, a 6-speed
# H shifter, the cabinet's up/down/left/right, start and view change buttons.
# amdaemon.exe (the cabinet's system service) is started first, then the game, both with the
# payload: the keychip and the USB I/O board (wheel, pedals, shifter, buttons, coins, test) are
# emulated in amdaemon.
# Override values in userprofiles/alls/initial-d-the-arcade-season-3.yaml.
system: alls
name: Initial D THE ARCADE Season 3

# both programs started by wal-loader64 with the payload
payload_loader: true
# boot.bat's cabinet launch (English: the export keychip's culture), its settings (Saved\) in
# the game's folder (-NotInstalled). Not boot.bat's -UserDir: the game then posts to its server
# without the URL's folders (/Get instead of /230/initiald/Alive/Get).
args: [launch=Cabinet, -Master, -culture=en, -ResX=1920, -ResY=1080, -NotInstalled]

# boot.bat's amdaemon command line (every config_*.json of its folder, from the game's folder),
# the profile's configuration last
background:
  - >-
    ../../../../AMDaemon/amdaemon.exe -c ..\..\..\..\AMDaemon\config_aime_high_ex.json ..\..\..\..\AMDaemon\config_aime_high_jp.json ..\..\..\..\AMDaemon\config_aime_normal_ex.json ..\..\..\..\AMDaemon\config_aime_normal_jp.json ..\..\..\..\AMDaemon\config_common.json ..\..\..\..\AMDaemon\config_ex.json ..\..\..\..\AMDaemon\config_jp.json ..\..\..\..\AMDaemon\config_laninstall_client_ex.json ..\..\..\..\AMDaemon\config_laninstall_client_jp.json ..\..\..\..\AMDaemon\config_laninstall_server_ex.json ..\..\..\..\AMDaemon\config_laninstall_server_jp.json ..\..\..\..\AMDaemon\config_seat_1_ex.json ..\..\..\..\AMDaemon\config_seat_1_jp.json ..\..\..\..\AMDaemon\config_seat_2_ex.json ..\..\..\..\AMDaemon\config_seat_2_jp.json ..\..\..\..\AMDaemon\config_seat_3_ex.json ..\..\..\..\AMDaemon\config_seat_3_jp.json ..\..\..\..\AMDaemon\config_seat_4_ex.json ..\..\..\..\AMDaemon\config_seat_4_jp.json ..\..\..\..\AMDaemon\config_seat_single_ex.json ..\..\..\..\AMDaemon\config_seat_single_jp.json
    ..\..\..\..\AMDaemon\config_wal.json -l Y:\amdaemon.log
background_wait_ms: 5000

# amdaemon's video setup off (the launcher sets the screen), the e-money terminal absent, the
# Aime reader's firmware from the game's folder (amdaemon runs there), ALL.Net accounting off
# (its billing server is absent: a fresh cabinet's attract says "It's being processed now"
# and refuses START until its play report is sent)
files:
  App/DAC/AMDaemon/config_wal.json: systemprofiles/alls/files/initial-d-the-arcade-season-3/config_wal.json

# The cabinet's drives: E: the AMFS (the system backup amdaemon keeps), Y: the game's data
drives:
  e: AMFS
  y: AppData

# the option data (C:\Mount\Option: the attract's information movie...), the dump's Option
# folder when it has one
c_folders:
  Mount/Option: Option

env:
  WAL_ALLS_GAME_ID: SDGT
  # the cabinets' maintenance hours (Japan 02:00-07:00) never reached: the attract stays black
  # in them (segatools' timewarp, payload clock.rs)
  WAL_ALLS_TIMEWARP: "1"
  # ALLS MX (segatools' platform id for the game; ACA0 is refused: error 0949 "Keychip Not
  # Found"), the platform name the game reads ALLS UX (as the cabinet reports)
  WAL_ALLS_PLATFORM_ID: ACA4
  WAL_ALLS_PLATFORM_NAME: ALLS UX
  # the export keychip (amdaemon's EXP configurations, the game in English)
  WAL_ALLS_REGION: "4"
  # DIP switches (system_config.json): 1 the main cabinet (server), 2 the SWDC cabinet (its
  # Aime reader 837-15396), 3 a single seat
  WAL_ALLS_DIPSW: "07"
  # the cabinet's address (both programs): the single seat's, 192.168.158.5, its gateway and
  # DNS server .254 (config_seat_single)
  WAL_ALLS_SUBNET: 192.168.158.0
  WAL_ALLS_HOST: "5"
  WAL_ALLS_ROUTER: "254"
  WAL_ALLS_GAME_ADAPTER: "1"
  WAL_ALLS_BOARD: idac
  # the Aime card reader (config_aime_high's unit)
  WAL_ALLS_AIME_PORT: COM3
  # the card touched by itself at the card prompt after start (payload aime.rs)
  WAL_ALLS_AUTO_CARD: "1"
  # ...3 s after start: the game drops a card read on its attract, its card prompt reads it
  WAL_ALLS_AUTO_CARD_DELAY_MS: "3000"
  # online: ALL.Net accepted, the Aime cards (AimeDB) and the players' data (the game server,
  # payload idac.rs) answered by the payload. "0": offline (guests only).
  WAL_ALLS_ALLNET: "1"
  # the game server's URL in ALL.Net's host field (as ARTEMiS answers: the game posts to
  # <host>initiald/..., https:// when the host has no scheme)
  WAL_ALLS_TITLE_HOST: http://192.168.158.254/230/
  # amdaemon's clock reported synced with ALL.Net's (amRtcIsServerSync: mov eax,1; ret; the
  # same function as Sega World Drivers Championship's, found by its bytes). Offline it never
  # is: error 8114 "ALL.Net System error (RTC)".
  WAL_ALLS_DAEMON_PATCHES: "0x288350:B801000000C3"
  # the single seat is the store's LAN server (UXeLanWrap::FIsCabinetSever: mov al,1; ret):
  # the LAN library's server role reads off whatever the DIP switches, and BP_BootCheck stops a
  # single seat that is not the server with error 3002 "Single Seat Setting Failed"
  WAL_PATCHES: "0x71bcc0:B001C3"
  # a borderless 16:9 window centered on the screen: the game lays its interface out for 16:9
  # (on a 16:10 screen its right side was cut: the start prompt)
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: picture
  WAL_D3D9_ASPECT: "16:9"

options:
  - title: Aime card
    options:
      - key: WAL_ALLS_AUTO_CARD
        label: Touch the card automatically
        kind: bool
        description: >-
          After start, the Aime card is touched by itself at the card prompt (the player's
          data saved on the game server). Off: touch it with the card button, or play as a
          guest.
  - title: Clock
    options:
      - key: WAL_ALLS_TIMEWARP
        label: Skip the maintenance hours
        kind: bool
        description: >-
          The cabinets close from 2:00 to 7:00 in Japan (the attract stays black, the game waits
          for its reboot): on (the default), the game's clock never reaches those hours.

input:
  stick_as_dpad: false
  gamepad:
    y: b1
    l1: b6
    r1: b7
    r2: accel
    l2: brake
  keyboard_ramp_ms: 300
  keyboard:
    p1:
      # the arrows steer and drive, and move in the menus (the cabinet's buttons)
      KEY_LEFT: -lx,left
      KEY_RIGHT: lx,right
      KEY_UP: accel,up
      KEY_DOWN: brake,down
      KEY_LEFTCTRL: b1
      KEY_A: b6
      KEY_S: b7
      # the H shifter's gears on the numpad (1 stays start, 5 coin: the automatic card waits
      # for start)
      KEY_KP1: kp1
      KEY_KP2: kp2
      KEY_KP3: kp3
      KEY_KP4: kp4
      KEY_KP5: kp5
      KEY_KP6: kp6

controls:
  lx: Wheel
  accel: Gas
  brake: Brake
  up: Up
  down: Down
  left: Left
  right: Right
  b1: View change
  b6: Shift down
  b7: Shift up
  kp1: Gear 1 (H shifter)
  kp2: Gear 2 (H shifter)
  kp3: Gear 3 (H shifter)
  kp4: Gear 4 (H shifter)
  kp5: Gear 5 (H shifter)
  kp6: Gear 6 (H shifter)
  start: Start
  coin: Coin
  service: Service
  test: Test
