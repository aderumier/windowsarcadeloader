# The Bishi Bashi (Konami, game code IBB): launcher.exe (Direct3D 9), up to three players, each
# a red, a green, a blue and a yellow button. The payload replaces libacio.dll (HBHI board: the
# players' buttons, test, service, coins; card reader) and answers the game's libbms.dll
# (BM-System) imports.
# Override values in userprofiles/konami/the-bishi-bashi.yaml.
system: konami
name: The Bishi Bashi

env:
  WAL_ANSI_CODEPAGE: "932"
  WAL_FONT_CODEPAGE: "932"
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: screen
  WAL_HIDE_CURSOR: "1"
  # the game's DirectInput keyboard (data/xml/IBBconf.xml's debug keys): no device
  WAL_DINPUT_DISABLE: "1"

input:
  # red, green, blue under the right hand, yellow above them
  gamepad:
    x: b1
    a: b2
    b: b3
    y: b4

controls:
  b1: Red
  b2: Green
  b3: Blue
  b4: Yellow (start, finish)
  start: Yellow (start, finish)
  coin: Coin
  service: Service
  test: Test
