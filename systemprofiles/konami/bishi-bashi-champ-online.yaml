# Bishi Bashi Champ Online (Konami, 2005 build, game code E99): E99/bin/game.exe (Direct3D 8),
# three players, each a start and a red, a green and a blue button. The payload replaces
# ezusb.dll (the EZ-USB I/O board: the players' buttons, test, service, coins, DIP switches,
# lamps; its security plug) and redirects the cabinet's drive D: (the game's data and saves) to
# the dump root.
# Override values in userprofiles/konami/bishi-bashi-champ-online.yaml.
system: konami
name: Bishi Bashi Champ Online

payload_install: [E99/bin/ezusb.dll]

env:
  WAL_ANSI_CODEPAGE: "932"
  WAL_FONT_CODEPAGE: "932"
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: screen
  WAL_HIDE_CURSOR: "1"

input:
  # red, green, blue under the right hand
  gamepad:
    x: b1
    a: b2
    b: b3
    y: none

controls:
  b1: Red
  b2: Green
  b3: Blue
  start: Start
  coin: Coin
  service: Service
  test: Test
