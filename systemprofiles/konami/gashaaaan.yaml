# Gashaaaan (Konami, 2006): up to 4 players throw balls at the screen, a camera board sees
# where they hit. bin/ballshooting.exe (OpenGL) drives the cabinet through its iob.dll (I/O
# board) and ballio.dll (camera board): the payload replaces iob.dll and answers ballio.
# (Gashaaaan Refill! is another game: gashaaaan-refill.yaml.)
# Override values in userprofiles/konami/gashaaaan.yaml.
system: konami
name: Gashaaaan

payload_install: [bin/iob.dll]

# BALLS.INI: AVS's /dev/nvram (settings, bookkeeping) on F:\, /dev/raw on E:\
drives:
  e: E
  f: F

env:
  # Japanese text (error and test menu messages) in Shift-JIS
  WAL_ANSI_CODEPAGE: "932"
  # the game's 1280x480 window (its two 640x480 screens) made a borderless screen-sized one:
  # the payload draws the game's picture over it, scaled, aspect kept
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: screen
  # the picture (2.67:1) stretched to the whole screen ("1": aspect kept, black bars; Batocera
  # ES: KEEP ASPECT RATIO)
  WAL_KEEP_ASPECT_RATIO: "0"
  WAL_HIDE_CURSOR: "1"
  # each player's aim drawn over the picture (where a throw lands)
  WAL_KONAMI_CROSSHAIRS: "1"
  WAL_KONAMI_CROSSHAIR_STYLE: ring-cross
  WAL_KONAMI_CROSSHAIR_SIZE: "6"
  WAL_KONAMI_CROSSHAIR_TINT: "1"

# The game's own options, for the GUI's Options tab (its env variables above).
options:
  - title: Display
    options:
      - key: WAL_KEEP_ASPECT_RATIO
        label: Keep aspect ratio
        kind: bool
        description: >-
          The game's wide picture (two screens side by side, 2.67:1) with its aspect kept,
          black bars above and below. Off: stretched to the whole screen.
  - title: Crosshairs
    options:
      - key: WAL_KONAMI_CROSSHAIRS
        label: Crosshairs
        kind: bool
        description: >-
          Each player's aim drawn over the picture, in the player's color (P1 blue, P2 red,
          P3 green, P4 yellow), while the gun moves. Off: nothing shows where a ball goes.
      - key: WAL_KONAMI_CROSSHAIR_STYLE
        label: Style
        kind: choice
        choices: [ring-cross, cross, ring, dot]
        description: The built-in crosshair, for players without an image of their own.
      - key: WAL_KONAMI_CROSSHAIR_SIZE
        label: Size (% of the screen height)
        kind: number
        min: 2
        max: 20
      - key: WAL_KONAMI_CROSSHAIR_P1
        label: P1 image
        kind: text
        description: >-
          A PNG file (full path) drawn instead of the built-in crosshair, e.g. an icon from
          a crosshair icon collection. Empty: the built-in one.
      - key: WAL_KONAMI_CROSSHAIR_P2
        label: P2 image
        kind: text
      - key: WAL_KONAMI_CROSSHAIR_P3
        label: P3 image
        kind: text
      - key: WAL_KONAMI_CROSSHAIR_P4
        label: P4 image
        kind: text
      - key: WAL_KONAMI_CROSSHAIR_TINT
        label: Images in the player's color
        kind: bool
        description: >-
          A dark image (an icon silhouette) is drawn in the player's color, a colored one
          tinted with it. Off: images as they are.

input:
  # each player's gun (or mouse) aims, its trigger throws a ball there
  guns_enabled: true
  stick_as_dpad: false

controls:
  lx: Aim (x)
  ly: Aim (y)
  b1: Throw a ball
  start: Start
  coin: Coin
  service: Service
  test: Test
