# WORLD SOCCER Winning Eleven ARCADE CHAMPIONSHIP 2008 (Konami, game code HCK): an arcade stick
# with six buttons (the PJEI board), HCK/bin/game.exe (Direct3D 8). The payload replaces
# libacio.dll (PJEI board, PS2 pad port, card reader) and answers the game's libtouchpanel.dll
# imports (never touched: the controller choice is taken when its timer runs out, the arcade
# stick).
# Override values in userprofiles/konami/winning-eleven-2008.yaml.
system: konami
name: Winning Eleven 2008

# The dump's D3D8.dll is dgVoodoo (Direct3D 12 output): Wine's own is used.
hide: [D3D8.dll]

# The match's sound effects (players, ball, referee) are DirectMusic: the prefix's native
# DirectMusic (other games' tricks) fails with wine's dsound, wine's own plays them.
dll_overrides:
  dmband: b
  dmcompos: b
  dmime: b
  dmloader: b
  dmscript: b
  dmstyle: b
  dmsynth: b
  dmusic: b
  dmusic32: b
  dswave: b

env:
  # Japanese text (messages, test menu) in Shift-JIS
  WAL_ANSI_CODEPAGE: "932"
  WAL_FONT_CODEPAGE: "932"
  # the e-Amusement services from the loader's own server ("0": offline, guest play only)
  WAL_KONAMI_EASRV: "1"
  # an external e-Amusement server's host (e.g. 192.168.1.10:8083) instead (empty: the loader's)
  WAL_KONAMI_SERVICES: ""

# The game's own options, for the GUI's Options tab (its env variables above).
options:
  - title: Game
    options:
      - key: WAL_KONAMI_EASRV
        label: e-Amusement server
        kind: bool
        description: >-
          The game's e-Amusement services from the loader's own server: e-Amusement cards and
          their saved teams. Off: offline, guest play only.
      - key: WAL_KONAMI_SERVICES
        label: External e-Amusement server
        kind: text
        description: >-
          An external e-Amusement server's address (e.g. 192.168.1.10:8083), used instead of
          the loader's own. Empty: the loader's server (when on).

input:
  # the arcade stick's buttons where a soccer game has them on a pad: cross short pass, circle
  # long pass, square shoot, R1 dash dribble, L1 switch player
  gamepad:
    a: b2
    b: b3
    x: b4
    y: none
    r1: b1
    l1: b5
    r2: b6
    l2: none
  # Keyboard: the numpad is the PIN screen's keypad (the card's PIN)
  keyboard:
    p1:
      KEY_KP0: kp0
      KEY_KP1: kp1
      KEY_KP2: kp2
      KEY_KP3: kp3
      KEY_KP4: kp4
      KEY_KP5: kp5
      KEY_KP6: kp6
      KEY_KP7: kp7
      KEY_KP8: kp8
      KEY_KP9: kp9
    # the numpad is the PIN keypad (player 1), not player 4's keys
    p4:
      KEY_KP8: none
      KEY_KP2: none
      KEY_KP4: none
      KEY_KP6: none
      KEY_KP0: none

controls:
  up: Up
  down: Down
  left: Left
  right: Right
  b1: A (dash dribble)
  b2: B (short pass)
  b3: C (long pass)
  b4: D (shoot)
  b5: E (switch player)
  b6: F (dribble)
  start: Start
  coin: Coin
  service: Service
  test: Test
  card: Insert / eject the card
  kp0: Card keypad 0
  kp1: Card keypad 1
  kp2: Card keypad 2
  kp3: Card keypad 3
  kp4: Card keypad 4
  kp5: Card keypad 5
  kp6: Card keypad 6
  kp7: Card keypad 7
  kp8: Card keypad 8
  kp9: Card keypad 9
