# Rainbow Bomber Girl (Konami, 2022): game.exe (Unity 2017.2, Mono, 64-bit, Direct3D 11). The
# cabinet's BM-System (system library, I/O board on COM6, touch screen) is answered by the
# payload, installed as the winhttp.dll UnityPlayer imports. The e-Amusement card (F4, the card
# window's card and PIN) logs a player in, kept by the payload; no card: guest play.
# The two monitors (portrait main, landscape touch screen on its side) shown on one screen:
# main on the right, touch screen bottom left, the dump's bezel.png above it.
# Override values in userprofiles/konami/rainbow-bombergirl.yaml.
system: konami
name: Rainbow Bomber Girl

# windowed at the cabinet's 2160x1920 desktop (the game lays its cameras out for it; Unity full
# screen would take the screen's size), the window the screen's size, borderless: the picture
# stretched to it, then composed for the screen (WAL_KONAMI_LAYOUT)
args: [-logFile, output_log.txt, -screen-fullscreen, "0", -screen-width, "2160", -screen-height, "1920", -popupwindow]

# the payload in place of the dump's winhttp.dll (Unity Doorstop's BepInEx loader, not used)
payload_install: [winhttp.dll]
dll_overrides:
  winhttp: "n,b"

env:
  WAL_WINDOW_SIZE: screen
  WAL_WINDOW_POPUP: "1"
  # the game reads its data tables (CSV) with the user's number format: a "." decimal point
  # needed (a French locale stops the game at its start)
  LC_ALL: en_US.UTF-8
  # the export version's texts and pictures (English); "" the Japanese version
  WAL_KONAMI_REGION: asia
  # credits per game (a coin is a credit); WAL_KONAMI_FREEPLAY: "1" free play
  WAL_KONAMI_PRICE: "1"
  # main_left: the main monitor on the left, the touch screen on the right (no bezel)
  WAL_KONAMI_LAYOUT: ""

input:
  # the touch screen: a gun or the mouse points (accel, brake: the pointer across the
  # screen), its trigger touches
  guns_enabled: true
  stick_as_dpad: false
  gun:
    x: accel
    y: brake
    BTN_LEFT: b7
    BTN_RIGHT: none
    BTN_MIDDLE: none

controls:
  lx: Stick (x)
  ly: Stick (y)
  up: Stick up
  down: Stick down
  left: Stick left
  right: Stick right
  b1: Bomb
  b2: Skill 1
  b3: Skill 2
  b4: Back (stick button)
  b5: Remote detonation
  b7: Touch the screen
  accel: Touch position (x)
  brake: Touch position (y)
  start: Bomb
  coin: Coin
  service: Service
  test: Test
