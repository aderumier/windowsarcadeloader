# Dance Dance Revolution (Konami, 2013, game code MDX): modules/mdxja_945.dll (Direct3D 9, the
# P3IO cabinets' build; mdxja_hm65.dll is the P4IO ones'), run by wal-avs-boot.exe (the dump's
# dance-dance-revolution-2013.windowsloader names it), which loads the payload (libacio.dll)
# after it. The payload answers the cabinet's boards: P3IO (inputs, lights, the security plug
# signed for MDX, the card readers on its ACIO bus), the pads' and satellites' light boards
# (COM1, COM2), the USB memory port (COM3), the dongles (kbt.dll).
# e-Amusement: the loader's own server (cards for both players, their dancers, scores and
# courses), or offline with WAL_KONAMI_EASRV "0" (SERVICE at the network error).
# Override values in userprofiles/konami/dance-dance-revolution-2013.yaml.
system: konami
name: Dance Dance Revolution 2013

env:
  WAL_ANSI_CODEPAGE: "932"
  WAL_FONT_CODEPAGE: "932"
  WAL_WINDOW_POPUP: "1"
  WAL_WINDOW_SIZE: screen
  WAL_HIDE_CURSOR: "1"
  WAL_DINPUT_DISABLE: "1"
  # the e-Amusement services from the loader's own server ("0": offline)
  WAL_KONAMI_EASRV: "1"
  # an external e-Amusement server's services URL instead (empty: the loader's)
  WAL_KONAMI_SERVICES: ""

# The game's own options, for the GUI's Options tab (its env variables above).
options:
  - title: Game
    options:
      - key: WAL_KONAMI_EASRV
        label: e-Amusement server
        kind: bool
        description: >-
          The game's e-Amusement services from the loader's own server: e-Amusement cards (one
          per player) and their dancers, scores and courses. Off: offline (SERVICE skips the
          network error at boot).
      - key: WAL_KONAMI_SERVICES
        label: External e-Amusement server
        kind: text
        description: >-
          An external e-Amusement server's services URL (e.g. http://192.168.1.10:8083/), used
          instead of the loader's own. Empty: the loader's server (when on).

input:
  # Keyboard: the numpad is player 1's card keypad (the card's PIN), F5 player 2's card
  keyboard:
    p1:
      KEY_KP0: kp0
      KEY_KP1: kp1
      KEY_KP2: kp2
      KEY_KP3: kp3
      KEY_KP4: kp4
      KEY_KP5: kp5
      KEY_KP6: kp6
      KEY_KP7: kp7
      KEY_KP8: kp8
      KEY_KP9: kp9
    p2:
      KEY_F5: card
    # the numpad is the card keypad (player 1), not player 4's keys
    p4:
      KEY_KP8: none
      KEY_KP2: none
      KEY_KP4: none
      KEY_KP6: none
      KEY_KP0: none

# Each player: the dance pad's arrows (the stick's directions), START, the cabinet's menu
# buttons left / right (b1, b2) and up / down (b3, b4).
controls:
  up: Pad up
  down: Pad down
  left: Pad left
  right: Pad right
  b1: Menu left
  b2: Menu right
  b3: Menu up
  b4: Menu down
  start: Start
  coin: Coin
  service: Service
  test: Test
  card: "Insert / eject the card (player 1: F4, player 2: F5)"
  kp0: Card keypad 0
  kp1: Card keypad 1
  kp2: Card keypad 2
  kp3: Card keypad 3
  kp4: Card keypad 4
  kp5: Card keypad 5
  kp6: Card keypad 6
  kp7: Card keypad 7
  kp8: Card keypad 8
  kp9: Card keypad 9
