# WORLD SOCCER Winning Eleven ARCADE CHAMPIONSHIP 2012 (Konami, game code KCK): an arcade stick
# with six buttons (the PJEI board), a PS2 and a PS3 pad port, a touch screen. The game is
# contents/modules/weac12_bootstrap_release.dll (Direct3D 9), run by wal-avs-boot.exe from
# contents/ (the dump's winning-eleven-2012.windowsloader names the DLL). The payload replaces
# libacio.dll (PJEI, PJEC PS2 pad, I36I PS3 pad, card reader) and answers the touch screen.
# Override values in userprofiles/konami/winning-eleven-2012.yaml.
system: konami
name: Winning Eleven 2012

env:
  # the game's AVS heaps (the 16 MB default is too small)
  WAL_KONAMI_AVS_HEAP_MB: "30"
  # the cabinet's region: A Asia (English text, data/convert/ac/english: this dump's), J Japan
  # (data/convert/ac/j), C China (data/convert/ac/csimpl)
  WAL_KONAMI_DEST: "A"
  # Japanese text (messages, test menu) in Shift-JIS
  WAL_ANSI_CODEPAGE: "932"
  WAL_FONT_CODEPAGE: "932"
  # e-Amusement: the loader's server (cards, PIN typed by itself, the players' teams saved);
  # "0": offline (local mode), guest play only
  WAL_KONAMI_EASRV: "1"
  # an external e-Amusement server's services URL instead (e.g. http://192.168.1.10:8083/)
  WAL_KONAMI_SERVICES: ""
  # the touch pointer: a small red dot where the mouse or gun points
  WAL_CROSSHAIR: "1"
  WAL_KONAMI_CROSSHAIR_AXES: right-stick
  WAL_KONAMI_CROSSHAIR_STYLE: disc
  WAL_KONAMI_CROSSHAIR_SIZE: "1"
  WAL_KONAMI_CROSSHAIR_COLOR: FF2020
  WAL_KONAMI_CROSSHAIR_HIDE: "0"

options:
  - title: Game
    options:
      - key: WAL_KONAMI_EASRV
        label: e-Amusement server
        kind: bool
        description: >-
          The game's e-Amusement services from the loader's own server: e-Amusement cards and
          their saved teams. Off: offline (local mode), guest play only.
      - key: WAL_KONAMI_SERVICES
        label: External e-Amusement server
        kind: text
        description: >-
          An external e-Amusement server's services URL (e.g. http://192.168.1.10:8083/), used
          instead of the loader's own. Empty: the loader's server (when on).
      - key: WAL_CROSSHAIR
        label: Touch pointer
        kind: bool
        description: >-
          A small red dot where the mouse or gun points (the touch position).
      - key: WAL_KONAMI_CROSSHAIR_SIZE
        label: Touch pointer size
        kind: number
        min: 1
        max: 6
        description: >-
          The dot's size, in percent of the screen height.

input:
  # Keyboard: the numpad types the card's PIN (when none is configured)
  keyboard:
    p1:
      KEY_KP0: kp0
      KEY_KP1: kp1
      KEY_KP2: kp2
      KEY_KP3: kp3
      KEY_KP4: kp4
      KEY_KP5: kp5
      KEY_KP6: kp6
      KEY_KP7: kp7
      KEY_KP8: kp8
      KEY_KP9: kp9
    # the numpad is the card's PIN (player 1), not player 4's keys
    p4:
      KEY_KP8: none
      KEY_KP2: none
      KEY_KP4: none
      KEY_KP6: none
      KEY_KP0: none
  # the touch screen (the controller and mode choices; untouched, their timers choose the
  # arcade stick and the COM match): the mouse or a gun
  guns_enabled: true
  gun:
    x: rx
    y: ry
    BTN_LEFT: b7
  # the arcade stick's buttons where a soccer game has them on a pad: cross short pass, circle
  # long pass, square shoot, R1 dash dribble, L1 switch player
  gamepad:
    a: b2
    b: b3
    x: b4
    y: none
    r1: b1
    l1: b5
    r2: b6
    l2: none

controls:
  up: Up
  down: Down
  left: Left
  right: Right
  b1: A (dash dribble)
  b2: B (short pass)
  b3: C (long pass)
  b4: D (shoot)
  b5: E (switch player)
  b6: F (dribble)
  b7: Touch the screen
  rx: Touch position (x)
  ry: Touch position (y)
  start: Start
  coin: Coin
  service: Service
  test: Test
  card: Insert / eject the card
